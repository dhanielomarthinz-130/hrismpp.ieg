<script>
    /* =====================================================================
       HRIS MPP — IEG · SPA (vanilla JS, google.script.run)
       ===================================================================== */
    const S = {
        token: null, user: null, master: null, page: 'dashboard', timer: null,
        dash: {}, abs: {}, jad: {}, wa: {}, op: { q: '', bagian: '', employer: '', status: 'aktif' }
    };
    const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const HARI3 = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
    const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const STATUS = { H: 'Hadir', T: 'Telat', S: 'Sakit', I: 'Izin', A: 'Alpa', C: 'Cuti' };
    const GRUP_LABEL = { A: 'Rolling A', B: 'Rolling B', S1: 'Tetap Shift 1', S2: 'Tetap Shift 2', NS: 'Non Shift' };

    const ICONS = {
        dashboard: '<span class="material-symbols-outlined">dashboard</span>',
        absensi: '<span class="material-symbols-outlined">how_to_reg</span>',
        data_absen: '<span class="material-symbols-outlined">assignment_turned_in</span>',
        jadwal_ieg: '<span class="material-symbols-outlined">event_note</span>',
        jadwal: '<span class="material-symbols-outlined">calendar_month</span>',
        request_os: '<span class="material-symbols-outlined">chat</span>',
        req_approval: '<span class="material-symbols-outlined">fact_check</span>',
        rekap: '<span class="material-symbols-outlined">summarize</span>',
        operator: '<span class="material-symbols-outlined">badge</span>',
        bagian: '<span class="material-symbols-outlined">domain</span>',
        pengaturan: '<span class="material-symbols-outlined">settings</span>',
        akses: '<span class="material-symbols-outlined">admin_panel_settings</span>',
        maintenance: '<span class="material-symbols-outlined">construction</span>',
        menu: '<span class="material-symbols-outlined">menu</span>'
    };

    const PAGES = [
        { id: 'dashboard', label: 'Dashboard MPP', short: 'Dashboard', roles: ['ADMIN', 'SUPERVISOR', 'VIEWER'], bottom: true },
        { id: 'request_os', label: 'Request OS', short: 'Request OS', roles: ['ADMIN', 'SUPERVISOR', 'LEADER', 'VIEWER'], bottom: true },
        { id: 'req_approval', label: 'Approval Request OS', short: 'Approval OS', roles: ['ADMIN', 'SUPERVISOR'], bottom: true },
        { id: 'jadwal_ieg', label: 'Jadwal IEG', short: 'Jadwal IEG', roles: ['ADMIN', 'SUPERVISOR', 'LEADER', 'VIEWER'], bottom: true },
        { id: 'absensi', label: 'Absensi Shift', short: 'Absensi', roles: ['ADMIN', 'SUPERVISOR', 'LEADER'], bottom: true },
        { id: 'data_absen', label: 'Data Absensi', short: 'Data Absen', roles: ['ADMIN', 'SUPERVISOR', 'LEADER', 'VIEWER'] },
        { id: 'jadwal', label: 'Jadwal Employee', short: 'Jadwal', roles: ['ADMIN', 'SUPERVISOR', 'LEADER', 'VIEWER'], bottom: true },
        { id: 'rekap', label: 'Rekap MPP', short: 'Rekap', roles: ['ADMIN', 'SUPERVISOR', 'LEADER', 'VIEWER'], bottom: true },
        { id: 'operator', label: 'Operator', roles: ['ADMIN', 'SUPERVISOR'], sec: 'Master data' },
        { id: 'bagian', label: 'Bagian & Target', roles: ['ADMIN', 'SUPERVISOR'] },
        { id: 'pengaturan', label: 'Pengaturan', roles: ['ADMIN', 'SUPERVISOR'], sec: 'Sistem' },
        // Menu khusus super admin (tidak pernah tampil untuk user lain)
        { id: 'akses', label: 'Control Akses', roles: [], superOnly: true, sec: 'Super admin' },
        { id: 'maintenance', label: 'Maintenance', roles: [], superOnly: true }
    ];

    /* ------------------------------ util ------------------------------ */
    const $ = (s, el) => (el || document).querySelector(s);
    const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { } }
    };
    function utc(ymd) { const p = ymd.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
    function addDays(ymd, n) { return new Date(utc(ymd) + n * 864e5).toISOString().slice(0, 10); }
    function dow(ymd) { return new Date(utc(ymd)).getUTCDay(); }
    function monday(ymd) { const w = dow(ymd); return addDays(ymd, w === 0 ? -6 : 1 - w); }
    function fmtTgl(ymd) { if (!ymd) return ''; const p = ymd.split('-'); return HARI[dow(ymd)] + ', ' + p[2] + ' ' + BULAN[+p[1] - 1] + ' ' + p[0]; }
    function fmtShort(ymd) { const p = ymd.split('-'); return p[2] + ' ' + BULAN[+p[1] - 1]; }
    function shiftName(k) { const s = (S.master.shifts || []).find(x => x.kode === k); return s ? s.nama : k; }
    function shiftTime(k) { const s = (S.master.shifts || []).find(x => x.kode === k); return s ? s.mulai + '–' + s.selesai : ''; }
    function bagName(k) { const b = (S.master.bagian || []).find(x => x.kode === k); return b ? b.nama : k; }
    function role() { return S.user ? S.user.role : ''; }
    function isAdmin() { return role() === 'ADMIN' || role() === 'SUPERVISOR'; }
    function isSuper() { return !!(S.user && S.user.super); }
    function isSupervisor() { return role() === 'SUPERVISOR' || isSuper(); }
    // Control Akses: false bila menu diatur "lihat saja" untuk user ini
    function menuEdit(page) { return isSuper() || !((S.master && S.master.roMenus) || []).includes(page); }
    function canApprove() { return (role() === 'SUPERVISOR' || isSuper()) && menuEdit('req_approval'); }
    function isEditor() { return role() === 'ADMIN' || role() === 'SUPERVISOR' || role() === 'LEADER'; }
    function canEdit(bag) {
        if (isAdmin() || isSupervisor()) return true;
        if (role() !== 'LEADER') return false;
        return !S.user.bagian.length || S.user.bagian.indexOf(String(bag || '').toUpperCase()) >= 0;
    }
    function liburLabel(v) { return String(v || '').split(',').filter(String).map(n => HARI3[+n]).join(', ') || '—'; }

    function call(action, payload, opt) {
        opt = opt || {};
        if (!opt.silent) loading(true);
        if (window.google && window.google.script && window.google.script.run) {
            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler(r => {
                        if (!opt.silent) loading(false);
                        if (r && r.ok) return resolve(r.data);
                        const err = new Error(r ? r.error : 'Tidak ada respons dari server');
                        if (r && r.auth) { doLogout(true); }
                        reject(err);
                    })
                    .withFailureHandler(e => { if (!opt.silent) loading(false); reject(e instanceof Error ? e : new Error(String(e))); })
                    .api(action, S.token, payload || {});
            });
        }
        return fetch('api.php?action=' + encodeURIComponent(action), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Token': S.token || ''
            },
            body: JSON.stringify(payload || {})
        })
            .then(res => res.json())
            .then(r => {
                if (!opt.silent) loading(false);
                if (r && r.ok) return r.data;
                const err = new Error(r ? r.error : 'Tidak ada respons dari server');
                if (r && r.auth) { doLogout(true); }
                throw err;
            })
            .catch(e => {
                if (!opt.silent) loading(false);
                throw (e instanceof Error ? e : new Error(String(e)));
            });
    }

    let loadingCount = 0;
    function loading(on) {
        loadingCount = Math.max(0, loadingCount + (on ? 1 : -1));
        $('#loading').classList.toggle('hidden', loadingCount === 0);
    }
    function toast(msg, type) {
        const el = document.createElement('div');
        el.className = 'toast ' + (type || '');
        el.textContent = msg;
        $('#toasts').appendChild(el);
        setTimeout(() => el.remove(), type === 'err' ? 6000 : 3200);
    }
    function fail(e) { toast(e.message || String(e), 'err'); }

    /* ------------------------------ modal ------------------------------ */
    let modalLocked = false;
    function openModal(o) {
        $('#modal .modal-card').classList.toggle('wide', !!o.wide);
        $('#modalTitle').textContent = o.title || '';
        $('#modalBody').innerHTML = o.body || '';
        const foot = $('#modalFoot');
        foot.innerHTML = '';
        (o.buttons || []).forEach(b => {
            const btn = document.createElement('button');
            btn.className = 'btn ' + (b.cls || '');
            btn.textContent = b.label;
            btn.onclick = () => b.onClick ? b.onClick(btn) : closeModal();
            foot.appendChild(btn);
        });
        foot.classList.toggle('hidden', !(o.buttons || []).length);
        modalLocked = !!o.locked;
        $('#modal [data-close]').classList.toggle('hidden', modalLocked);
        $('#modal').classList.remove('hidden');
        if (o.onOpen) o.onOpen($('#modalBody'));
        const f = $('#modalBody input:not([type=checkbox]), #modalBody select, #modalBody textarea');
        if (f && window.innerWidth > 640) setTimeout(() => f.focus(), 50);
    }
    function closeModal() { if (modalLocked) return; $('#modal').classList.add('hidden'); }
    function formData(root) {
        const o = {};
        $$('[name]', root).forEach(el => {
            if (el.type === 'checkbox') {
                if (el.dataset.multi) { (o[el.name] = o[el.name] || []); if (el.checked) o[el.name].push(el.value); }
                else o[el.name] = el.checked;
            } else o[el.name] = el.value;
        });
        return o;
    }
    function confirmBox(title, msg, okLabel, cls) {
        return new Promise(res => openModal({
            title: title, body: '<p>' + esc(msg).replace(/\n/g, '<br>') + '</p>',
            buttons: [{ label: 'Batal', onClick: () => { closeModal(); res(false); } },
            { label: okLabel || 'Ya', cls: cls || 'primary', onClick: () => { closeModal(); res(true); } }]
        }));
    }

    async function copyText(text) {
        try { await navigator.clipboard.writeText(text); return true; }
        catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (x) { }
            ta.remove();
            return ok;
        }
    }

    /* ------------------------------ tema ------------------------------ */
    function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        store.set('hris_theme', t);
        $$('.theme-label').forEach(el => el.textContent = t === 'morning' ? 'Evening' : 'Morning');
        $$('[data-theme-toggle] .theme-icon').forEach(el => el.textContent = t === 'morning' ? 'dark_mode' : 'light_mode');
        const meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.content = t === 'morning' ? '#4F46E5' : '#12171C';
    }
    function toggleTheme() { applyTheme(document.documentElement.getAttribute('data-theme') === 'morning' ? 'evening' : 'morning'); }

    /* ------------------------------ auth ------------------------------ */
    async function boot() {
        applyTheme(store.get('hris_theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'evening' : 'morning'));
        S.token = store.get('hris_token');
        if (S.token) {
            try { await loadMaster(); enterShell(); return; } catch (e) { S.token = null; store.set('hris_token', null); }
        }
        showLogin();
    }
    function showLogin() {
        // Buang nama file & garis miring di akhir: "/" -> "", "/solihin_appsrcipt/" -> "/solihin_appsrcipt"
        // (tanpa ini, di root domain hasilnya "//login" yang dibaca browser sebagai host "login")
        const baseDir = location.pathname.replace(/\/(index\.php|Index\.html|login(\.php)?)\/?$/i, '').replace(/\/+$/, '');
        if (!/\/login$/i.test(location.pathname)) {
            window.location.replace((baseDir || '') + '/login');
            return;
        }
        $('#shell').classList.add('hidden');
        $('#login').classList.remove('hidden');
        call('publicInfo', {}, { silent: true }).then(d => { $('#loginVer').textContent = 'v' + d.version; $('#loginAppName').textContent = d.appName; }).catch(() => { });
        setTimeout(() => $('#lgUser').focus(), 50);
    }
    async function doLogin(ev) {
        ev.preventDefault();
        const btn = $('#lgBtn');
        $('#loginErr').classList.add('hidden');
        btn.disabled = true; btn.textContent = 'Memeriksa…';
        try {
            const d = await call('login', { username: $('#lgUser').value, password: $('#lgPass').value });
            S.token = d.token; S.user = d.user;
            store.set('hris_token', d.token);
            $('#lgPass').value = '';
            await loadMaster();
            enterShell();
            if (d.mustChange) changePasswordModal(true);
        } catch (e) {
            $('#loginErr').textContent = e.message;
            $('#loginErr').classList.remove('hidden');
        } finally { btn.disabled = false; btn.textContent = 'Masuk'; }
    }
    async function doLogout(expired) {
        if (!expired && S.token) { try { await call('logout', { token: S.token }, { silent: true }); } catch (e) { } }
        S.token = null; S.user = null; store.set('hris_token', null);
        clearInterval(S.timer);
        $('#modal').classList.add('hidden'); modalLocked = false;
        if (expired) toast('Sesi berakhir, silakan login ulang.', 'err');
        showLogin();
    }
    function changePasswordModal(forced) {
        openModal({
            title: forced ? 'Ganti password awal' : 'Ganti password', locked: forced,
            body: (forced ? '<div class="alert info">Demi keamanan, ganti password bawaan sebelum melanjutkan.</div>' : '') +
                '<label class="field"><span>Password lama</span><input type="password" name="oldPassword" autocomplete="current-password"></label>' +
                '<label class="field"><span>Password baru</span><input type="password" name="newPassword" autocomplete="new-password"><small>Minimal 6 karakter</small></label>' +
                '<label class="field"><span>Ulangi password baru</span><input type="password" name="confirm" autocomplete="new-password"></label>',
            buttons: (forced ? [] : [{ label: 'Batal' }]).concat([{
                label: 'Simpan', cls: 'primary', onClick: async () => {
                    const f = formData($('#modalBody'));
                    if (f.newPassword !== f.confirm) return toast('Konfirmasi password tidak sama.', 'err');
                    try { await call('changePassword', f); modalLocked = false; closeModal(); toast('Password diganti.', 'ok'); } catch (e) { fail(e); }
                }
            }])
        });
    }

    async function loadMaster() {
        S.master = await call('master', {}, { silent: true });
        S.user = S.master.user;
    }

    /* ------------------------------ shell ------------------------------ */
    // Menu yang boleh dibuka: super admin = semua; selain itu ikut Control Akses (bila diatur) atau bawaan role
    function allowedPages() {
        const menus = S.master && S.master.menus;
        return PAGES.filter(p => {
            if (p.superOnly) return isSuper();
            if (isSuper()) return true;
            if (Array.isArray(menus)) return menus.indexOf(p.id) >= 0;
            return p.roles.indexOf(role()) >= 0;
        });
    }
    function enterShell() {
        $('#login').classList.add('hidden');
        $('#shell').classList.remove('hidden');
        const name = S.master.settings.app_nama || 'HRIS Inventory';
        // Sidebar: nama PT sudah tampil di baris bawahnya, jadi cukup nama aplikasinya
        $('#sideAppName').textContent = 'HRIS Inventory'; document.title = name;
        $('#sideUser').textContent = S.user.nama;
        $('#sideRole').textContent = S.user.role + (S.user.bagian.length ? ' · ' + S.user.bagian.join(', ') : '');
        renderSideAvatar();
        let sec = '';
        $('#sideNav').innerHTML = allowedPages().map(p => {
            let h = '';
            if (p.sec && p.sec !== sec) { sec = p.sec; h += '<div class="side-sec">' + esc(p.sec) + '</div>'; }
            return h + '<a data-page="' + p.id + '"><span class="ico">' + (ICONS[p.id] || '') + '</span>' + esc(p.label) + '</a>';
        }).join('');
        $('#bottomNav').innerHTML = allowedPages().filter(p => p.bottom).slice(0, 4).map(p =>
            '<a data-page="' + p.id + '"><span class="ico">' + (ICONS[p.id] || '') + '</span>' + esc(p.short || p.label) + '</a>').join('') +
            '<a data-menu><span class="ico">' + ICONS.menu + '</span>Menu</a>';
        updateShiftChip();
        updateMtChip();
        if (S.user.mustChange) setTimeout(() => changePasswordModal(true), 300);
        const allowed = allowedPages();
        const defPage = (allowed[0] || PAGES[0]).id;
        const want = (location.hash || '').replace('#', '') || store.get('hris_page') || defPage;
        go(allowed.some(p => p.id === want) ? want : defPage);
    }
    function updateShiftChip() {
        const c = S.master.current;
        $('#shiftNow').innerHTML = (c.berjalan ? '<span class="shift-pulse" aria-hidden="true"></span>' : '') + esc(shiftName(c.kode)) + ' · ' + esc(shiftTime(c.kode));
    }
    function openSide(on) { $('#sidebar').classList.toggle('open', on); $('#scrim').classList.toggle('show', on); }

    function go(page) {
        if (page === 'wa') page = 'request_os'; // id lama
        const allowed = allowedPages();
        const p = allowed.find(x => x.id === page) || allowed[0] || PAGES[0];
        S.page = p.id;
        store.set('hris_page', p.id);
        const cleanPath = location.pathname.replace(/\/(index\.php|Index\.html|login(\.php)?)$/i, '/');
        history.replaceState(null, '', cleanPath + '#' + p.id);
        $$('[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === p.id));
        $('#pageTitle').textContent = p.label;
        $('#pageSub').textContent = '';
        clearInterval(S.timer);
        openSide(false);
        $('#view').innerHTML = '';
        $('#view').scrollTop = 0; window.scrollTo(0, 0);
        if (roObserver) { roObserver.disconnect(); roObserver = null; }
        const fn = RENDER[p.id];
        if (fn) fn().then(() => applyReadOnly(p)).catch(fail);
    }
    // Halaman yang diatur "lihat saja": tampilkan penanda; Bagian & Pengaturan seluruh form dikunci
    const RO_LOCK_ALL = ['bagian', 'pengaturan'];
    const RO_MENUS = ['request_os', 'req_approval', 'jadwal_ieg', 'absensi', 'jadwal', 'operator', 'bagian', 'pengaturan'];
    function applyReadOnly(p) {
        if (S.page !== p.id || menuEdit(p.id) || !RO_MENUS.includes(p.id)) return;
        const v = $('#view');
        if (!$('.ro-banner', v)) v.insertAdjacentHTML('afterbegin', '<div class="alert info ro-banner"><span class="material-symbols-outlined">visibility</span><span><b>Mode lihat saja.</b> Akses Anda untuk menu ini tidak bisa mengedit.</span></div>');
        if (RO_LOCK_ALL.includes(p.id)) {
            const lock = () => $$('button, input, select, textarea', v).forEach(el => {
                if (el.disabled || el.closest('.ro-banner, [data-ro-ok]') || el.type === 'search') return;
                el.disabled = true;
            });
            lock();
            // Bagian yang dimuat belakangan (daftar pengguna, log, dll.) ikut dikunci
            roObserver = new MutationObserver(lock);
            roObserver.observe(v, { childList: true, subtree: true });
        }
    }
    let roObserver = null;
    function refresh() { loadMaster().then(() => { updateShiftChip(); updateMtChip(); go(S.page); }).catch(fail); }
    function updateMtChip() {
        let c = $('#mtChip');
        if (!(isSuper() && S.master && S.master.maintenance)) { if (c) c.remove(); return; }
        if (!c) {
            c = document.createElement('button');
            c.id = 'mtChip'; c.type = 'button'; c.className = 'chip warn'; c.style.cursor = 'pointer'; c.style.border = '0';
            c.title = 'Buka menu Maintenance';
            c.onclick = () => go('maintenance');
            $('.top-actions').insertBefore(c, $('#shiftNow'));
        }
        c.innerHTML = '<span class="material-symbols-outlined">construction</span>Maintenance aktif';
    }

    /* =========================== FOTO PROFIL & OPERATOR =========================== */
    // Avatar: foto bila ada, selain itu huruf awal nama
    function avatarHtml(nama, foto) {
        return foto ? '<img src="' + esc(foto) + '" alt="" loading="lazy">' : esc(String(nama || '?').trim().charAt(0).toUpperCase() || '?');
    }
    function renderSideAvatar() {
        $('#sideAvatar').innerHTML = avatarHtml(S.user.nama, S.user.foto);
    }

    // Pilih gambar dari perangkat lalu perkecil di browser (maks 512px, JPEG) sebelum diupload
    function pickImage() {
        return new Promise((resolve, reject) => {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'image/jpeg,image/png,image/webp';
            inp.onchange = () => {
                const file = inp.files && inp.files[0];
                if (!file) return resolve(null);
                if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return reject(new Error('Pilih gambar JPG, PNG, atau WEBP.'));
                if (file.size > 10 * 1024 * 1024) return reject(new Error('Ukuran foto maksimal 10 MB.'));
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const max = 512, scale = Math.min(1, max / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.max(1, Math.round(img.width * scale));
                    c.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
                    ctx.drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url);
                    resolve(c.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak dapat dibaca.')); };
                img.src = url;
            };
            inp.click();
        });
    }

    function fotoEditorHtml(id, nama, foto) {
        return '<div class="foto-edit" id="' + id + '">' +
            '<span class="foto-ava">' + avatarHtml(nama, foto) + '</span>' +
            '<span class="foto-act"><button type="button" class="btn sm" data-foto-pick><span class="material-symbols-outlined">photo_camera</span> ' + (foto ? 'Ganti foto' : 'Unggah foto') + '</button>' +
            '<button type="button" class="btn sm ghost' + (foto ? '' : ' hidden') + '" data-foto-del><span class="material-symbols-outlined">delete</span> Hapus</button>' +
            '<small class="muted">JPG/PNG/WEBP · otomatis diperkecil</small></span></div>';
    }

    function profileModal() {
        const opRec = S.user.operatorId ? (S.master.operators || []).find(x => x.id === S.user.operatorId) : null;
        const op = opRec ? '<p class="small muted" style="margin:0 0 12px;text-align:center">Terhubung ke data operator <b>' + esc(opRec.nama) + '</b> — foto ini juga menjadi foto operator tersebut.</p>' : '';
        openModal({
            title: 'Profil saya',
            body: '<div style="text-align:center;margin-bottom:6px"><b style="font-size:15px">' + esc(S.user.nama) + '</b><div class="small muted">' + esc(S.user.username) + '</div></div>' +
                op + fotoEditorHtml('pfFoto', S.user.nama, S.user.foto),
            onOpen: body => {
                const box = $('#pfFoto', body);
                const apply = (url) => {
                    S.user.foto = url; renderSideAvatar();
                    $('.foto-ava', box).innerHTML = avatarHtml(S.user.nama, url);
                    $('[data-foto-del]', box).classList.toggle('hidden', !url);

            '<div class="kpi"><div class="lbl">Target MPP</div><div class="val">' + t.target + '</div><div class="sub">' + (t.target ? (t.gap < 0 ? 'Kurang ' + (-t.gap) : t.gap > 0 ? 'Lebih ' + t.gap : 'Pas') : 'Atur di menu Bagian') + '</div></div>' +
            '<div class="kpi"><div class="lbl">Terjadwal</div><div class="val">' + t.jadwal + '</div><div class="sub">Libur ' + d.off + (d.cuti.length ? ' · Cuti ' + d.cuti.length : '') + '</div></div>' +
            '<div class="kpi"><div class="lbl">Hadir</div><div class="val">' + t.hadir + '</div><div class="sub">Telat ' + t.T + '</div></div>' +
            '<div class="kpi"><div class="lbl">Tidak hadir</div><div class="val"' + (tidak ? ' style="color:var(--err)"' : '') + '>' + tidak + '</div><div class="sub">S ' + t.S + ' · I ' + t.I + ' · C ' + t.C + ' · A ' + t.A + '</div></div>' +
            '<div class="kpi"><div class="lbl">Belum absen</div><div class="val"' + (t.BELUM ? ' style="color:var(--warn)"' : '') + '>' + t.BELUM + '</div><div class="sub">Update s/d ' + d.generatedAt.slice(11, 16) + '</div></div>' +

            h += '<div class="card empty"><div class="big"><span class="material-symbols-outlined">event_busy</span></div><p>Belum ada jadwal untuk shift ini.</p>' +

            h += '<div class="card"><div class="card-head"><h2>MPP per bagian</h2><span class="muted small">hadir / ' + (t.target ? 'target' : 'terjadwal') + '</span></div><div class="bars">';
            d.bagian.forEach(g => {
                const b = g.target || g.jadwal;
                const pct = b ? Math.min(100, Math.round(g.hadir / b * 100)) : 0;
                const chips = [];
                if (g.T) chips.push('<span class="chip info">Telat ' + g.T + '</span>');
                if (g.S) chips.push('<span class="chip warn">Sakit ' + g.S + '</span>');
                if (g.I) chips.push('<span class="chip warn">Izin ' + g.I + '</span>');
                if (g.C) chips.push('<span class="chip pri">Cuti ' + g.C + '</span>');
                if (g.A) chips.push('<span class="chip err">Alpa ' + g.A + '</span>');
                if (g.BELUM) chips.push('<span class="chip">Belum ' + g.BELUM + '</span>');
                if (g.target && g.jadwal < g.target) chips.push('<span class="chip err">Jadwal kurang ' + (g.target - g.jadwal) + '</span>');
                const names = [];
                ['S', 'I', 'C', 'A', 'T', 'BELUM'].forEach(k => { if (g.list[k].length) names.push('<b>' + (STATUS[k] || 'Belum') + ':</b> ' + esc(g.list[k].join(', '))); });

    async function loadAbs() {

    /* ---------- Share hasil absensi (Employee RKA) ---------- */
    const isVacRow = r => r.isVacant || /vacant/i.test(r.nama);

    function absShareRows() {
        // Yang dilaporkan: karyawan RKA pada tampilan aktif (Request Hari Ini / Semua), tanpa filter divisi & pencarian
        const all = absData && absData.rows ? absData.rows : [];
        const hasScheduled = all.some(r => r.terjadwal);
        const showAll = (absMode === 'ALL') || (absMode === 'AUTO' && !hasScheduled);
        return all.filter(r => showAll || r.terjadwal);
    }

    function absCaption(rows) {
        const now = new Date();
        const jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        const cnt = k => rows.filter(r => r.status === k).length;
        const groups = {};
        rows.forEach(r => (groups[r.bagianTugas] = groups[r.bagianTugas] || []).push(r));
        const order = S.master.bagian.map(b => b.kode).filter(k => groups[k])
            .concat(Object.keys(groups).filter(k => !S.master.bagian.some(b => b.kode === k)));
        const hadir = cnt('H') + cnt('T');
        const L = [];
        L.push('*LAPORAN ABSENSI CLOCK-IN*');
        L.push('*Employee RKA · ' + (absData.tim || 'Inventory') + '*');
        L.push('');
        L.push('Tanggal : ' + absData.tanggalLabel);
        L.push('Shift   : ' + shiftName(absData.shift) + ' (' + shiftTime(absData.shift) + ')');
        L.push('');
        L.push('*Ringkasan*');
        L.push('Total karyawan : ' + rows.length + ' orang');
        L.push('✅ Hadir : ' + cnt('H'));
        if (cnt('T')) L.push('⏰ Telat : ' + cnt('T'));
        if (cnt('S')) L.push('🤒 Sakit : ' + cnt('S'));
        if (cnt('I')) L.push('📝 Izin : ' + cnt('I'));
        if (cnt('C')) L.push('🏖️ Cuti : ' + cnt('C'));
        if (cnt('A')) L.push('❌ Alpa : ' + cnt('A'));
        L.push('Kehadiran : ' + hadir + '/' + rows.length + ' (' + (rows.length ? Math.round(hadir / rows.length * 100) : 0) + '%)');
        order.forEach(k => {
            const list = groups[k].slice().sort((a, b) => (a.nama || '').localeCompare(b.nama || '', 'id', { sensitivity: 'base' }));
            const h = list.filter(r => r.status === 'H' || r.status === 'T').length;
            L.push('');
            L.push('*' + bagName(k).toUpperCase() + '* (' + h + '/' + list.length + ')');
            list.forEach((r, i) => {
                let s = (i + 1) + '. ' + r.nama + ' — ' + (STATUS[r.status] || r.status);
                if (Number(r.lembur) > 0) s += ' · lembur ' + r.lembur + ' jam';
                if (r.ket) s += ' (' + r.ket + ')';
                L.push(s);
            });
        });
        L.push('');
        L.push('Semua karyawan sudah ter-absen ✅');
        L.push('Dilaporkan oleh ' + (S.user.nama || S.user.username) + ' · ' + jam);
        return L.join('\n');
    }

    function absBlockedModal(belum, vac) {
        const byBag = {};
        belum.forEach(r => (byBag[r.bagianTugas] = byBag[r.bagianTugas] || []).push(r.nama));
        const listHtml = Object.keys(byBag).map(k =>
            '<div style="margin-bottom:10px"><b>' + esc(bagName(k)) + '</b> <span class="chip xs warn">' + byBag[k].length + '</span>' +
            '<ol style="margin:6px 0 0;padding-left:20px">' + byBag[k].sort((a, b) => a.localeCompare(b)).map(n => '<li>' + esc(n) + '</li>').join('') + '</ol></div>').join('');
        openModal({
            title: 'Absensi belum lengkap',
            body: '<div class="alert warn" style="margin-bottom:12px">Hasil absensi baru bisa di-share setelah <b>semua karyawan</b> diabsen (Clock-In, atau ditandai Telat/Sakit/Izin/Cuti/Alpa).</div>' +
                (belum.length ? '<p style="margin:0 0 8px"><b>' + belum.length + ' karyawan belum Clock-In:</b></p>' + listHtml : '') +
                (vac.length ? '<p style="margin:8px 0 0"><b>' + vac.length + ' slot VACANT</b> belum diisi nama karyawan pengganti.</p>' : ''),
            buttons: [{ label: 'Tutup', cls: 'primary' }]
        });
    }

    async function shareAbsensi() {
        if (!absData) return;
        await flushAbs();
        const rows = absShareRows();
        if (!rows.length) return toast('Belum ada karyawan RKA yang terjadwal di shift ini.', 'warn');
        const vac = rows.filter(isVacRow);
        const named = rows.filter(r => !isVacRow(r));
        const belum = named.filter(r => !r.status);
        if (belum.length || vac.length) {
            const contoh = belum.slice(0, 5).map(r => r.nama).join(', ') + (belum.length > 5 ? ', dan ' + (belum.length - 5) + ' lainnya' : '');
            toast('Belum bisa di-share. ' + (belum.length ? belum.length + ' karyawan belum Clock-In: ' + contoh : '') + (vac.length ? (belum.length ? '\n' : '') + vac.length + ' slot VACANT belum diisi.' : ''), 'warn');
            absBlockedModal(belum, vac);
            return;
        }
        const text = absCaption(named);
        const copied = await copyText(text);
        if (navigator.share) {
            try {
                await navigator.share({ title: 'Absensi ' + shiftName(absData.shift) + ' - ' + absData.tanggalLabel, text: text });
                toast('Hasil absensi berhasil dibagikan.', 'ok');
                return;
            } catch (err) {
                if (err.name === 'AbortError') return;
            }
        }
        window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
        toast('WhatsApp dibuka' + (copied ? ' — caption juga sudah disalin.' : '.'), 'ok');
    }

    function getFilteredAbsRows() {
        if (!absData || !absData.rows) return [];
        const q = ($('#aQ') ? $('#aQ').value : '').toLowerCase().trim();
        const hasScheduled = absData.rows.some(r => r.terjadwal);
        const showAll = (absMode === 'ALL') || (absMode === 'AUTO' && !hasScheduled) || !!q;
        return absData.rows.filter(r => {
            if (!showAll && !r.terjadwal) return false;
            if (absBagFilter && r.bagianTugas !== absBagFilter && r.bagian !== absBagFilter) return false;
            if (q && r.nama.toLowerCase().indexOf(q) < 0 && (r.nik || '').toLowerCase().indexOf(q) < 0) return false;
            return true;
        });
    }

    function updateAbsStats() {
        const stEl = $('#aStats');
        if (!stEl || !absData) return;
        const hasScheduled = absData.rows.some(r => r.terjadwal);
        const showAll = (absMode === 'ALL') || (absMode === 'AUTO' && !hasScheduled);
        const activeRows = absData.rows.filter(r => showAll || r.terjadwal);
        const vacSlots = activeRows.filter(r => r.isVacant || /vacant/i.test(r.nama)).length;
        const baseList = activeRows.filter(r => !r.isVacant && !/vacant/i.test(r.nama));
        const total = baseList.length;
        const masuk = baseList.filter(r => r.status === 'H' || r.status === 'T').length;
        const belum = baseList.filter(r => !r.status).length;
        const tidakHadir = baseList.filter(r => r.status && r.status !== 'H' && r.status !== 'T').length;
        const schedCount = absData.rows.filter(r => r.terjadwal).length;

        const approvalNoteHtml = absData.approvalStatus === 'PENDING'
            ? '<div class="alert warn" style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
              '<span><b>Request OS untuk Shift ini masih menunggu Approval Supervisor.</b> Jadwal &amp; daftar hadir otomatis masuk setelah di-Approve Supervisor.</span>' +
              '<button type="button" class="btn xs primary" onclick="go(\'request_os\')">Buka Request OS →</button></div>'
            : (absData.approvalStatus === 'APPROVED'
                ? '<div class="row" style="margin-bottom:8px;gap:6px"><span class="chip xs ok"><span class="material-symbols-outlined">check_circle</span> Request OS Approved oleh ' + esc(absData.approvedBy || 'Supervisor') + '</span></div>'
                : '');

        stEl.innerHTML =
            approvalNoteHtml +
            '<div class="abs-summary-bar">' +
            '<div class="abs-kpi-group">' +
            '<div class="abs-kpi"><span class="abs-kpi-lbl">Total Karyawan</span><b class="abs-kpi-val">' + total + '</b></div>' +
            '<div class="abs-kpi ok"><span class="abs-kpi-lbl">Sudah Clock-In</span><b class="abs-kpi-val">' + masuk + '</b></div>' +
            '<div class="abs-kpi warn"><span class="abs-kpi-lbl">Belum Clock-In</span><b class="abs-kpi-val">' + belum + '</b></div>' +
            (vacSlots > 0 ? '<div class="abs-kpi warn"><span class="abs-kpi-lbl">Slot Vacant (Isi Nama)</span><b class="abs-kpi-val">' + vacSlots + '</b></div>' : '') +
            (tidakHadir > 0 ? '<div class="abs-kpi err"><span class="abs-kpi-lbl">Izin / Sakit / Alpa</span><b class="abs-kpi-val">' + tidakHadir + '</b></div>' : '') +
            '</div>' +
            '<div class="seg sm">' +
            '<button type="button" data-amode="SCHED" class="' + (!showAll ? 'on' : '') + '">Request Hari Ini (' + schedCount + ')</button>' +
            '<button type="button" data-amode="ALL" class="' + (showAll ? 'on' : '') + '">Semua (' + absData.rows.length + ')</button>' +
            '</div>' +
            '</div>';

        $$('[data-amode]').forEach(b => b.onclick = () => {
            absMode = b.dataset.amode;
            renderAbsList();
        });
    }

    function renderAbsList() {
        updateAbsStats();
        const rows = getFilteredAbsRows();
        if (!rows.length) {
            $('#aBody').innerHTML = '<div class="card empty"><div class="big"><span class="material-symbols-outlined">inbox</span></div><p>Tidak ada karyawan pada filter ini.</p>' +
                '<div class="row" style="justify-content:center;margin-top:10px;gap:8px">' +
                '<button class="btn sm primary" id="aShowAllBtn">Tampilkan Semua Karyawan</button>' +
                '<button class="btn sm ghost" onclick="go(\'request_os\')">Buka Request OS →</button></div></div>';
            if ($('#aShowAllBtn')) $('#aShowAllBtn').onclick = () => { absMode = 'ALL'; renderAbsList(); };
            return;
        }
        const availDatalist = '<datalist id="vacOpSuggestions">' +
            (absData.available || []).filter(o => !/vacant/i.test(o.nama)).map(o => '<option value="' + esc(o.nama) + '">' + esc(bagName(o.bagian)) + '</option>').join('') +
            '</datalist>';

        const groups = {};
        rows.forEach(r => (groups[r.bagianTugas] = groups[r.bagianTugas] || []).push(r));
        const order = S.master.bagian.map(b => b.kode).filter(k => groups[k]).concat(Object.keys(groups).filter(k => !S.master.bagian.some(b => b.kode === k)));
        $('#aBody').innerHTML = availDatalist + order.map(k => {
            const list = groups[k].slice().sort((a, b) => {
                const vacA = (a.isVacant || /vacant/i.test(a.nama)) ? 0 : 1; // Tampilkan slot VACANT di paling atas divisi agar langsung terlihat & dinamai
                const vacB = (b.isVacant || /vacant/i.test(b.nama)) ? 0 : 1;
                if (vacA !== vacB) return vacA - vacB;
                return (a.nama || '').localeCompare(b.nama || '');
            });
            const namedList = list.filter(r => !r.isVacant && !/vacant/i.test(r.nama));
            const vacInGroup = list.length - namedList.length;
            const hadir = namedList.filter(r => r.status === 'H' || r.status === 'T').length;
            const editable = list.some(r => r.canEdit);
            return '<div class="grp"><div class="grp-head">' +
                '<span>' + esc(bagName(k)) + '</span>' +
                '<span class="chip pri" data-cnt="' + k + '">' + hadir + ' / ' + list.length + ' Masuk</span>' +
                (vacInGroup > 0 ? '<span class="chip xs warn">' + vacInGroup + ' Slot Vacant Belum Dinamai</span>' : '') +
                '<span class="spacer"></span>' +
                (editable && namedList.length ? '<button class="btn xs ghost" data-allh="' + k + '"><span class="material-symbols-outlined" style="font-size:15px">done_all</span> Clock-In Divisi</button>' : '') +

                list.map((r, idx) => absRow(r, idx)).join('') + '</div></div>';
        }).join('');

        $$('.clockin-check').forEach(cb => cb.onchange = () => {
            const id = cb.closest('.att').dataset.id;
            setStatus(id, cb.checked ? 'H' : '', true);
        });
        $$('.stat-btns button').forEach(b => b.onclick = () => setStatus(b.closest('.att').dataset.id, b.dataset.s));
        $$('.att .lem').forEach(i => i.onchange = () => queueAbs(i.closest('.att').dataset.id, { lembur: i.value }));
        $$('.att .ket').forEach(i => i.onchange = () => queueAbs(i.closest('.att').dataset.id, { ket: i.value }));
        $$('[data-allh]').forEach(b => b.onclick = () => {
            absData.rows.filter(r => r.bagianTugas === b.dataset.allh && r.canEdit && !r.isVacant && !/vacant/i.test(r.nama) && r.status !== 'H').forEach(r => setStatus(r.operatorId, 'H', true));
        });
        $$('[data-rm]').forEach(b => b.onclick = () => removeFromShift(b.dataset.rm));

        // Handler pengisian nama karyawan pada Slot VACANT di halaman Absensi
        $$('[data-vac-save]').forEach(btn => btn.onclick = async () => {
            const rowEl = btn.closest('.att');
            const vacId = rowEl.dataset.id;
            const bag = rowEl.dataset.bag;
            const inp = $('.vac-fill-input', rowEl);
            const nama = (inp ? inp.value : '').trim();
            if (!nama) {
                if (inp) inp.focus();
                return toast('Ketik nama karyawan pengisi Vacant terlebih dahulu.', 'warn');
            }
            btn.disabled = true;
            try {
                await flushAbs();
                const res = await call('fillVacant', {
                    tanggal: S.abs.tanggal,
                    shift: S.abs.shift,
                    vacantId: vacId,
                    bagian: bag,
                    nama: nama
                });
                toast('Slot Vacant diisi oleh ' + res.nama + ' & otomatis Clock-In!', 'ok');
                await Promise.all([loadMaster(), loadAbs()]);
            } catch (e) {
                btn.disabled = false;
                fail(e);
            }
        });
        $$('.vac-fill-input').forEach(inp => inp.onkeydown = e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const btn = $('[data-vac-save]', inp.closest('.att'));
                if (btn) btn.click();
            }
        });
    }

            '<input class="ket" placeholder="Catatan…" value="' + esc(r.ket) + '"' + dis + '>' +

    }

    function setStatus(id, s, force) {
        const r = absData.rows.find(x => x.operatorId === id);
        if (!r || !r.canEdit) return;
        r.status = (!force && r.status === s) ? '' : s;
        if (r.status === 'H' || r.status === 'T') {
            r.terjadwal = true;
            if (!r.updatedAt) {
                const now = new Date();
                r.updatedAt = now.toISOString().slice(0, 10) + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':00';
            }
        }
        const el = $('.att[data-id="' + id + '"]');
        if (el) {
            const isMasuk = r.status === 'H' || r.status === 'T';
            el.classList.toggle('is-clocked-in', isMasuk);
            const cb = $('.clockin-check', el);
            if (cb) cb.checked = isMasuk;
            const pill = $('.clockin-pill', el);
            if (pill) {
                pill.classList.toggle('on', isMasuk);
                const ico = $('.material-symbols-outlined', pill);
                if (ico) ico.textContent = isMasuk ? 'check_circle' : 'radio_button_unchecked';
                const txt = $('.clockin-text', pill);
                if (txt) txt.textContent = isMasuk ? 'Sudah Masuk' : 'Clock-In';
            }
            $$('.stat-btns button', el).forEach(b => b.classList.toggle('on', b.dataset.s === r.status));
        }
        const list = getFilteredAbsRows().filter(x => x.bagianTugas === r.bagianTugas);
        const cnt = $('[data-cnt="' + r.bagianTugas + '"]');
        if (cnt) cnt.textContent = list.filter(x => x.status === 'H' || x.status === 'T').length + ' / ' + list.length + ' Masuk';
        updateAbsStats();
        queueAbs(id, {});
    }

    function queueAbs(id, patch) {
        const r = absData.rows.find(x => x.operatorId === id);
        Object.assign(r, patch);
        absQueue[id] = { operatorId: id, status: r.status, lembur: r.lembur, ket: r.ket };
        if (!r.status && (patch.lembur || patch.ket)) toast('Pilih status kehadiran dulu agar lembur/keterangan tersimpan.');
        const el = $('.att[data-id="' + id + '"]');
        if (el) el.classList.add('saving');
        clearTimeout(absTimer);
        absTimer = setTimeout(flushAbs, 600);
    }

    async function flushAbs() {
        clearTimeout(absTimer);
        const items = Object.values(absQueue);
        if (!items.length || !absData) return;
        absQueue = {};
        const ctx = { tanggal: absData.tanggal, shift: absData.shift };
        try {
            await call('setAbsensi', Object.assign({ items: items }, ctx), { silent: true });
            items.forEach(it => { const el = $('.att[data-id="' + it.operatorId + '"]'); if (el) el.classList.remove('saving'); });
        } catch (e) {
            fail(e);
            if (S.page === 'absensi') loadAbs();
        }
    }

    let J = null, jBrush = null, jPaint = false, jOnlyIeg = false;

    function canEditWeek(locked) {
        if (locked) return false;

    function kodeOf(k) { return (J ? J.kodes : S.master.kodes || []).find(x => x.kode === k); }
    function kMin(hhmm) { const m = /^(\d{2}):(\d{2})$/.exec(hhmm || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
    function textColor(hex) {
        const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '#ffffff');
        if (!m) return '#111';
        const l = (parseInt(m[1], 16) * 299 + parseInt(m[2], 16) * 587 + parseInt(m[3], 16) * 114) / 1000;
        return l > 150 ? '#1D2D3E' : '#FFFFFF';
    }

                : '<select id="wkEmp"><option value="">Semua employer</option></select>') +

    function cellKode(r, i) { const k = r.id + '|' + J.dates[i].d; return k in J.pending ? J.pending[k] : r.codes[i]; }

    function evalRow(r) {
        const codes = J.dates.map((x, i) => cellKode(r, i));
        let jam = 0, hari = 0;
        codes.forEach((k, i) => { const kk = kodeOf(k); if (kk && kk.kerja) { jam += kk.jam; hari++; } jam += r.lembur[i] || 0; });
        const warn = [];
        if (jam > J.maxJam) warn.push(jam + ' jam > batas ' + J.maxJam);
        if (codes.filter(Boolean).length === 7 && hari !== r.pola) warn.push(hari + ' hari kerja, pola ' + r.pola + ' hari');
        for (let i = 0; i < 7; i++) {
            const p = kodeOf(i === 0 ? r.prevKode : codes[i - 1]), c = kodeOf(codes[i]);
            if (!p || !c || !p.kerja || !c.kerja) continue;
            let pe = kMin(p.selesai), ps = kMin(p.mulai), cs = kMin(c.mulai);
            if (pe === null || cs === null) continue;
            if (pe <= ps) pe += 1440;
            const rest = (1440 + cs - pe) / 60;
            if (rest < J.minRest) warn.push('istirahat ' + rest + ' jam sebelum ' + J.dates[i].hari);
        }
        return { codes: codes, jam: jam, hari: hari, warn: warn };
    }

    function weekRows() {
        const q = (S.jad.q || '').toLowerCase();
        return J.rows.filter(r => (!S.jad.bagian || r.bagian === S.jad.bagian) && (!S.jad.emp || r.employer === S.jad.emp) &&
            (!q || r.nama.toLowerCase().indexOf(q) >= 0 || String(r.nik).indexOf(q) >= 0))
            .sort((a, b) => {
                const vacA = /vacant/i.test(a.nama) ? 1 : 0;
                const vacB = /vacant/i.test(b.nama) ? 1 : 0;
                if (vacA !== vacB) return vacA - vacB;
                // Urut nama A–Z (VACANT tetap di bawah)
                return (a.nama || '').localeCompare(b.nama || '', 'id', { sensitivity: 'base' });
            });
    }

                '<td class="c-hari' + (ev.warn.some(w => /hari kerja|istirahat/.test(w)) ? ' bad' : '') + '" title="' + esc(ev.warn.join('\n')) + '">' + ev.hari + '/' + r.pola + (ev.warn.length ? ' !' : '') + '</td></tr>';
        });
        h += '</tbody><tfoot>';
        const work = J.kodes.filter(k => k.kerja);
        const count = (pred) => J.dates.map((x, i) => rows.filter(r => pred(cellKode(r, i))).length);
        work.forEach(k => {
            const c = count(x => x === k.kode);
            if (!c.some(Boolean)) return;

        h += '</tfoot></table></div>' +

        $('#wkBody').innerHTML = h;

            const open = () => fotoViewModal((S.master.operators || []).find(o => o.id === b.dataset.viewFoto));

            b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };

        $$('#wkBody .kc:not([disabled])').forEach(b => {
            const tr = b.closest('tr'), r = J.rows.find(x => x.id === tr.dataset.op), i = +b.dataset.i;
            b.onmousedown = e => { if (jBrush) { e.preventDefault(); jPaint = true; setCell(r, i, jBrush === '-' ? '' : jBrush); } };
            b.onmouseenter = () => { if (jBrush && jPaint) setCell(r, i, jBrush === '-' ? '' : jBrush); };
            b.onclick = e => { if (!jBrush) cellMenu(b, r, i); };
            b.ontouchstart = e => { if (jBrush) { e.preventDefault(); setCell(r, i, jBrush === '-' ? '' : jBrush); } };
        });

            $$('#wkBody th.c-day[data-day-d]').forEach(th => {
                th.onclick = () => batchJadwalModal(th.dataset.dayD, S.jad.bagian);
            });
            $$('#wkBody [data-op-bag]').forEach(badge => {
                badge.onclick = (e) => {
                    e.stopPropagation();
                    batchJadwalModal(S.jad.tanggal || J.monday, badge.dataset.opBag);
                };
            });
        }
        updateSaveBar();
    }

    function setCell(r, i, kode) {
        const key = r.id + '|' + J.dates[i].d;
        if ((r.codes[i] || '') === kode) delete J.pending[key]; else J.pending[key] = kode;
        // gambar ulang satu baris saja (cepat saat menyeret)
        const tr = $('#wkBody tr[data-op="' + r.id + '"]');
        if (!tr) return drawWeek();
        const b = $('.kc[data-i="' + i + '"]', tr), kk = kodeOf(kode);
        b.textContent = kk ? kk.label : '·';
        b.style.background = kk ? kk.warna : ''; b.style.color = kk ? textColor(kk.warna) : '';
        b.classList.toggle('changed', key in J.pending); b.classList.toggle('empty', !kode);
        const ev = evalRow(r);
        const jc = $('.c-jam', tr), hc = $('.c-hari', tr);
        jc.textContent = ev.jam; jc.classList.toggle('bad', ev.jam > J.maxJam); jc.title = ev.warn.join('\n');
        hc.textContent = ev.hari + '/' + r.pola + (ev.warn.length ? ' !' : ''); hc.classList.toggle('bad', ev.warn.some(w => /hari kerja|istirahat/.test(w))); hc.title = ev.warn.join('\n');
        clearTimeout(J._ft); J._ft = setTimeout(() => { const y = window.scrollY; drawWeek(); window.scrollTo(0, y); }, 900);
        updateSaveBar();
    }

    function cellMenu(btn, r, i) {
        closeCellMenu();
        const m = document.createElement('div');
        m.className = 'cellmenu';
        m.innerHTML = '<div class="small muted" style="padding:4px 8px">' + esc(r.nama) + ' · ' + J.dates[i].hari + ' ' + J.dates[i].tgl + '</div>' +
            J.kodes.map(k => '<button data-k="' + k.kode + '"><span class="sw" style="background:' + k.warna + '"></span><b>' + esc(k.label) + '</b><small>' + (k.kerja ? k.mulai + '–' + k.selesai : esc(k.nama)) + '</small></button>').join('') +
            '<button data-k=""><span class="sw"></span><b>Kosongkan</b></button>';
        document.body.appendChild(m);
        const rc = btn.getBoundingClientRect();
        const top = Math.min(window.innerHeight - m.offsetHeight - 8, rc.bottom + 4);
        m.style.top = Math.max(8, top) + 'px';
        m.style.left = Math.max(8, Math.min(window.innerWidth - m.offsetWidth - 8, rc.left)) + 'px';
        $$('button', m).forEach(x => x.onclick = () => { setCell(r, i, x.dataset.k); closeCellMenu(); });
        setTimeout(() => document.addEventListener('click', closeCellMenuOut), 0);
    }
    function closeCellMenuOut(e) { if (!e.target.closest('.cellmenu')) closeCellMenu(); }
    function closeCellMenu() { const m = $('.cellmenu'); if (m) m.remove(); document.removeEventListener('click', closeCellMenuOut); }

    // Tombol Submit Jadwal IEG menampilkan status: Belum Disubmit / Sudah Disubmit

        const b = $('#wkSubmitTop');
        if (!b || !J) return;
        const n = Object.keys(J.pending || {}).length;
        const done = !!J.iegSubmit && !n;
        b.className = 'btn sm ' + (done ? 'ok' : 'warn-solid');
        b.innerHTML = '<span class="material-symbols-outlined">' + (done ? 'task_alt' : 'pending_actions') + '</span> ' +
            (done ? 'Sudah Disubmit' : 'Belum Disubmit' + (n ? ' · ' + n + ' perubahan' : '') + ' — Klik untuk Submit');
        b.title = done
            ? 'Disubmit oleh ' + (J.iegSubmit.by || '-') + ' · ' + String(J.iegSubmit.at || '').slice(0, 16) + '. Jadwal sudah masuk ke Jadwal Employee.'
            : 'Jadwal IEG minggu ini belum masuk ke Jadwal Employee. Klik untuk submit.';

        updateIegSubmitBtn();
        const n = Object.keys(J.pending || {}).length;
        $('#wkSave').classList.toggle('hidden', !n);
        $('#wkSaveTxt').textContent = n + ' perubahan belum disimpan';
    }

    async function saveWeek(force) {
        const changes = Object.keys(J.pending).map(k => { const p = k.split('|'); return { operatorId: p[0], tanggal: p[1], kode: J.pending[k] }; });
        try {
            const r = await call('mingguSimpan', { tanggal: J.monday, changes: changes, force: force, onlyIeg: jOnlyIeg });
            if (!r.ok) return showWeekWarnings(r.warnings);
            toast(jOnlyIeg
                ? 'Jadwal IEG (' + r.saved + ' sel) berhasil disubmit & otomatis masuk ke Jadwal Employee!'
                : r.saved + ' sel disimpan' + (r.warnings && r.warnings.length ? ' (dengan ' + r.warnings.length + ' pengecualian)' : '') + '.', 'ok');
            loadWeek();
        } catch (e) { fail(e); }
    }

    function showWeekWarnings(ws) {
        openModal({
            title: 'Melanggar aturan jam kerja',
            body: '<p class="small muted">Batas ' + J.maxJam + ' jam/' + (J.mode === 'MINGGU' ? 'minggu' : '7 hari') + ' · istirahat min ' + J.minRest + ' jam.</p><div class="table-wrap" style="max-height:300px"><table class="tbl"><tbody>' +
                ws.map(w => '<tr><td><b>' + esc(w.nama) + '</b><br><span class="small muted">' + esc(fmtShort(w.tanggal)) + '</span></td><td class="small">' + esc(w.pesan) + '</td></tr>').join('') + '</tbody></table></div>' +
                (isAdmin() ? '' : '<div class="alert warn">Perbaiki jadwalnya, atau minta Admin menyimpan sebagai pengecualian.</div>'),
            buttons: [{ label: 'Perbaiki dulu' }].concat(isAdmin() ? [{ label: 'Simpan tetap (pengecualian)', cls: 'danger', onClick: () => { closeModal(); saveWeek(true); } }] : [])
        });
    }

    function batchJadwalModal(initialDate, initialBagian) {
        if (!J || !J.dates) return;
        let curDate = initialDate && J.dates.some(x => x.d === initialDate) ? initialDate : (S.jad.tanggal && J.dates.some(x => x.d === S.jad.tanggal) ? S.jad.tanggal : J.monday);
        let curBag = initialBagian !== undefined ? initialBagian : (S.jad.bagian || '');
        let curKode = J.kodes[0] ? J.kodes[0].kode : 'S1';
        let filterQ = '';

        function getEligibleOps() {
            const q = filterQ.trim().toLowerCase();
            return J.rows.filter(r => {
                if (curBag && r.bagian !== curBag) return false;
                if (q && r.nama.toLowerCase().indexOf(q) < 0 && String(r.nik).indexOf(q) < 0) return false;
                return true;
            }).sort((a, b) => {
                const vacA = /vacant/i.test(a.nama) ? 1 : 0;
                const vacB = /vacant/i.test(b.nama) ? 1 : 0;
                if (vacA !== vacB) return vacA - vacB;
                // Urut nama A–Z (VACANT tetap di bawah)
                return (a.nama || '').localeCompare(b.nama || '', 'id', { sensitivity: 'base' });
            });
        }

        function renderModalBody() {
            const dateIdx = J.dates.findIndex(x => x.d === curDate);
            const dayInfo = dateIdx >= 0 ? J.dates[dateIdx] : J.dates[0];
            const ops = getEligibleOps();

            let h = '<div class="batch-modal-wrap">';
            h += '<div class="field"><label><span>Pilih Tanggal dalam 1 Minggu:</span></label>';
            h += '<div class="seg-days">';
            J.dates.forEach(d => {
                const isSel = d.d === curDate;
                h += '<button type="button" class="day-pill' + (isSel ? ' active' : '') + (d.isToday ? ' today' : '') + '" data-bp-date="' + d.d + '">' +
                    '<span>' + d.hari.slice(0, 3) + '</span><b>' + d.tgl + '</b>' +
                    '</button>';
            });
            h += '</div></div>';

            h += '<div class="grid2">';
            h += '<label class="field"><span>Divisi / Bagian:</span><select id="bmBag"><option value="">Semua Divisi (' + J.rows.length + ' orang)</option>' +
                S.master.bagian.map(b => '<option value="' + b.kode + '"' + (curBag === b.kode ? ' selected' : '') + '>' + esc(b.nama) + '</option>').join('') +
                '</select></label>';

            h += '<label class="field"><span>Shift / Kode yang Diterapkan:</span><select id="bmKode">' +
                J.kodes.map(k => '<option value="' + k.kode + '"' + (curKode === k.kode ? ' selected' : '') + '>' + esc(k.label) + ' (' + (k.kerja ? k.mulai + '–' + k.selesai + ' · ' + k.jam + 'j' : esc(k.nama)) + ')</option>').join('') +
                '<option value="-"' + (curKode === '-' ? ' selected' : '') + '>⌫ Kosongkan Jadwal</option>' +
                '</select></label>';
            h += '</div>';

            h += '<div class="row" style="margin:8px 0;gap:8px;align-items:center;">';
            h += '<input type="search" id="bmQ" placeholder="Cari nama / NIK…" value="' + esc(filterQ) + '" style="flex:1 1 140px;height:34px">';
            h += '<button type="button" class="btn xs ghost" id="bmSelectAll">Pilih Semua</button>';
            h += '<button type="button" class="btn xs ghost" id="bmClearAll">Kosongkan</button>';
            h += '</div>';

            h += '<div class="batch-op-list" id="bmOpList">';
            if (!ops.length) {
                h += '<div class="empty small">Tidak ada karyawan untuk divisi / pencarian ini.</div>';
            } else {
                ops.forEach(r => {
                    const currentCellKode = cellKode(r, dateIdx);
                    const kk = kodeOf(currentCellKode);
                    h += '<div class="batch-op-item">';
                    h += '<input type="checkbox" data-bm-op="' + r.id + '" checked>';
                    h += '<div class="batch-op-info"><div class="batch-op-name">' + esc(r.nama) + ' <small class="muted">' + esc(r.nik) + '</small></div>';
                    h += '<div class="batch-op-sub">' + esc(bagName(r.bagian)) + ' · Pola ' + r.pola + ' hari' + (r.employer ? ' · ' + esc(r.employer) : '') + '</div></div>';
                    h += '<div class="batch-op-curr">';
                    h += '<span class="chip sm ' + (kk ? '' : 'muted') + '" style="' + (kk ? 'background:' + kk.warna + ';color:' + textColor(kk.warna) : '') + '">' + esc(kk ? kk.label : 'Kosong') + '</span>';
                    h += '</div>';
                    h += '</div>';
                });
            }
            h += '</div>';

            const activeKodeObj = kodeOf(curKode);
            h += '<div class="alert info small" style="margin-top:10px">';
            h += '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px">info</span>Menerapkan shift <b>' + esc(activeKodeObj ? activeKodeObj.label : (curKode === '-' ? 'Kosong' : curKode)) + '</b> untuk karyawan yang dicentang pada <b>' + dayInfo.hari + ', ' + dayInfo.tgl + ' ' + BULAN[+curDate.slice(5, 7) - 1] + '</b>.';
            h += '</div>';
            h += '</div>';
            return h;
        }

        openModal({
            title: 'Input Jadwal per Tanggal & Divisi',
            body: renderModalBody(),
            buttons: [
                { label: 'Batal' },
                {
                    label: '<span class="material-symbols-outlined" style="font-size:16px">save</span> Terapkan ke Jadwal',
                    cls: 'primary',
                    onClick: () => {
                        const selCheckboxes = $$('#bmOpList input[data-bm-op]:checked');
                        if (!selCheckboxes.length) {
                            toast('Pilih minimal satu karyawan untuk diterapkan.', 'err');
                            return;
                        }
                        const dateIdx = J.dates.findIndex(x => x.d === curDate);
                        if (dateIdx < 0) return;
                        const shiftVal = curKode === '-' ? '' : curKode;
                        let count = 0;
                        selCheckboxes.forEach(cb => {
                            const opId = cb.dataset.bmOp;
                            const r = J.rows.find(x => x.id === opId);
                            if (r) {
                                const key = r.id + '|' + curDate;
                                if ((r.codes[dateIdx] || '') === shiftVal) {
                                    delete J.pending[key];
                                } else {
                                    J.pending[key] = shiftVal;
                                }
                                count++;
                            }
                        });
                        closeModal();
                        drawWeek();
                        toast(count + ' jadwal diterapkan ke antrean! Klik "Simpan" di bar bawah untuk menyimpan permanen.', 'ok');
                    }
                }
            ]
        });

        function attachEvents() {
            $$('#modalBody [data-bp-date]').forEach(btn => {
                btn.onclick = () => {
                    curDate = btn.dataset.bpDate;
                    $('#modalBody').innerHTML = renderModalBody();
                    attachEvents();
                };
            });

            const bagSelect = $('#bmBag');
            if (bagSelect) {
                bagSelect.onchange = e => {
                    curBag = e.target.value;
                    $('#modalBody').innerHTML = renderModalBody();
                    attachEvents();
                };
            }

            const kodeSelect = $('#bmKode');
            if (kodeSelect) {
                kodeSelect.onchange = e => {
                    curKode = e.target.value;
                    const alertB = $('#modalBody .batch-modal-wrap .alert b');
                    if (alertB) {
                        const kk = kodeOf(curKode);
                        alertB.textContent = kk ? kk.label : (curKode === '-' ? 'Kosong' : curKode);
                    }
                };

            if (qInput) {
                qInput.oninput = e => {

                    if (!ops.length) {
                        listEl.innerHTML = '<div class="empty small">Tidak ada karyawan untuk filter ini.</div>';
                    } else {
                        let h = '';
                        ops.forEach(r => {
                            const currentCellKode = cellKode(r, dateIdx);
                            const kk = kodeOf(currentCellKode);
                            h += '<div class="batch-op-item">';
                            h += '<input type="checkbox" data-bm-op="' + r.id + '" checked>';
                            h += '<div class="batch-op-info"><div class="batch-op-name">' + esc(r.nama) + ' <small class="muted">' + esc(r.nik) + '</small></div>';
                            h += '<div class="batch-op-sub">' + esc(bagName(r.bagian)) + ' · Pola ' + r.pola + ' hari' + (r.employer ? ' · ' + esc(r.employer) : '') + '</div></div>';
                            h += '<div class="batch-op-curr">';
                            h += '<span class="chip sm ' + (kk ? '' : 'muted') + '" style="' + (kk ? 'background:' + kk.warna + ';color:' + textColor(kk.warna) : '') + '">' + esc(kk ? kk.label : 'Kosong') + '</span>';
                            h += '</div>';
                            h += '</div>';
                        });
                        listEl.innerHTML = h;
                    }
                };
            }

            const btnAll = $('#bmSelectAll');
            if (btnAll) {
                btnAll.onclick = () => {
                    $$('#bmOpList input[data-bm-op]').forEach(cb => cb.checked = true);

        const st = String(OD.approvalStatus || '').toUpperCase();
        if (OD.reqSubmitAt && (st === 'PENDING' || st === 'APPROVED') && (OD.req || []).length) {
            odLastSubmit = { tanggal: OD.tanggal, kode: OD.kode, req: OD.req.map(x => Object.assign({}, x)), request: OD.request };

            '<span class="material-symbols-outlined" style="font-size:18px;color:#25D366">chat</span>' +

            '<button type="button" class="btn sm' + (odPreviewMode === 'NUM' ? ' on active' : '') + '" id="odPrevNum">@Nomor</button>' +

            '<div class="wa-wrap"><div class="wa-bubble" id="odBubble"></div></div>' +
            '</div>';

        $('#odRight').innerHTML =

            '<div class="row" style="gap:6px;flex-wrap:wrap">' +

                ? '<span class="chip ok"><span class="material-symbols-outlined">check_circle</span> Approved Supervisor · ' + esc(appUserLabel) + '</span>'
                : (appSt === 'PENDING'
                    ? '<span class="chip warn"><span class="material-symbols-outlined">schedule</span> Waiting Approval Supervisor · ' + esc(spvUserLabel) + '</span>'
                    : (appSt === 'REJECTED'
                        ? '<span class="chip err"><span class="material-symbols-outlined">cancel</span> Ditolak · ' + esc(appUserLabel) + '</span>'
                        : '<span class="chip">Draft</span>'))) +
            (subAt ? '<span class="chip pri">Diajukan: ' + esc(subUserLabel) + ' (' + esc(subAt.slice(5, 16)) + ')</span>' : '') +
            (sentAt ? '<span class="chip ok">WA Terkirim ' + esc(sentAt.slice(5, 16)) + '</span>' : '') +
            '</div>' +
            (isReq ? '<span class="chip sm ghost">Shift ' + esc(OD.kode) + '</span>' : '') +
            '</div>' +
            previewCardHtml +
            tagBoxHtml +
            '<div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">' +
            (odEditable() ? '<button class="btn primary" id="odSubmit"><span class="material-symbols-outlined">send</span> ' + (isReq ? 'Submit ke Supervisor (Approval)' : 'Submit Realisasi') + '</button><button class="btn btn-wa" id="odSend">' + (manual ? '<span class="material-symbols-outlined">share</span> Share WhatsApp' : '<span class="material-symbols-outlined">send</span> Kirim WA') + '</button>' : '') +
            '<button class="btn" id="odCopy"><span class="material-symbols-outlined">content_copy</span> Salin</button>' +
            (isReq ? '<button class="btn ghost" id="odImg"><span class="material-symbols-outlined">image</span> Gambar</button>' : '') +
            '</div>';

        drawOrderList();
        refreshOrderPreview();
        drawSubmittedSchedule();

        $$('[data-od-date]').forEach(cb => cb.onchange = () => {
            const d = cb.dataset.odDate;
            if (cb.checked) {
                if (odSelectedDates.indexOf(d) < 0) odSelectedDates.push(d);
            } else {
                if (odSelectedDates.length <= 1) { cb.checked = true; return toast('Minimal 1 tanggal harus dipilih.', 'warn'); }
                odSelectedDates = odSelectedDates.filter(x => x !== d);
            }
            cb.closest('.od-day-pill').classList.toggle('on', cb.checked);
        });
        if ($('#odDateAll')) $('#odDateAll').onclick = () => { odSelectedDates = (OD.weekDates || [OD.tanggal]).slice(); drawOrder(); };
        if ($('#odDateOne')) $('#odDateOne').onclick = () => { odSelectedDates = [OD.tanggal]; drawOrder(); };

        if ($('#odPrevNum')) $('#odPrevNum').onclick = () => { odPreviewMode = 'NUM'; drawOrder(); };
        if ($('#odPrevName')) $('#odPrevName').onclick = () => { odPreviewMode = 'NAME'; drawOrder(); };
        $('#odQ').oninput = e => { odQ = e.target.value; drawOrderList(); };
        if ($('#odBagFilter')) $('#odBagFilter').onchange = e => { odBagFilter = e.target.value; drawOrderList(); };
        if ($('#odSelAll')) $('#odSelAll').onclick = () => {
            const visible = getFilteredCandidates();
            const existing = {};
            OD.req.forEach(x => existing[x.id] = x);
            visible.forEach(c => {
                if (c.isVacant || /vacant/i.test(c.nama)) return;
                if (isReq) {
                    if (!existing[c.id]) { OD.req.push({ id: c.id, jam: OD.defJam, qty: 1 }); existing[c.id] = true; }
                } else {
                    if (OD.realIds.indexOf(c.id) < 0) OD.realIds.push(c.id);
                    OD.realAuto = false;
                }
            });
            if (isReq) {
                OD.request = Math.max(OD.request, totalSelectedMp());
                if ($('#odReq')) $('#odReq').value = OD.request;
            }
            drawOrderList(); markOrder(); refreshOrderPreview(true);
        };
        if ($('#odSelNone')) $('#odSelNone').onclick = () => {
            const visibleIds = {};
            getFilteredCandidates().forEach(c => visibleIds[c.id] = true);
            if (isReq) {
                OD.req = OD.req.filter(x => !visibleIds[x.id]);
                OD.request = totalSelectedMp();
                if ($('#odReq')) $('#odReq').value = OD.request;
            } else {
                OD.realIds = OD.realIds.filter(id => !visibleIds[id]);
                OD.realAuto = false;
            }
            drawOrderList(); markOrder(); refreshOrderPreview(true);
        };
        if ($('#odReq')) $('#odReq').oninput = e => { OD.request = Math.max(0, +e.target.value || 0); markOrder(); refreshOrderPreview(true); };
        if ($('#odGoAbs')) $('#odGoAbs').onclick = () => { S.abs = { tanggal: OD.tanggal, shift: OD.kode }; go('absensi'); };
        if ($('#odReauto')) $('#odReauto').onclick = () => { OD.realAuto = true; OD.realIds = []; markOrder(true); };
        if ($('#odAddJam')) $('#odAddJam').onclick = () => {
            const j = $('#odJm').value + '-' + $('#odJs').value;
            if (j === OD.defJam || OD.jamExtra.indexOf(j) >= 0) return toast('Jam itu sudah ada.', 'err');
            OD.jamExtra.push(j); markOrder(); drawOrder();
        };
        $$('[data-rmjam]').forEach(b => b.onclick = () => {
            const j = b.dataset.rmjam;
            OD.jamExtra = OD.jamExtra.filter(x => x !== j);
            OD.req.forEach(x => { if (x.jam === j) x.jam = OD.defJam; });
            markOrder(); drawOrder();
        });
        $('#odCopy').onclick = async () => { await flushOrder(); toast(await copyText(shareText()) ? 'Teks disalin — tempel di grup WA.' : 'Gagal menyalin.', 'ok'); };
        if ($('#odImg')) $('#odImg').onclick = async () => { await flushOrder(); downloadRekap({ jenis: 'GAMBAR', from: OD.tanggal, to: OD.tanggal }); };
        if ($('#odSend')) $('#odSend').onclick = sendOrder;
        if ($('#odSubmit')) $('#odSubmit').onclick = submitOrder;
        if ($('#odApprove')) $('#odApprove').onclick = approveOrder;
        if ($('#odReject')) $('#odReject').onclick = rejectOrder;
