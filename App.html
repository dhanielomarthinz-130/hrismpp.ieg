    function curText() { return S.wa.type === 'REQ' ? OD.textReq : OD.textReal; }
    /** Teks untuk dibagikan: PIC & CC ditulis @nomor agar WhatsApp menjadikannya tag kontak. */
    function shareText() { return S.wa.type === 'REQ' ? (OD.shareReq || OD.textReq) : (OD.shareReal || OD.textReal); }

    function totalSelectedMp() {
        if (!OD || !OD.req) return 0;
        return OD.req.reduce((acc, x) => acc + Math.max(1, +(x.qty || 1)), 0);
    }

    function getFilteredCandidates() {
        if (!OD || !OD.candidates) return [];
        const q = odQ.trim().toLowerCase();
        const bagOrder = {};
        (S.master.bagian || []).forEach((b, i) => bagOrder[b.kode] = i);
        return OD.candidates.filter(c => {
            if (S.wa.type === 'REAL' && (c.isVacant || String(c.id).indexOf('VAC_') === 0)) return false;
            if (odBagFilter && c.bagian !== odBagFilter) return false;
            if (q && c.nama.toLowerCase().indexOf(q) < 0 && (c.nik || '').toLowerCase().indexOf(q) < 0 && bagName(c.bagian).toLowerCase().indexOf(q) < 0) return false;
            return true;
        }).sort((a, b) => {
            const oa = bagOrder[a.bagian] !== undefined ? bagOrder[a.bagian] : 99;
            const ob = bagOrder[b.bagian] !== undefined ? bagOrder[b.bagian] : 99;
            if (oa !== ob) return oa - ob;
            const vacA = (a.isVacant || /vacant/i.test(a.nama)) ? 1 : 0;
            const vacB = (b.isVacant || /vacant/i.test(b.nama)) ? 1 : 0;
            if (vacA !== vacB) return vacA - vacB;
            return (a.nama || '').localeCompare(b.nama || '');
        });
    }

    function setVacantQty(vacId, newQty) {
        newQty = Math.max(0, Math.min(50, parseInt(newQty, 10) || 0));
        const existing = OD.req.find(x => x.id === vacId);
        if (newQty <= 0) {
            OD.req = OD.req.filter(x => x.id !== vacId);
        } else if (existing) {
            existing.qty = newQty;
        } else {
            OD.req.push({ id: vacId, jam: OD.defJam, qty: newQty });
        }
        OD.request = totalSelectedMp();
        if ($('#odReq')) $('#odReq').value = OD.request;
        drawOrderList();
        markOrder();
        refreshOrderPreview(true);
    }

    function drawOrderList() {
        const isReq = S.wa.type === 'REQ';
        const ro = !odEditable();
        const reqIdx = {};
        OD.req.forEach(x => reqIdx[x.id] = x);
        const sel = id => isReq ? !!reqIdx[id] : OD.realIds.indexOf(id) >= 0;
        const list = getFilteredCandidates();
        if (!list.length) {
            $('#odList').innerHTML = '<div class="empty small">Nama karyawan tidak ditemukan.</div>';
            return;
        }
        const jams = [OD.defJam].concat(OD.jamExtra);
        const stChip = c => c.status ? '<span class="chip xs ' + ({ H: 'ok', T: 'info', S: 'warn', I: 'warn', A: 'err', C: 'pri' }[c.status] || '') + '">' + esc(STATUS[c.status]) + '</span>' : '';
        let lastBag = null, h = '<div class="picks one">';
        list.forEach(c => {
            if (c.bagian !== lastBag) {
                lastBag = c.bagian;
                const realInBag = list.filter(x => x.bagian === c.bagian && !x.isVacant);
                const selRealInBag = realInBag.filter(x => sel(x.id)).length;
                const vacEntry = reqIdx['VAC_' + c.bagian];
                const vacQtyInBag = vacEntry ? Math.max(1, +(vacEntry.qty || 1)) : 0;
                h += '<div class="pick-head">' +
                    '<span class="pick-head-title">' + esc(bagName(c.bagian)) + '</span>' +
                    '<div class="pick-head-actions">' +
                    '<span class="chip xs ' + ((selRealInBag + vacQtyInBag) > 0 ? 'pri' : 'muted') + '">' + selRealInBag + '/' + realInBag.length + (vacQtyInBag ? ' +' + vacQtyInBag + ' Vac' : '') + '</span>' +
                    (!ro && realInBag.length ? '<button type="button" class="btn xs ghost" data-bag-toggle="' + esc(c.bagian) + '">' + (selRealInBag === realInBag.length ? 'Reset' : '+ Pilih') + '</button>' : '') +
                    '</div></div>';
            }
            const on = sel(c.id);
            const isVacRow = c.isVacant || String(c.id).indexOf('VAC_') === 0;
            if (isReq && isVacRow) {
                const vQty = on ? Math.max(1, +(reqIdx[c.id].qty || 1)) : 0;
                const jamSelHtml = (on && OD.jamExtra.length)
                    ? '<select class="jam-sel" data-jam="' + c.id + '"' + (ro ? ' disabled' : '') + '>' + jams.map(j => '<option value="' + esc(j) + '"' + (reqIdx[c.id].jam === j ? ' selected' : '') + '>' + esc(j.replace('-', '–')) + '</option>').join('') + '</select>'
                    : '';
                h += '<div class="pick vacant-row' + (on ? ' is-picked' : '') + '">' +
                    '<label class="vac-check-label">' +
                    '<input type="checkbox" data-vac-check="' + c.id + '"' + (on ? ' checked' : '') + (ro ? ' disabled' : '') + '>' +
                    '<span class="vac-label-text">+ SLOT VACANT</span>' +
                    '</label>' +
                    jamSelHtml +
                    '<div class="vac-qty-box">' +
                    '<button type="button" class="vac-qty-btn" data-vac-dec="' + c.id + '"' + (ro || vQty <= 0 ? ' disabled' : '') + ' title="Kurangi Vacant">−</button>' +
                    '<input type="number" min="0" max="50" class="vac-qty-input" data-vac-inp="' + c.id + '" value="' + vQty + '"' + (ro ? ' disabled' : '') + '>' +
                    '<button type="button" class="vac-qty-btn vac-btn-plus" data-vac-inc="' + c.id + '"' + (ro ? ' disabled' : '') + ' title="Tambah Vacant">＋</button>' +
                    '</div></div>';
                return;
            }
            let extra = '';
            if (isReq) {
                if (on && OD.jamExtra.length) extra = '<select class="jam-sel" data-jam="' + c.id + '"' + (ro ? ' disabled' : '') + '>' + jams.map(j => '<option value="' + esc(j) + '"' + (reqIdx[c.id].jam === j ? ' selected' : '') + '>' + esc(j.replace('-', '–')) + '</option>').join('') + '</select>';
                else if (c.status) extra = stChip(c);
                else if (c.terjadwal) extra = '<span class="chip xs ok">' + esc(c.jadwal) + '</span>';
            } else {
                extra = (stChip(c) || '<span class="chip xs">Belum</span>') + (reqIdx[c.id] ? '' : ' <span class="chip xs info">Pengganti</span>');
            }
            h += '<label class="pick' + (on ? ' is-picked' : '') + '"><input type="checkbox" data-pick="' + c.id + '"' + (on ? ' checked' : '') + (ro ? ' disabled' : '') + '>' +
                '<span class="grow"><b>' + esc(c.nama) + '</b>' + (c.nik ? ' <small class="muted">' + esc(c.nik) + '</small>' : '') + '</span>' + extra + '</label>';
        });
        $('#odList').innerHTML = h + '</div>';

        $$('#odList [data-bag-toggle]').forEach(btn => btn.onclick = e => {
            e.preventDefault();
            const bag = btn.dataset.bagToggle;
            const inBag = list.filter(x => x.bagian === bag && !x.isVacant && !/vacant/i.test(x.nama));
            const allChecked = inBag.every(x => sel(x.id));
            inBag.forEach(c => {
                if (isReq) {
                    if (allChecked) OD.req = OD.req.filter(x => x.id !== c.id);
                    else if (!reqIdx[c.id]) { OD.req.push({ id: c.id, jam: OD.defJam, qty: 1 }); reqIdx[c.id] = { id: c.id, jam: OD.defJam, qty: 1 }; }
                } else {
                    OD.realIds = OD.realIds.filter(id => id !== c.id);
                    if (!allChecked) OD.realIds.push(c.id);
                    OD.realAuto = false;
                }
            });
            if (isReq) {
                OD.request = totalSelectedMp();
                if ($('#odReq')) $('#odReq').value = OD.request;
            }
            drawOrderList(); markOrder(); refreshOrderPreview(true);
        });

        $$('#odList [data-pick]').forEach(cb => cb.onchange = () => {
            const id = cb.dataset.pick;
            if (isReq) {
                if (cb.checked) { if (!reqIdx[id]) OD.req.push({ id: id, jam: OD.defJam, qty: 1 }); }
                else OD.req = OD.req.filter(x => x.id !== id);
                OD.request = totalSelectedMp();
                if ($('#odReq')) $('#odReq').value = OD.request;
                drawOrderList();
            } else {
                OD.realIds = OD.realIds.filter(x => x !== id);
                if (cb.checked) OD.realIds.push(id);
                OD.realAuto = false;
                drawOrderList();
            }
            markOrder(); refreshOrderPreview(true);
        });

        $$('#odList [data-vac-check]').forEach(cb => cb.onchange = () => {
            const id = cb.dataset.vacCheck;
            setVacantQty(id, cb.checked ? 1 : 0);
        });
        $$('#odList [data-vac-inc]').forEach(btn => btn.onclick = e => {
            e.preventDefault();
            const id = btn.dataset.vacInc;
            const cur = reqIdx[id] ? Math.max(1, +(reqIdx[id].qty || 1)) : 0;
            setVacantQty(id, cur + 1);
        });
        $$('#odList [data-vac-dec]').forEach(btn => btn.onclick = e => {
            e.preventDefault();
            const id = btn.dataset.vacDec;
            const cur = reqIdx[id] ? Math.max(1, +(reqIdx[id].qty || 1)) : 0;
            setVacantQty(id, Math.max(0, cur - 1));
        });
        $$('#odList [data-vac-inp]').forEach(inp => {
            inp.onclick = e => e.stopPropagation();
            inp.onchange = () => setVacantQty(inp.dataset.vacInp, inp.value);
        });
        $$('#odList [data-jam]').forEach(se => { se.onclick = e => e.preventDefault(); se.onchange = () => { reqIdx[se.dataset.jam].jam = se.value; markOrder(); refreshOrderPreview(true); }; });
    }

    function drawSubmittedSchedule() {
        const box = $('#odScheduleResult');
        if (!box || !OD) return;
        const rows = (OD.scheduledRows || []).slice().sort((a, b) => {
            const vacA = /vacant/i.test(a.nama) ? 1 : 0;
            const vacB = /vacant/i.test(b.nama) ? 1 : 0;
            if (vacA !== vacB) return vacA - vacB;
            return (a.nama || '').localeCompare(b.nama || '');
        });
        const weekDates = OD.weekDates || [OD.tanggal];

        const appSt = OD.approvalStatus || 'DRAFT';
        const spvUserLabel = OD.supervisorName || 'Supervisor';
        const appUserLabel = OD.approvedByNama || OD.approvedBy || spvUserLabel;
        const subUserLabel = OD.reqSubmitByNama || OD.reqSubmitBy || 'Leader / PIC';
        if (!rows.length) {
            box.innerHTML = '<div class="card"><div class="card-head"><h2><span class="material-symbols-outlined" style="vertical-align:middle;margin-right:6px;color:var(--primary)">calendar_month</span>Ringkasan Request OS &amp; Jadwal</h2></div>' +
                '<div class="empty small">Pilih karyawan lalu klik <b>Submit ke Supervisor (Approval)</b>.</div></div>';

        }

            : (appSt === 'PENDING'
                ? '<span class="chip sm warn"><span class="material-symbols-outlined">schedule</span> Waiting Approval Supervisor · ' + esc(spvUserLabel) + ' (Diajukan: ' + esc(subUserLabel) + ')</span>'
                : (appSt === 'REJECTED'
                    ? '<span class="chip sm err"><span class="material-symbols-outlined">cancel</span> Ditolak Supervisor: ' + esc(appUserLabel) + '</span>'
                    : '<span class="chip sm">Draft</span>'));

        let h = '<div class="card">' +
            '<div class="card-head" style="flex-wrap:wrap;gap:8px">' +
            '<div class="row" style="gap:8px;align-items:center">' +
            '<h2><span class="material-symbols-outlined" style="vertical-align:middle;margin-right:6px;color:var(--primary)">event_available</span>Daftar Karyawan Request OS (' + rows.length + ')</h2>' +
            stBadgeTop +
            '</div>' +
            '<div class="row" style="gap:8px">' +
            (OD.canApprove && appSt !== 'APPROVED' ? '<button type="button" class="btn sm ok" id="resApproveBtn"><span class="material-symbols-outlined">verified</span> Approve Sekarang</button>' : '') +
            '<button type="button" class="btn sm primary" id="resGoAbs"><span class="material-symbols-outlined">how_to_reg</span> Clock-In Absensi →</button>' +
            '<button type="button" class="btn sm" id="resGoJad"><span class="material-symbols-outlined">calendar_month</span> Jadwal Employee →</button>' +
            '</div></div>' +
            '<div class="table-wrap" style="max-height:none"><table class="tbl"><thead><tr>' +
            '<th style="width:40px">No</th><th>Nama Karyawan</th><th>Divisi</th><th>Jam Kerja</th>' +
            weekDates.map(wd => '<th class="num" style="' + (wd === OD.tanggal ? 'background:var(--primary-soft);color:var(--primary)' : '') + '">' + HARI3[dow(wd)] + '<br><small>' + wd.slice(8, 10) + '/' + wd.slice(5, 7) + '</small></th>').join('') +
            '<th>Status Approval</th></tr></thead><tbody>';

        rows.forEach((r, idx) => {
            const isVac = /vacant/i.test(r.nama);
            const rowStChip = appSt === 'APPROVED'
                ? '<span class="chip xs ok"><span class="material-symbols-outlined">check_circle</span> Approved · ' + esc(appUserLabel) + '</span>'
                : (appSt === 'PENDING'
                    ? '<span class="chip xs warn"><span class="material-symbols-outlined">schedule</span> Waiting Approval Supervisor · ' + esc(spvUserLabel) + '</span>'
                    : (appSt === 'REJECTED' ? '<span class="chip xs err"><span class="material-symbols-outlined">cancel</span> Ditolak · ' + esc(appUserLabel) + '</span>' : '<span class="chip xs">Draft</span>'));
            h += '<tr>' +
                '<td class="muted">' + (idx + 1) + '</td>' +
                '<td><b style="' + (isVac ? 'color:var(--warn)' : '') + '">' + esc(r.nama) + '</b>' + (isVac ? ' <small class="muted">(Dinamai saat Absensi)</small>' : '') + '</td>' +
                '<td><span class="wk-div-badge">' + esc(bagName(r.bagian)) + '</span></td>' +
                '<td class="small"><b>' + esc((r.jamKerja || OD.defJam).replace('-', '–')) + '</b></td>' +
                weekDates.map(wd => {
                    const kd = (r.days && r.days[wd]) ? r.days[wd] : '-';

        h += '</tbody></table></div></div>';
        box.innerHTML = h;
        if ($('#resApproveBtn')) $('#resApproveBtn').onclick = approveOrder;
        if ($('#resGoAbs')) $('#resGoAbs').onclick = () => { S.abs = { tanggal: OD.tanggal, shift: OD.kode }; go('absensi'); };
        if ($('#resGoJad')) $('#resGoJad').onclick = () => { S.jad = { tanggal: OD.tanggal }; go('jadwal'); };
    }

    function refreshOrderPreview(pending) {
        const isReq = S.wa.type === 'REQ';
        const sum = $('#odSum');
        if (sum) {
            if (isReq) {
                const realCnt = OD.req.filter(x => String(x.id).indexOf('VAC_') !== 0).length;
                const vacExplicit = OD.req.filter(x => String(x.id).indexOf('VAC_') === 0).reduce((a, x) => a + Math.max(1, +(x.qty || 1)), 0);
                const totSel = realCnt + vacExplicit;
                const vacExtra = Math.max(0, OD.request - totSel);
                const totalVac = vacExplicit + vacExtra;
                sum.innerHTML = '<b>' + realCnt + '</b> Nama' +
                    (totalVac ? ' + <b style="color:var(--warn)">' + totalVac + ' ' + esc(OD.vacant) + '</b>' : '') +
                    ' = <b>' + Math.max(OD.request, totSel) + '</b> Mp';
                sum.className = 'od-stat-status ' + (totalVac ? 'warn' : 'ok');
            } else {
                const n = OD.realIds.length;
                sum.innerHTML = 'Hadir <b>' + n + '</b> / Request <b>' + OD.request + '</b>' +
                    (n >= OD.request ? ' · <span class="ok">Terfullfill</span>' : ' · <span class="err">Kurang ' + (OD.request - n) + '</span>');
                sum.className = 'od-stat-status ' + (n >= OD.request ? 'ok' : 'err');
            }
        }
        const bub = $('#odBubble');
        if (bub) {
            const raw = odPreviewMode === 'NUM' ? shareText() : curText();
            let safeHtml = esc(raw || '');
            safeHtml = safeHtml.replace(/(@\d{9,16}|@[A-Za-z0-9\s.]{2,30}(?=\s|[,.]|$))/g, '<span class="wa-mention-pill">$1</span>');
            safeHtml = safeHtml.replace(/\*([^*]+)\*/g, '<b>$1</b>');
            bub.innerHTML = safeHtml;
            bub.classList.toggle('stale', !!pending);
        }
    }

    function markOrder(reload) {
        if (!odEditable()) return;
        if (OD && OD.afterSubmit) { refreshOrderPreview(true); return; } // jangan timpa request yang baru disubmit
        odDirty = true;
        clearTimeout(odTimer);
        odTimer = setTimeout(() => flushOrder(reload), reload ? 0 : 500);
    }
    async function flushOrder(reload) {
        clearTimeout(odTimer);
        if (!odDirty || !OD) return;
        odDirty = false;
        try {
            const v = await call('orderSave', {
                tanggal: OD.tanggal, shift: OD.kode, request: OD.request, req: OD.req, jamExtra: OD.jamExtra,
                realIds: OD.realIds, realAuto: OD.realAuto
            }, { silent: true });
            if (S.page !== 'request_os' || v.tanggal !== OD.tanggal || v.kode !== OD.kode) return;
            OD.textReq = v.textReq; OD.textReal = v.textReal;
            OD.shareReq = v.shareReq; OD.shareReal = v.shareReal;
            OD.belumAbsen = v.belumAbsen; OD.groups = v.groups;
            OD.scheduledRows = v.scheduledRows;
            if (reload || OD.realAuto) { OD.realIds = v.realIds; }
            if (reload) drawOrder(); else if (!odDirty) { refreshOrderPreview(false); drawSubmittedSchedule(); }
        } catch (e) { fail(e); }
    }

    function orderPayload() {
        // Form baru dikosongkan setelah submit: kirim daftar yang SUDAH disubmit (Kirim WA / Approve
        // menyimpan ulang daftar ini — jangan sampai tertimpa daftar kosong)
        const keep = !!(OD.afterSubmit && odLastSubmit && odLastSubmit.tanggal === OD.tanggal && odLastSubmit.kode === OD.kode);
        return {
            tanggal: OD.tanggal,
            dates: odSelectedDates.length ? odSelectedDates : [OD.tanggal],
            shift: OD.kode,
            request: keep ? odLastSubmit.request : OD.request,
            req: keep ? odLastSubmit.req : OD.req,
            jamExtra: OD.jamExtra,
            realIds: OD.realIds,
            realAuto: OD.realAuto
        };
    }

    // Request terakhir yang berhasil disubmit (untuk menggabungkan request tambahan pada tanggal & shift yang sama)
    let odLastSubmit = null;

    function mergeReq(a, b) {
        const out = a.map(x => Object.assign({}, x));
        b.forEach(x => {
            const ex = out.find(y => y.id === x.id);
            if (!ex) out.push(Object.assign({}, x));
            else if (String(x.id).indexOf('VAC_') === 0) ex.qty = Math.max(1, +(ex.qty || 1)) + Math.max(1, +(x.qty || 1));
        });
        return out;
    }

    async function submitOrder() {
        clearTimeout(odTimer); odDirty = false;
        const payload = Object.assign(orderPayload(), { type: S.wa.type });
        const isReq = S.wa.type === 'REQ';
        // Form sudah dikosongkan setelah submit sebelumnya: nama baru DITAMBAHKAN ke request yang sudah ada
        if (isReq && OD.afterSubmit && odLastSubmit && odLastSubmit.tanggal === OD.tanggal && odLastSubmit.kode === OD.kode) {
            if (!OD.req.length) return toast('Belum ada nama baru yang dicentang untuk request tambahan.', 'warn');
            payload.req = mergeReq(odLastSubmit.req, OD.req);
            payload.request = (+odLastSubmit.request || 0) + (+OD.request || 0);
        }
        try {
            const v = await call('orderSubmit', payload);
            OD = v;
            if (isReq) {
                // Kosongkan checklist untuk request berikutnya. Data yang disubmit tetap tersimpan di server.
                odLastSubmit = { tanggal: v.tanggal, kode: v.kode, req: (v.req || []).map(x => Object.assign({}, x)), request: v.request };
                OD.req = []; OD.request = 0; OD.afterSubmit = true;
                odSelectedDates = [OD.tanggal]; odQ = '';
            }
            drawOrder();
            toast(v.approvalStatus === 'APPROVED'
                ? 'Request OS disubmit & otomatis Approved — langsung masuk Jadwal Employee & Absensi.'
                : 'Request OS berhasil dikirim ke Supervisor untuk di-Approve!', 'ok');
        } catch (e) { fail(e); }
    }

    // Setelah submit: tampilkan keterangan di atas form yang sudah dikosongkan
    const drawOrderBase = drawOrder;
    drawOrder = function () {
        drawOrderBase();
        if (OD && OD.afterSubmit && $('#odLeft')) {
            $('#odLeft').insertAdjacentHTML('afterbegin',
                '<div class="alert ok" style="display:flex;align-items:center;gap:8px;margin-top:0">' +
                '<span class="material-symbols-outlined">check_circle</span>' +
                '<span>Request OS berhasil disubmit' + (odLastSubmit ? ' (' + odLastSubmit.req.length + ' nama)' : '') + '. Form dikosongkan — centang nama lagi untuk request tambahan pada tanggal &amp; shift ini.</span></div>');
        }
    };

    async function approveOrder() {
        clearTimeout(odTimer); odDirty = false;
        const btn = $('#odApprove');
        if (btn) btn.disabled = true;
        try {
            const v = await call('orderApprove', orderPayload());
            OD = v; drawOrder();

        } catch (e) {
            if (btn) btn.disabled = false;

        }
    }

    async function rejectOrder() {
        openModal({

                '<label class="field"><span>Catatan Supervisor</span><input name="note" placeholder="Contoh: Kurang 2 operator Inbound…"></label>',

    async function sendOrder() {
        const type = S.wa.type;
        if (OD.provider === 'MANUAL') {
            clearTimeout(odTimer); odDirty = false;
            const text = shareText();
            copyText(text);
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'MPP ' + (type === 'REQ' ? 'Request' : 'Realisasi') + ' - ' + shiftName(OD.kode),
                        text: text
                    });
                    OD = await call('orderShared', Object.assign(orderPayload(), { type: type }), { silent: true });
                    drawOrder(); loadWaLog();
                    toast('Pesan & tag akun WhatsApp berhasil dibagikan.', 'ok');
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }
            window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
            try {
                OD = await call('orderShared', Object.assign(orderPayload(), { type: type }), { silent: true });
                drawOrder(); loadWaLog();
            } catch (e) { fail(e); }
            toast('WhatsApp dibuka — teks & tag akun WhatsApp telah disalin ke clipboard.', 'ok');
            return;
        }
        await flushOrder();
        const info = type === 'REQ' ? 'Request ' + OD.request + ' Mp (' + OD.req.length + ' nama)' + (OD.lampiran !== 'TIDAK' ? ' + ' + (OD.lampiran === 'GAMBAR' ? 'gambar tabel' : 'file Excel') : '')
            : 'Realisasi hadir ' + OD.realIds.length + ' / request ' + OD.request;
        if (!await confirmBox('Kirim ke grup WhatsApp?', shiftName(OD.kode) + ' · ' + OD.tanggalLabel + '\n' + info, 'Kirim')) return;
        try {
            const r = await call('orderSend', { tanggal: OD.tanggal, shift: OD.kode, type: type });
            toast(r.ok ? (r.queued ? 'Masuk antrean bot WhatsApp.\n' + r.detail : 'Terkirim ke grup.') : 'Gagal: ' + r.detail, r.ok ? 'ok' : 'err');
            OD = r.view; drawOrder(); loadWaLog(); loadWaStatus();
        } catch (e) { fail(e); }
    }

            a.download = r.name;
            document.body.appendChild(a); a.click(); a.remove();
            toast('Diunduh: ' + r.name, 'ok');
        } catch (e) { fail(e); }
    }

    function daCaption(rows, shift, emp) {
        const cnt = k => rows.filter(r => r.status === k).length;
        const hadir = cnt('H') + cnt('T');
        const groups = {};
        rows.forEach(r => (groups[r.bagian] = groups[r.bagian] || []).push(r));
        const order = S.master.bagian.map(b => b.kode).filter(k => groups[k])
            .concat(Object.keys(groups).filter(k => !S.master.bagian.some(b => b.kode === k)));
        const now = new Date();
        const jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        const L = ['*LAPORAN ABSENSI ' + shiftName(shift).toUpperCase() + '*', '*Employee ' + (emp || 'RKA & IEG') + '*', '',
            'Tanggal : ' + fmtTgl(S.master.today), 'Shift   : ' + shiftName(shift) + ' (' + shiftTime(shift) + ')', '',
            '*Ringkasan*', 'Total diabsen : ' + rows.length + ' orang', '✅ Hadir : ' + cnt('H')];
        if (cnt('T')) L.push('⏰ Telat : ' + cnt('T'));
        if (cnt('S')) L.push('🤒 Sakit : ' + cnt('S'));
        if (cnt('I')) L.push('📝 Izin : ' + cnt('I'));
        if (cnt('C')) L.push('🏖️ Cuti : ' + cnt('C'));
        if (cnt('A')) L.push('❌ Alpa : ' + cnt('A'));
        L.push('Kehadiran : ' + hadir + '/' + rows.length + ' (' + Math.round(hadir / rows.length * 100) + '%)');
        order.forEach(k => {
            const list = groups[k].slice().sort((a, b) => a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));
            L.push('', '*' + bagName(k).toUpperCase() + '* (' + list.filter(r => r.status === 'H' || r.status === 'T').length + '/' + list.length + ')');
            list.forEach((r, i) => L.push((i + 1) + '. ' + r.nama + (emp ? '' : ' [' + r.employer + ']') + ' — ' + (STATUS[r.status] || r.status) +
                (r.lembur ? ' · lembur ' + r.lembur + ' jam' : '') + (r.ket ? ' (' + r.ket + ')' : '')));
        });
        L.push('', 'Dilaporkan oleh ' + (S.user.nama || S.user.username) + ' · ' + jam);
        return L.join('\n');
    }

            catch (err) { if (err.name === 'AbortError') return; }
        }
        window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
        toast('WhatsApp dibuka' + (copied ? ' — teks juga sudah disalin.' : '.'), 'ok');
    }

    function autoKodeBagian(nama) {
        let base = String(nama || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
            .replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 26);
        if (!base) return '';
        if (base.length < 2) base += '_1';
        const used = new Set((S.master.bagian || []).map(b => String(b.kode).toUpperCase()));
        let k = base, i = 2;
        while (used.has(k)) k = base + '_' + (i++);
        return k;
    }

    function parsePeople(text) {
        const lines = [];
        String(text || '').split('\n').map(l => l.trim()).filter(String).forEach(l => {
            if (l.indexOf('|') < 0 && l.indexOf(',') >= 0) l.split(',').forEach(x => { if (x.trim()) lines.push(x.trim()); }); else lines.push(l);
        });
        return lines.map(l => {
            const p = l.split('|').map(x => x.trim());
            const isNum = x => /^\+?[\d\s-]{6,}$/.test(x);
            let sapaan = '', nama = '', nomor = '';
            if (p.length >= 3) { sapaan = p[0]; nama = p[1]; nomor = p[2]; }
            else if (p.length === 2) { if (isNum(p[1])) { nama = p[0]; nomor = p[1]; } else { sapaan = p[0]; nama = p[1]; } }
            else nama = p[0];
            nama = nama.replace(/^@/, '');
            const m = !sapaan && nama.match(/^(pak|bapak|bpk|bu|ibu|mas|mba|mbak|kak)\.?\s+/i);
            if (m) { sapaan = m[0].trim(); nama = nama.slice(m[0].length).trim(); }
            return { sapaan: sapaan, nama: nama, nomor: nomor };
        });
    }

    let reqAppFilter = 'ALL';
    async function renderReqApproval() {
        $('#pageSub').textContent = canApprove()

            '<button type="button" data-ra-st="APPROVED" class="' + (reqAppFilter === 'APPROVED' ? 'on' : '') + '">Approved</button>' +
            '<button type="button" data-ra-st="REJECTED" class="' + (reqAppFilter === 'REJECTED' ? 'on' : '') + '">Ditolak</button>' +
            '</div>' +
            '<span class="spacer"></span>' +
            '<button type="button" class="btn sm primary" onclick="go(\'request_os\')"><span class="material-symbols-outlined">add_circle</span> Buat / Edit Request OS</button>' +

            '</div>' +
            '<div id="raBody"><div class="empty">Memuat daftar Request OS…</div></div>';

        $$('[data-ra-st]').forEach(b => b.onclick = () => {
            reqAppFilter = b.dataset.raSt;
            $$('[data-ra-st]').forEach(x => x.classList.toggle('on', x === b));
            loadReqApprovalList();
        });
        await loadReqApprovalList();
    }

    async function loadReqApprovalList() {
        const res = await call('orderList', { status: reqAppFilter === 'ALL' ? '' : reqAppFilter });
        const items = res.items || [];
        const canApp = !!res.canApprove;
        const spvDefault = res.supervisorName || 'Supervisor';
        const box = $('#raBody');
        if (!box) return;

        if (!items.length) {
            box.innerHTML = '<div class="card empty"><div class="big"><span class="material-symbols-outlined">inbox</span></div><p>Belum ada data Request OS pada filter ini.</p>' +
                '<button class="btn primary" onclick="go(\'request_os\')">Buat Request OS Baru</button></div>';
            return;
        }

        box.innerHTML = items.map(it => {
            const st = it.approvalStatus || 'DRAFT';
            const spvName = it.supervisorName || spvDefault;
            const appByName = it.approvedByNama || it.approvedBy || spvName;
            const subByName = it.submitByNama || it.submitBy || 'Leader / PIC';
            const names = it.reqNames || [];

            let stBadge = '';
            if (st === 'APPROVED') {
                stBadge = '<span class="chip sm ok"><span class="material-symbols-outlined" style="font-size:15px;margin-right:4px">verified</span>Approved oleh Supervisor · ' + esc(appByName) + '</span>';
            } else if (st === 'PENDING') {
                stBadge = '<span class="chip sm warn"><span class="material-symbols-outlined" style="font-size:15px;margin-right:4px">pending_actions</span>Waiting Approval Supervisor · ' + esc(spvName) + '</span>';
            } else if (st === 'REJECTED') {
                stBadge = '<span class="chip sm err"><span class="material-symbols-outlined" style="font-size:15px;margin-right:4px">cancel</span>Ditolak oleh Supervisor · ' + esc(appByName) + '</span>';
            } else {
                stBadge = '<span class="chip sm">Draft (Belum Disubmit ke Supervisor) · ' + esc(spvName) + '</span>';
            }

            let rowsHtml = '';
            if (!names.length) {
                rowsHtml = '<tr><td colspan="6" class="empty small">Belum ada nama karyawan yang dipilih (' + it.request + ' MP).</td></tr>';
            } else {
                rowsHtml = names.map((n, idx) => {
                    const rowSt = st === 'APPROVED'
                        ? '<span class="chip xs ok"><span class="material-symbols-outlined">check_circle</span> Approved · ' + esc(appByName) + '</span>'
                        : (st === 'PENDING'
                            ? '<span class="chip xs warn"><span class="material-symbols-outlined">schedule</span> Waiting Approval Supervisor · ' + esc(spvName) + '</span>'
                            : (st === 'REJECTED'
                                ? '<span class="chip xs err"><span class="material-symbols-outlined">cancel</span> Ditolak · ' + esc(appByName) + '</span>'
                                : '<span class="chip xs">Draft · Waiting Submit</span>'));
                    return '<tr>' +
                        '<td class="muted">' + (idx + 1) + '</td>' +
                        '<td><b style="' + (n.isVacant ? 'color:var(--warn)' : '') + '">' + esc(n.nama) + '</b>' + (n.isVacant ? ' <small class="muted">(Slot Vacant)</small>' : '') + '</td>' +
                        '<td class="mono small muted">' + esc(n.nik || '—') + '</td>' +
                        '<td><span class="wk-div-badge">' + esc(bagName(n.bagian)) + '</span></td>' +
                        '<td class="small"><b>' + esc((n.jam || '').replace('-', '–')) + '</b></td>' +
                        '<td>' + rowSt + '</td>' +
                        '</tr>';
                }).join('');
            }

            return '<div class="card" style="margin-bottom:14px">' +
                '<div class="card-head" style="flex-wrap:wrap;gap:10px">' +
                '<div>' +
                '<div class="row" style="gap:8px;align-items:center">' +
                '<h2 style="margin:0">' + esc(it.tanggalLabel) + ' · ' + esc(shiftName(it.shift)) + '</h2>' +
                '<span class="chip pri">' + it.request + ' MP (' + names.length + ' Nama)</span>' +
                stBadge +
                '</div>' +
                '<div class="small muted" style="margin-top:4px">' +
                'Diajukan oleh: <b>' + esc(subByName) + '</b>' + (it.submitAt ? ' (' + esc(it.submitAt.slice(0, 16)) + ')' : '') +
                ' · Supervisor Approval: <b>' + esc(st === 'APPROVED' ? appByName : spvName) + '</b>' +
                (it.approvedAt ? ' · Waktu Approval: <b>' + esc(it.approvedAt.slice(0, 16)) + '</b>' : '') +
                (it.approvalNote && st === 'REJECTED' ? ' · Catatan: <span style="color:var(--err)">' + esc(it.approvalNote) + '</span>' : '') +
                '</div>' +
                '</div>' +
                '<div class="row" style="gap:8px">' +
                '<button type="button" class="btn sm ghost" data-ra-open="' + it.tanggal + '|' + it.shift + '"><span class="material-symbols-outlined">edit_square</span> Buka Request OS</button>' +
                (canApp && st !== 'APPROVED' ? '<button type="button" class="btn sm ok" data-ra-approve="' + it.tanggal + '|' + it.shift + '"><span class="material-symbols-outlined">verified</span> Approve &amp; Masuk Jadwal</button>' : '') +
                (canApp && st !== 'REJECTED' ? '<button type="button" class="btn sm danger" data-ra-reject="' + it.tanggal + '|' + it.shift + '"><span class="material-symbols-outlined">close</span> Tolak</button>' : '') +
                '</div>' +
                '</div>' +
                '<div class="table-wrap" style="max-height:none"><table class="tbl"><thead><tr>' +
                '<th style="width:42px">No</th><th>Nama Karyawan</th><th>NIK</th><th>Divisi</th><th>Jam Kerja</th><th>Status Approval &amp; User Supervisor</th>' +
                '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
                '</div>';
        }).join('');

        $$('[data-ra-open]', box).forEach(b => b.onclick = () => {
            const [dt, sh] = b.dataset.raOpen.split('|');
            S.wa = { tanggal: dt, shift: sh, type: 'REQ' };
            go('request_os');
        });
        $$('[data-ra-approve]', box).forEach(b => b.onclick = async () => {
            const [dt, sh] = b.dataset.raApprove.split('|');
            b.disabled = true;
            try {
                await call('orderApprove', { tanggal: dt, shift: sh, dates: [dt] });
                toast('Request OS (' + dt + ' · ' + shiftName(sh) + ') berhasil di-Approve! Data otomatis masuk ke Jadwal Employee & Absensi.', 'ok');
                loadReqApprovalList();
            } catch (e) { b.disabled = false; fail(e); }
        });
        $$('[data-ra-reject]', box).forEach(b => b.onclick = () => {
            const [dt, sh] = b.dataset.raReject.split('|');
            openModal({
                title: 'Tolak Request OS (' + dt + ' · ' + shiftName(sh) + ')',
                body: '<p class="small muted">Berikan catatan alasan penolakan untuk Leader / PIC:</p>' +
                    '<label class="field"><span>Catatan Supervisor</span><input name="note" placeholder="Contoh: Kurang operator Inbound…"></label>',
                buttons: [
                    { label: 'Batal' },
                    {
                        label: 'Tolak Request', cls: 'danger', onClick: async () => {
                            const f = formData($('#modalBody'));
                            try {
                                await call('orderReject', { tanggal: dt, shift: sh, note: f.note });
                                closeModal();
                                toast('Request OS ditolak.', 'warn');
                                loadReqApprovalList();
                            } catch (e) { fail(e); }
                        }
                    }
                ]
            });
        });
    }

    /* =========================== INIT =========================== */
    /* =========================== CONTROL AKSES (KHUSUS SUPER ADMIN) =========================== */
    const AK_ROLES = [['ADMIN', 'Admin'], ['SUPERVISOR', 'Supervisor'], ['LEADER', 'Leader / PIC'], ['VIEWER', 'Viewer']];
    let AK = null;
    function akMenus() { return PAGES.filter(p => !p.superOnly); }
    // Menu yang memang hanya untuk dilihat (tidak ada data yang diedit) — pilihan Edit tidak ditampilkan
    const AK_VIEW_ONLY = ['dashboard', 'rekap', 'data_absen'];
    // Level akses menu: '' = tidak ada, 'R' = lihat saja, 'E' = bisa edit
    // Role Viewer memang tidak pernah bisa mengedit — pilihannya hanya Tidak ada / Lihat saja
    function akLevel(list, ro, id, r) { return list.indexOf(id) < 0 ? '' : (ro.indexOf(id) >= 0 || AK_VIEW_ONLY.includes(id) || r === 'VIEWER' ? 'R' : 'E'); }
    function akSetLevel(list, ro, id, lv) {
        const i = list.indexOf(id), j = ro.indexOf(id);
        if (lv === '') { if (i >= 0) list.splice(i, 1); if (j >= 0) ro.splice(j, 1); return; }
        if (i < 0) list.push(id);
        if (lv === 'R' && j < 0 && !AK_VIEW_ONLY.includes(id)) ro.push(id);
        if (lv === 'E' && j >= 0) ro.splice(j, 1);
    }
    function akSelect(attrs, lv, id, label, r) {
        const opts = [['', 'Tidak ada'], ['R', 'Lihat saja']].concat(AK_VIEW_ONLY.includes(id) || r === 'VIEWER' ? [] : [['E', 'Bisa edit']]);
        return '<select class="ak-lv lv-' + (lv || 'N') + '" ' + attrs + ' aria-label="' + esc(label) + '">' +
            opts.map(o => '<option value="' + o[0] + '"' + (o[0] === lv ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
    }
    function akDefault(r) { return akMenus().filter(p => p.roles.indexOf(r) >= 0).map(p => p.id); }

    async function renderAkses() {
        $('#pageSub').textContent = 'Atur menu yang dapat diakses tiap role atau user';
        $('#view').innerHTML = '<div id="akBody"><div class="empty">Memuat…</div></div>';
        const d = await call('accessGet', {});
        const ro = d.config.ro || {};
        AK = { roles: {}, users: Object.assign({}, d.config.users || {}), userList: d.users || [], sel: '',
            roRoles: {}, roUsers: {} };
        AK_ROLES.forEach(r => {
            AK.roles[r[0]] = (d.config.roles && d.config.roles[r[0]]) ? d.config.roles[r[0]].slice() : akDefault(r[0]);
            AK.roRoles[r[0]] = ((ro.roles || {})[r[0]] || []).slice();
        });
        Object.keys(AK.users).forEach(u => { AK.roUsers[u] = ((ro.users || {})[u] || []).slice(); });
        drawAkses();
    }

    function akMenuLabel(p) {
        return '<span style="display:inline-flex;align-items:center;gap:8px"><span style="color:var(--text-3);display:inline-flex">' + (ICONS[p.id] || '') + '</span>' + esc(p.label) + '</span>';
    }

    function drawAkses() {
        const menus = akMenus();
        const roleOf = u => (AK.userList.find(x => x.username === u) || {}).role || '';
        let h = '<div class="card"><div class="card-head"><h2><span class="material-symbols-outlined">group</span>Akses per role</h2>' +
            '<span class="small muted">Pilih untuk tiap menu: <b>Tidak ada</b> (menu disembunyikan), <b>Lihat saja</b> (bisa dibuka, tidak bisa mengedit), atau <b>Bisa edit</b></span></div>' +
            '<div class="table-wrap" style="max-height:none"><table class="tbl ak-tbl"><thead><tr><th>Menu</th>' +
            AK_ROLES.map(r => '<th style="text-align:center">' + r[1] + '</th>').join('') + '</tr></thead><tbody>' +
            menus.map(p => '<tr><td>' + akMenuLabel(p) + '</td>' + AK_ROLES.map(r =>
                '<td style="text-align:center">' + akSelect('data-akr="' + r[0] + '" data-m="' + p.id + '"', akLevel(AK.roles[r[0]], AK.roRoles[r[0]], p.id, r[0]), p.id, p.label + ' untuk ' + r[1], r[0]) + '</td>').join('') + '</tr>').join('') +
            '</tbody></table></div>' +
            '<div class="row" style="margin-top:12px"><button class="btn sm ghost" id="akReset"><span class="material-symbols-outlined">restart_alt</span> Kembalikan ke bawaan</button></div></div>';

        const custom = Object.keys(AK.users);
        h += '<div class="card"><div class="card-head"><h2><span class="material-symbols-outlined">person</span>Akses khusus per user</h2>' +
            '<span class="small muted">Bila diatur, menggantikan akses role untuk user tersebut</span></div>' +
            (custom.length ? '<div class="row" style="gap:6px;margin-bottom:12px">' + custom.map(u => '<span class="chip pri">' + esc(u) + ' · ' + AK.users[u].length + ' menu' + ((AK.roUsers[u] || []).length ? ' (' + AK.roUsers[u].length + ' lihat saja)' : '') + '</span>').join('') + '</div>' : '') +
            '<label class="field" style="max-width:420px"><span>Pilih user</span><select id="akUser"><option value="">— Pilih user —</option>' +
            AK.userList.map(u => '<option value="' + esc(u.username) + '"' + (AK.sel === u.username ? ' selected' : '') + '>' + esc(u.nama + ' (' + u.username + ') · ' + (u.role === 'LEADER' ? 'Leader / PIC' : u.role)) + (AK.users[u.username] ? ' · khusus' : '') + '</option>').join('') +
            '</select></label><div id="akUserBox"></div></div>';

        h += '<div class="savebar"><span>Perubahan berlaku saat user memuat ulang halaman.</span><span class="spacer"></span>' +
            '<button class="btn sm primary" id="akSave"><span class="material-symbols-outlined">check_circle</span> Simpan Control Akses</button></div>';

        $('#akBody').innerHTML = h;
        $$('[data-akr]').forEach(sel => sel.onchange = () => {
            akSetLevel(AK.roles[sel.dataset.akr], AK.roRoles[sel.dataset.akr], sel.dataset.m, sel.value);
            sel.className = 'ak-lv lv-' + (sel.value || 'N');
        });
        $('#akReset').onclick = () => { AK_ROLES.forEach(r => { AK.roles[r[0]] = akDefault(r[0]); AK.roRoles[r[0]] = []; }); drawAkses(); };
        $('#akUser').onchange = e => { AK.sel = e.target.value; drawAkUser(roleOf); };
        $('#akSave').onclick = async () => {
            try {
                await call('accessSave', { roles: AK.roles, users: AK.users, ro: { roles: AK.roRoles, users: AK.roUsers } });
                toast('Control akses disimpan.', 'ok');
            } catch (e) { fail(e); }
        };
        drawAkUser(roleOf);
    }

    function drawAkUser(roleOf) {
        const box = $('#akUserBox');
        const u = AK.sel;
        if (!u) { box.innerHTML = ''; return; }
        const has = !!AK.users[u];
        const list = has ? AK.users[u] : (AK.roles[roleOf(u)] || []);
        const ro = has ? (AK.roUsers[u] = AK.roUsers[u] || []) : (AK.roRoles[roleOf(u)] || []);
        box.innerHTML = '<label class="check"><input type="checkbox" id="akUse"' + (has ? ' checked' : '') + '> Gunakan akses khusus untuk user ini</label>' +
            '<div class="ak-user-grid" style="margin-top:10px' + (has ? '' : ';opacity:.55;pointer-events:none') + '">' +
            akMenus().map(p => '<label class="ak-user-item"><span>' + akMenuLabel(p) + '</span>' +
                akSelect('data-aku="' + p.id + '"' + (has ? '' : ' disabled'), akLevel(list, ro, p.id, roleOf(u)), p.id, p.label, roleOf(u)) + '</label>').join('') + '</div>' +
            (has ? '' : '<p class="small muted" style="margin:8px 0 0">Saat ini mengikuti akses role ' + esc(roleOf(u)) + '.</p>');
        $('#akUse').onchange = e => {
            if (e.target.checked) { AK.users[u] = (AK.roles[roleOf(u)] || []).slice(); AK.roUsers[u] = (AK.roRoles[roleOf(u)] || []).slice(); }
            else { delete AK.users[u]; delete AK.roUsers[u]; }
            drawAkses();
        };
        $$('[data-aku]', box).forEach(sel => sel.onchange = () => {
            akSetLevel(AK.users[u], AK.roUsers[u], sel.dataset.aku, sel.value);
            sel.className = 'ak-lv lv-' + (sel.value || 'N');
        });
    }

    /* =========================== MAINTENANCE (KHUSUS SUPER ADMIN) =========================== */
    async function renderMaintenance() {
        $('#pageSub').textContent = 'Mode pemeliharaan sistem';
        $('#view').innerHTML = '<div id="mtBody"><div class="empty">Memuat…</div></div>';
        drawMaintenance(await call('maintenance', {}));
    }

    /* ---------- Penjelajah database (super admin) ---------- */
    async function loadDbTables() {
        const box = $('#dbList'); if (!box) return;
        try {
            const list = await call('dbTables', {}, { silent: true });
            box.innerHTML = '<div class="table-wrap" style="max-height:none"><table class="tbl"><thead><tr><th>Tabel</th><th class="num">Baris</th><th></th></tr></thead><tbody>' +
                list.map(t => '<tr><td><b class="mono">' + esc(t.table) + '</b><div class="small muted">' + esc(t.label) + '</div></td>' +
                    '<td class="num">' + t.rows.toLocaleString('id-ID') + '</td>' +
                    '<td class="act"><button type="button" class="btn sm" title="Lihat isi" data-dbv="' + esc(t.table) + '"><span class="material-symbols-outlined">table_view</span><span class="btn-txt"> Lihat</span></button> ' +
                    '<button type="button" class="btn sm danger" title="Kosongkan tabel" data-dbt="' + esc(t.table) + '"' + (t.rows ? '' : ' disabled') + '><span class="material-symbols-outlined">delete_sweep</span><span class="btn-txt"> Kosongkan</span></button></td></tr>').join('') +
                '</tbody></table></div>';
            $$('[data-dbv]', box).forEach(b => b.onclick = () => dbViewModal(b.dataset.dbv, 1));
            $$('[data-dbt]', box).forEach(b => b.onclick = () => dbTruncateModal(b.dataset.dbt));
        } catch (e) { box.innerHTML = '<div class="alert err">' + esc(e.message) + '</div>'; }
    }

    async function dbViewModal(table, page) {
        let d;
        try { d = await call('dbRows', { table: table, page: page }); } catch (e) { return fail(e); }
        const cell = v => {
            const s = v == null ? '' : String(v);
            return '<td class="small" title="' + esc(s) + '">' + (s === '' ? '<span class="muted">—</span>' : esc(s.length > 60 ? s.slice(0, 60) + '…' : s)) + '</td>';
        };
        const body = !d.rows.length ? '<div class="empty"><div class="big"><span class="material-symbols-outlined">inbox</span></div><p>Tabel kosong.</p></div>' :
            '<div class="table-wrap" style="max-height:60vh"><table class="tbl db-tbl"><thead><tr><th></th>' + d.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
            d.rows.map(r => '<tr><td class="act">' + (r.__locked ? '<span class="material-symbols-outlined muted" title="Dilindungi">lock</span>'
                : '<button type="button" class="icon-btn" title="Hapus baris" aria-label="Hapus baris" data-dbdel="' + esc(r[d.pk]) + '"><span class="material-symbols-outlined">delete</span></button>') + '</td>' +
                d.cols.map(c => cell(r[c])).join('') + '</tr>').join('') + '</tbody></table></div>';
        openModal({
            title: 'Tabel ' + d.table + ' · ' + d.total.toLocaleString('id-ID') + ' baris', wide: true,
            body: '<p class="small muted" style="margin-top:0">' + esc(d.label) + ' — halaman ' + d.page + ' dari ' + d.pages + ' (50 baris per halaman, terbaru di atas).</p>' + body,
            onOpen: m => {
                $$('[data-dbdel]', m).forEach(b => b.onclick = async () => {
                    if (!await confirmBox('Hapus baris ini?', 'Tabel ' + d.table + ', ' + d.pk + ' = ' + b.dataset.dbdel + '\nTindakan ini permanen.', 'Hapus', 'danger')) return dbViewModal(table, page);
                    try { await call('dbDeleteRow', { table: table, id: b.dataset.dbdel }); toast('Baris dihapus.', 'ok'); loadDbTables(); dbViewModal(table, page); } catch (e) { fail(e); dbViewModal(table, page); }
                });
            },
            buttons: [].concat(d.page > 1 ? [{ label: '← Sebelumnya', onClick: () => dbViewModal(table, d.page - 1) }] : [])
                .concat(d.page < d.pages ? [{ label: 'Berikutnya →', onClick: () => dbViewModal(table, d.page + 1) }] : [])
                .concat([{ label: 'Tutup', cls: 'primary' }])
        });
    }

    function dbTruncateModal(table) {
        const notes = {
            users: 'Semua akun kecuali super admin akan dihapus.',
            user_tokens: 'Semua user akan keluar (kecuali sesi Anda saat ini).',
            settings: 'Semua pengaturan kembali ke nilai bawaan.',
            operator: 'Semua data operator & fotonya akan dihapus.'
        };
        openModal({
            title: 'Kosongkan tabel ' + table + '?',
            body: '<div class="alert err" style="margin-top:0">Seluruh isi tabel <b class="mono">' + esc(table) + '</b> akan dihapus permanen dan tidak dapat dikembalikan.' +
                (notes[table] ? '<br>' + esc(notes[table]) : '') + '</div>' +
                '<label class="field"><span>Ketik <b class="mono">' + esc(table) + '</b> untuk konfirmasi</span><input name="confirm" autocomplete="off" autocapitalize="none"></label>',
            buttons: [{ label: 'Batal' }, {
                label: 'Kosongkan tabel', cls: 'danger', onClick: async () => {
                    const c = ($('#modalBody [name=confirm]').value || '').trim();
                    if (c !== table) return toast('Ketik nama tabel dengan benar untuk konfirmasi.', 'err');
                    try { const r = await call('dbTruncate', { table: table, confirm: c }); closeModal(); toast(r.deleted + ' baris dihapus dari ' + table + '.', 'ok'); loadDbTables(); } catch (e) { fail(e); }
                }
            }]
        });
    }

    function mtAutoApproveCard(on) {
        return '<div class="card">' +
            '<div class="card-head"><h2><span class="material-symbols-outlined">verified</span>Approval Supervisor otomatis</h2>' +
            '<span class="chip ' + (on ? 'ok' : '') + '">' + (on ? 'Aktif' : 'Nonaktif') + '</span></div>' +
            '<p class="muted" style="margin-top:0">' + (on
                ? 'Request OS yang disubmit langsung berstatus Approved dan otomatis masuk ke Jadwal Employee &amp; Absensi tanpa menunggu Supervisor.'
                : 'Request OS yang disubmit menunggu Approval Supervisor terlebih dahulu sebelum masuk ke Jadwal Employee &amp; Absensi.') + '</p>' +
            '<p class="small muted">Request OS yang sudah berstatus menunggu sebelum fitur ini diaktifkan tetap perlu di-Approve manual.</p>' +
            '<button class="btn ' + (on ? '' : 'primary') + '" id="aaToggle"><span class="material-symbols-outlined">' + (on ? 'pause_circle' : 'verified') + '</span> ' +
            (on ? 'Nonaktifkan approval otomatis' : 'Aktifkan approval otomatis') + '</button></div>';
    }

    function drawMaintenance(d) {
        const on = !!d.aktif;
        const key = String(d.key || '');
        const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'maintenance/' + key.charAt(0).toUpperCase() + key.slice(1);
        $('#mtBody').innerHTML = '<div class="card">' +
            '<div class="card-head"><h2><span class="material-symbols-outlined">construction</span>Mode maintenance</h2>' +
            '<span class="chip ' + (on ? 'warn' : 'ok') + '">' + (on ? 'Aktif' : 'Nonaktif') + '</span></div>' +
            '<p class="muted" style="margin-top:0">' + (on
                ? 'Maintenance sedang aktif. Hanya super admin yang dapat masuk; user lain otomatis keluar dan melihat halaman maintenance.'
                : 'Sistem berjalan normal. Saat diaktifkan, semua user selain super admin akan dikeluarkan dan tidak bisa login sampai maintenance dimatikan.') + '</p>' +
            '<label class="field"><span>Alamat login saat maintenance</span><div class="row" style="flex-wrap:nowrap">' +
            '<input readonly id="mtUrl" value="' + esc(url) + '"><button type="button" class="btn sm" id="mtCopy"><span class="material-symbols-outlined">content_copy</span> Salin</button></div>' +
            '<small>Buka alamat ini untuk menampilkan form login ketika maintenance aktif.</small></label>' +
            '<button class="btn ' + (on ? 'primary' : 'danger') + '" id="mtToggle"><span class="material-symbols-outlined">' + (on ? 'play_circle' : 'construction') + '</span> ' +
            (on ? 'Nonaktifkan maintenance' : 'Aktifkan maintenance') + '</button></div>' +
            mtAutoApproveCard(!!d.autoApprove) +
            '<div class="card"><div class="card-head"><h2><span class="material-symbols-outlined">database</span>Database</h2>' +
            '<button type="button" class="btn sm ghost" id="dbReload"><span class="material-symbols-outlined">refresh</span> Muat ulang</button></div>' +
            '<p class="small muted" style="margin-top:0">Lihat isi setiap tabel, hapus baris satu per satu, atau kosongkan tabel. Kolom sensitif disamarkan; akun super admin dilindungi.</p>' +
            '<div id="dbList"><div class="empty">Memuat…</div></div></div>';
        $('#dbReload').onclick = loadDbTables;
        loadDbTables();
        $('#aaToggle').onclick = async () => {
            const aa = !!d.autoApprove;
            if (!aa && !await confirmBox('Aktifkan approval otomatis?', 'Setiap Request OS yang disubmit akan langsung Approved tanpa menunggu Supervisor, dan langsung masuk ke Jadwal Employee & Absensi.', 'Aktifkan', 'primary')) return;
            try {
                const r = await call('setAutoApprove', { aktif: !aa });
                d.autoApprove = r.autoApprove;
                S.master.autoApprove = r.autoApprove;
                toast(r.autoApprove ? 'Approval Supervisor otomatis diaktifkan.' : 'Approval otomatis dimatikan. Request OS kembali menunggu Supervisor.', 'ok');
                drawMaintenance(d);
            } catch (e) { fail(e); }
        };
        $('#mtCopy').onclick = async () => toast(await copyText(url) ? 'Alamat disalin.' : 'Gagal menyalin.', 'ok');
        $('#mtToggle').onclick = async () => {
            if (!on && !await confirmBox('Aktifkan maintenance?', 'Semua user selain super admin akan langsung dikeluarkan dan tidak bisa login.\nSimpan alamat login maintenance terlebih dahulu.', 'Aktifkan', 'danger')) return;
            try {
                const r = await call('setMaintenance', { aktif: !on });
                S.master.maintenance = r.aktif;
                updateMtChip();
                toast(r.aktif ? 'Maintenance diaktifkan.' : 'Maintenance dinonaktifkan. Sistem kembali normal.', 'ok');
                drawMaintenance(r);
            } catch (e) { fail(e); }
        };
    }

    const RENDER = {
        dashboard: renderDashboard, absensi: renderAbsensi, jadwal_ieg: renderJadwalIeg, jadwal: renderJadwal,
        request_os: renderWa, req_approval: renderReqApproval,
        operator: renderOperator, bagian: renderBagian, pengaturan: renderPengaturan, rekap: renderRekap, data_absen: renderDataAbsen,
        akses: renderAkses, maintenance: renderMaintenance
    };

    document.addEventListener('click', e => {
        const t = e.target.closest('[data-page],[data-menu],[data-theme-toggle],[data-close]');
        if (!t) return;
        if (t.dataset.page) { e.preventDefault(); if (S.page === 'absensi') flushAbs(); if (S.page === 'request_os') flushOrder(); go(t.dataset.page); }
        else if (t.hasAttribute('data-menu')) openSide(true);
        else if (t.hasAttribute('data-theme-toggle')) toggleTheme();
        else if (t.hasAttribute('data-close')) closeModal();
    });
    $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    $('#loginForm').addEventListener('submit', doLogin);
    $('#lgEye').onclick = () => {
        const i = $('#lgPass');
        const isPw = i.type === 'password';
        i.type = isPw ? 'text' : 'password';
        const op = $('.eye-open', $('#lgEye'));
        const cl = $('.eye-closed', $('#lgEye'));
        if (op && cl) {
            op.classList.toggle('hidden', isPw);
            cl.classList.toggle('hidden', !isPw);
        }
    };
    $('#btnMenu').onclick = () => openSide(true);
    $('#scrim').onclick = () => openSide(false);
    $('#btnLogout').onclick = () => doLogout(false);
    $('#btnPw').onclick = () => changePasswordModal(false);
    $('#btnProfile').onclick = () => profileModal();
    $('#btnRefresh').onclick = refresh;
    window.addEventListener('beforeunload', () => { flushAbs(); flushOrder(); });
    boot();
</script>
