<!DOCTYPE html>
<html lang="id" data-theme="morning">

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F5F8">
    <link rel="icon" type="image/png" href="assets/image/logo-IEG.png">
    <link rel="apple-touch-icon" href="assets/image/logo-IEG.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <title>HRIS PP Inventory PT.Inovasi Eka Gemilang</title>
    <!-- INCLUDE_STYLES -->
</head>

<body>
    <!-- ============ LOGIN (cadangan; halaman utama login ada di /login) ============ -->
    <section id="login" class="login hidden" aria-label="Masuk">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo-showcase">
                    <img src="assets/image/logo_text-BademdvM.jpg" alt="PT. Inovasi Eka Gemilang" style="height:40px;width:auto" loading="eager">
                </div>
                <div class="login-badge">Portal karyawan</div>
                <h1 class="login-title" id="loginAppName">HRIS PP Inventory</h1>
                <p class="login-subtitle">Man Power Planning &amp; Request OS</p>
            </div>

            <form id="loginForm" class="login-form" autocomplete="on">
                <label class="field">
                    <span>Username</span>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined input-lead-icon">person</span>
                        <input id="lgUser" name="username" autocomplete="username" autocapitalize="none" placeholder="Masukkan username" required>
                    </div>
                </label>
                <label class="field">
                    <span>Password</span>
                    <div class="pw-wrap input-icon-wrap">
                        <span class="material-symbols-outlined input-lead-icon">lock</span>
                        <input id="lgPass" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
                        <button type="button" class="pw-eye" id="lgEye" aria-label="Tampilkan password" title="Tampilkan password">
                            <span class="material-symbols-outlined eye-open">visibility</span>
                            <span class="material-symbols-outlined eye-closed hidden">visibility_off</span>
                        </button>
                    </div>
                </label>
                <div id="loginErr" class="alert err hidden" role="alert"></div>
                <button class="btn primary block lg login-submit-btn" id="lgBtn" type="submit">Masuk</button>
            </form>

            <div class="login-foot">
                <button class="btn ghost sm" type="button" data-theme-toggle>
                    <span class="material-symbols-outlined theme-icon">dark_mode</span>
                    <span class="theme-label">Evening</span>
                </button>
                <div class="login-meta-right">
                    <span class="status-dot-online" aria-hidden="true"></span>
                    <span class="muted small" id="loginVer"></span>
                </div>
            </div>
            <div class="login-credit">Created by M. Solihin · 2026</div>
        </div>
    </section>

    <!-- ============ SHELL ============ -->
    <div id="shell" class="shell hidden">
        <aside id="sidebar" class="sidebar" aria-label="Menu utama">
            <div class="side-brand">
                <div class="logo-mark sm" aria-hidden="true">
                    <img src="assets/image/logo-IEG.png" alt="" loading="eager">
                </div>
                <div class="side-title">
                    <div id="sideAppName">HRIS PP Inventory</div>
                    <small>PT. Inovasi Eka Gemilang</small>
                </div>
            </div>
            <nav id="sideNav" class="side-nav"></nav>
            <div class="side-foot">
                <div class="side-user">
                    <div class="avatar" id="sideAvatar">A</div>
                    <div class="user-meta">
                        <div id="sideUser"></div>
                        <small id="sideRole"></small>
                    </div>
                </div>
                <button class="side-link" id="btnPw">
                    <span class="material-symbols-outlined">lock_reset</span>
                    <span>Ganti password</span>
                </button>
                <button class="side-link" id="btnLogout">
                    <span class="material-symbols-outlined">logout</span>
                    <span>Keluar</span>
                </button>
                <div class="side-credit">Created by M. Solihin · 2026</div>
            </div>
        </aside>
        <div class="scrim" id="scrim"></div>

        <div class="main">
            <header class="topbar">
                <button class="icon-btn only-mobile" id="btnMenu" aria-label="Buka menu" title="Buka menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="top-title">
                    <h1 id="pageTitle">Dashboard</h1>
                    <div class="muted small" id="pageSub"></div>
                </div>
                <div class="top-actions">
                    <span class="chip shift-now" id="shiftNow" title="Shift berjalan"></span>
                    <button class="icon-btn" data-theme-toggle aria-label="Ganti tema" title="Ganti tema Morning/Evening">
                        <span class="material-symbols-outlined theme-icon">dark_mode</span>
                    </button>
                    <button class="icon-btn" id="btnRefresh" aria-label="Muat ulang" title="Muat ulang data">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>
            </header>
            <main id="view" class="view" tabindex="-1"></main>
        </div>

        <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi cepat"></nav>
    </div>

    <!-- ============ MODAL, TOAST & LOADING ============ -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="modalTitle"></h3>
                <button class="icon-btn" data-close aria-label="Tutup" title="Tutup">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-foot" id="modalFoot"></div>
        </div>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="loading" class="loading hidden" role="status" aria-label="Memuat">
        <div class="spinner"></div>
    </div>

    <!-- INCLUDE_APP -->
</body>

</html>
