<!DOCTYPE html>
<html lang="id" data-theme="morning">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" type="image/svg+xml" href="assets/image/favicon.svg">
<link rel="apple-touch-icon" href="assets/image/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<title>Monitoring 6S · PT. Inovasi Eka Gemilang</title>
<style>
/* ===== Design OCS v3.0 — Morning (light) / Evening (dark) ===== */
:root, [data-theme="morning"]{
  --bg:#F8F9FF; --surface:#FFFFFF; --surface-2:#F3F4FF; --hover:#EEF2FF;
  --border:rgba(79,70,229,.10); --line:#E0E0E0;
  --text:#1D2D3E; --text-2:#242424; --muted:#556B82;
  --primary:#4F46E5; --primary-ink:#4338CA; --primary-soft:#EEF2FF; --on-primary:#FFFFFF;
  --accent:#7C3AED; --pink:#EC4899;
  --grad:linear-gradient(135deg,#4F46E5,#7C3AED 55%,#EC4899);
  --side:linear-gradient(180deg,#0F172A 0%,#1E1B4B 55%,#172554 100%);
  --side-text:#C7D2FE; --side-active:linear-gradient(90deg,rgba(99,102,241,.45),rgba(236,72,153,.25));
  --th:linear-gradient(90deg,#EEF2FF,#FCE7F3); --th-text:#4338CA;
  --ok-t:#2E7D32; --ok-b:#E8F5E9; --ok:#4CAF50;
  --warn-t:#B45309; --warn-b:#FFF3E0; --warn:#FB8C00;
  --err-t:#B00020; --err-b:#FDECEE; --err:#B00020;
  --info-t:#1565C0; --info-b:#E3F2FD; --info:#2196F3;
  --neu-t:#475569; --neu-b:#F1F5F9;
  --bar:#4F46E5; --track:#EEF0FB;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.04);
  --shadow-lg:0 10px 30px rgba(30,27,75,.18);
  --scroll:#C7CBEF;
}
[data-theme="evening"]{
  --bg:#12171C; --surface:#1D232A; --surface-2:#232A33; --hover:#2A3240;
  --border:rgba(165,180,252,.14); --line:#2F3943;
  --text:#EAECEE; --text-2:#D5DADD; --muted:#A9B4BE;
  --primary:#818CF8; --primary-ink:#A5B4FC; --primary-soft:rgba(129,140,248,.16); --on-primary:#12171C;
  --accent:#A78BFA; --pink:#F472B6;
  --grad:linear-gradient(135deg,#6366F1,#8B5CF6 55%,#EC4899);
  --side:linear-gradient(180deg,#050811 0%,#0F172A 60%,#172554 100%);
  --side-text:#C7D2FE; --side-active:linear-gradient(90deg,rgba(129,140,248,.35),rgba(244,114,182,.20));
  --th:linear-gradient(90deg,rgba(99,102,241,.20),rgba(236,72,153,.12)); --th-text:#C7D2FE;
  --ok-t:#81C784; --ok-b:rgba(76,175,80,.16); --ok:#66BB6A;
  --warn-t:#FFB74D; --warn-b:rgba(251,140,0,.16); --warn:#FFA726;
  --err-t:#FF8A80; --err-b:rgba(255,82,82,.15); --err:#FF6B6B;
  --info-t:#90CAF9; --info-b:rgba(33,150,243,.16); --info:#64B5F6;
  --neu-t:#CBD5E1; --neu-b:rgba(148,163,184,.14);
  --bar:#818CF8; --track:#262E38;
  --shadow:0 1px 2px rgba(0,0,0,.30); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  --scroll:#3A4552;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13.5px/1.5 "Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
a{color:var(--primary)}
.tnum{font-variant-numeric:tabular-nums}

/* ===== Login ===== */
.login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--grad)}
.login-card{width:100%;max-width:360px;background:var(--surface);border-radius:18px;padding:24px 20px;box-shadow:var(--shadow-lg)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.5px}
.brand-t{font-weight:800;font-size:16px;line-height:1.1}
.brand-s{font-size:12px;color:var(--muted)}

/* ===== Shell (sama dengan HRIS) ===== */
.shell{min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;z-index:40;transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.side.open{transform:none;box-shadow:var(--shadow-lg)}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-mark{width:34px;height:34px;border-radius:8px;background:#fff;padding:3px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-mark img{width:100%;height:100%;object-fit:contain;display:block}
.side-toggle{display:none;place-items:center;flex:none;width:28px;height:28px;margin-left:auto;border:0;border-radius:7px;background:transparent;color:#94A3B8;cursor:pointer}
.side-toggle svg{width:19px;height:19px}
.side-toggle:focus-visible{outline:2px solid #A5B4FC;outline-offset:1px}
@media(hover:hover){.side-toggle:hover{background:rgba(255,255,255,.08);color:#fff}}
.side-title{min-width:0;color:#fff;font-weight:700;font-size:14px;line-height:1.25}
.side-title>div,.side-title small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-title small{display:block;font-weight:500;color:#94A3B8;font-size:11.5px}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav-sec{font-size:11px;font-weight:600;color:#94A3B8;padding:16px 12px 6px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;min-height:38px;padding:0 12px;margin:1px 0;border-radius:8px;color:var(--side-text);text-decoration:none;font-weight:500;font-size:13px;cursor:pointer}
@media(hover:hover){.nav a:hover{background:rgba(255,255,255,.08);color:#fff}}
.nav a.active{background:var(--side-active);color:#fff;font-weight:600}
.nav a.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#F472B6}
.nav svg{width:19px;height:19px;flex:none;opacity:.9}
.nav .badge{margin-left:auto}
.side-foot{padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.side-user{display:flex;gap:10px;align-items:center;padding:8px;margin-bottom:4px;border-radius:8px;color:#fff}
.side-user .user-meta{flex:1;min-width:0}
.side-user b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user small{display:block;color:#94A3B8;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.side-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-text);min-height:34px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;text-decoration:none}
.side-link svg{width:18px;height:18px;flex:none}
@media(hover:hover){.side-link:hover{background:rgba(255,255,255,.08);color:#fff}}
.side-credit{padding:10px 10px 2px;font-size:11px;color:#94A3B8;text-align:center}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.main{min-height:100vh;display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:19px;height:19px}
.view{flex:1;padding:14px 12px 88px;width:100%;min-width:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer;position:relative;min-height:56px;justify-content:center}
.bnav a.active{color:var(--primary)}
.bnav a.active::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
.bnav svg{width:21px;height:21px}
.bnav .badge{position:absolute;top:4px;left:calc(50% + 6px)}
@media(min-width:768px){
  .bnav{display:none!important}
  .view{padding:20px 24px 36px}
  .top{padding:8px 24px;min-height:60px}
}
@media(min-width:1024px){
  .side{transform:none}
  .scrim,#btnMenu{display:none!important}
  .main{margin-left:248px}
  /* Sidebar mini: hanya ikon */
  .side-toggle{display:grid}
  .side,.main{transition:width .22s cubic-bezier(.2,.8,.2,1),margin-left .22s cubic-bezier(.2,.8,.2,1),transform .24s cubic-bezier(.2,.8,.2,1)}
  .side-mini .side{width:72px}
  .side-mini .main{margin-left:72px}
  .side-mini .side-brand{flex-direction:column;gap:8px;padding:14px 8px 12px}
  .side-mini .side-toggle{margin-left:0}
  .side-mini .side-title,.side-mini .nav a>span:not(.badge),.side-mini .side-user .user-meta,.side-mini .side-link>span,.side-mini .side-credit{display:none}
  .side-mini .nav-sec{font-size:0;padding:0;margin:8px 6px;border-top:1px solid rgba(255,255,255,.08)}
  .side-mini .nav{padding:10px 8px}
  .side-mini .nav a{justify-content:center;padding:0}
  .side-mini .nav a.active::before{left:-8px}
  .side-mini .nav .badge{position:absolute;top:3px;right:6px;margin:0}
  .side-mini .side-user,.side-mini .side-link{justify-content:center;padding-left:0;padding-right:0}
}

/* ===== Komponen ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 10px;font-size:14.5px;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--primary)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin-top:2px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--grad);border:0;color:#fff}.kpi.hero .l,.kpi.hero .s{color:rgba(255,255,255,.85)}
/* Dashboard: grid 3 kolom tetap, pita status, tabel poin per PIC */
.dash3{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);margin-bottom:12px}
@media(min-width:1100px){.dash3{grid-template-columns:repeat(3,minmax(0,1fr))}.dash3 .span2{grid-column:span 2}}
.dash3>.card{min-width:0}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.strip button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid transparent;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.strip .ok{background:var(--neu-b);color:var(--neu-t);cursor:default}
.strip .warn{background:var(--warn-b);color:var(--warn-t)}
.strip .err{background:var(--err-b);color:var(--err-t)}
.strip svg{width:15px;height:15px}
.kpi .v.err{color:var(--err-t)}
.pic-tbl td{vertical-align:middle}
.pic-name{display:block;border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--text);cursor:pointer;text-align:left;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pic-meta{font-size:11.5px;color:var(--muted);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{display:grid;grid-template-columns:52px 64px;align-items:center;gap:8px;justify-content:end}
.pbar b{text-align:right;font-variant-numeric:tabular-nums}
.pbar i{display:block;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.pbar i span{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:3px}
.pbar i span.neg{background:var(--err)}
@media(hover:hover){.pic-name:hover{color:var(--primary)}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--grad);border:0;color:#fff}
.btn.wa{background:#25D366;border:0;color:#fff}.btn.wa:hover{background:#1EBE5A}
.btn.wa.wa-soft{background:transparent;border:1px solid #25D366;color:#128C7E}
[data-theme="evening"] .btn.wa.wa-soft{color:#25D366}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok);border:0;color:#fff}
.btn.danger{background:var(--err-b);color:var(--err-t);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.inp{width:100%;min-height:38px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);outline:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 16px,calc(100% - 13px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.seg.score button{width:40px;padding:0}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13.5px}
.chk input{width:20px;height:20px;accent-color:var(--primary);margin:1px 0 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.c-ok{background:var(--ok-b);color:var(--ok-t)}.c-warn{background:var(--warn-b);color:var(--warn-t)}
.c-err{background:var(--err-b);color:var(--err-t)}.c-info{background:var(--info-b);color:var(--info-t)}
.c-neu{background:var(--neu-b);color:var(--neu-t)}.c-pri{background:var(--primary-soft);color:var(--primary-ink)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#EC4899;color:#fff;font-size:10.5px;font-weight:800;display:inline-grid;place-items:center}
.muted{color:var(--muted)}.small{font-size:12px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty svg{width:42px;height:42px;opacity:.5;display:block;margin:0 auto 8px}
.note{background:var(--primary-soft);color:var(--primary-ink);border-radius:10px;padding:10px 12px;font-size:13px}
.note svg{width:16px;height:16px;vertical-align:-3px}
.note.warn{background:var(--warn-b);color:var(--warn-t)}

/* Daftar temuan */
.tlist{display:grid;gap:10px}
@media(min-width:760px){.tlist{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1200px){.tlist{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1600px){.tlist{grid-template-columns:repeat(4,1fr)}}
.titem{display:flex;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.titem:hover{border-color:var(--primary)}
.titem.late{box-shadow:inset 3px 0 0 var(--err),var(--shadow)}
.thumb{width:68px;height:68px;border-radius:10px;background:var(--surface-2);flex:none;object-fit:cover}
/* Datatable verifikasi */
.dt th.sort{cursor:pointer;user-select:none}
.dt th.sort::after{content:" ↕";opacity:.35;font-weight:400}
.dt th.sort.asc::after{content:" ↑";opacity:1}.dt th.sort.desc::after{content:" ↓";opacity:1}
.dt td{vertical-align:middle}
.dt .ph2{display:flex;gap:4px}
.dt .ph2 img,.dt .ph2 div{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.dt .cell-main{font-weight:700;color:var(--text);white-space:nowrap}
.dt .cell-sub{font-size:11.5px;color:var(--muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt tr.own td{background:var(--surface-2)}
.hr-bars{display:grid;grid-template-columns:auto 72px;gap:3px 8px;align-items:center;font-size:12px}
.hr-bl{color:var(--neu-t)}.hr-bl.ok{color:var(--ok-t);font-weight:600}
.hr-bar{display:block;height:6px;border-radius:3px;background:var(--line)}.hr-bar.ok{background:var(--ok)}
.hr-jam{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:12px;color:var(--text-2)}
.hr-jam span{display:grid;line-height:1.25}.hr-jam small{font-size:10.5px;color:var(--muted);font-weight:600}
.hr-c-sec .hr-jam{margin-top:0;font-size:14px;gap:6px 22px}.hr-c-sec .hr-jam small{font-size:11px}
@media(max-width:760px){
  .flt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .flt>.inp,.flt>input{max-width:none!important;width:100%}
  .flt>.seg,.flt>#pQ,.flt>input[type=month]{grid-column:1/-1}
  .flt>.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
  .flt>.grow,.flt>.small.muted{display:none}
  .flt>.btn,.flt>.icon-btn{width:100%}
  .hr-card .pic-name{max-width:100%;font-size:15px}
}
.rk-bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}.rk-bar i{display:block;height:100%;border-radius:4px}
.rk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rk-grid div{display:grid;gap:2px}.rk-grid small{font-size:11px;color:var(--muted);font-weight:600}.rk-grid b{font-size:15px;font-variant-numeric:tabular-nums}
.hr-ket{display:grid;gap:1px;font-size:11.5px;color:var(--muted);margin-top:3px}
.hr-cards{display:none}

/* ---------- Server call ---------- */
async function call(fn, ...args) {
  let res;
  try {
    const r = await fetch('api6s.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn, args }), credentials: 'same-origin' });
    res = await r.json();
  } catch (e) { throw new Error('Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.'); }
  if (!res) throw new Error('Tidak ada respon dari server.');
  if (res.ok) return res.data;
  if (res.error === 'SESI_HABIS') { logout(true); throw new Error('Sesi berakhir, silakan masuk lagi.'); }
  if (res.error === 'MAINTENANCE') { store.del('hris_token'); showLogin('Monitoring 6S sedang maintenance. Silakan coba lagi nanti.'); throw new Error('Monitoring 6S sedang maintenance.'); }
  if (res.error === 'GANTI_PASSWORD') { location.replace(HOME_URL); throw new Error('Ganti password awal di HRIS terlebih dahulu.'); }
  throw new Error(res.error);
}

/* ---------- Foto: kompres + cap waktu ---------- */
function compressPhoto(file, stamp, max = 1280, q = 0.7) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0, c.width, c.height);
      if (stamp) {
        const fs = Math.max(14, Math.round(c.width / 40));
        g.font = '600 ' + fs + 'px sans-serif';
        const pad = Math.round(fs * .6), hBar = fs + pad * 2;
        g.fillStyle = 'rgba(15,23,42,.62)';
        g.fillRect(0, c.height - hBar, c.width, hBar);
        g.fillStyle = '#fff'; g.textBaseline = 'middle';
        g.fillText(stamp, pad, c.height - hBar / 2);
      }
      URL.revokeObjectURL(url);
      let out = c.toDataURL('image/webp', q);
      if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', q);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto tidak dapat dibaca.')); };
    img.src = url;
  });
}
function stampText(areaNama) { return fDate(Date.now()) + ' WIB · ' + areaNama + ' · ' + S.user.nama; }

    '<input type="file" id="' + id + '" accept="image/*" capture="environment" hidden>';

function bindPhoto(id, getStamp, onDone) {
  $('#' + id).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const box = $('#' + id + '_box');
    box.innerHTML = '<div class="spin" style="margin:10px auto"></div>';

      box.innerHTML = '<img src="' + data + '" alt="Pratinjau foto"><div class="small muted" style="margin-top:6px">Ketuk untuk mengganti foto</div>';
      onDone(data);
    } catch (err) { toast(err.message, true); box.innerHTML = ic('cam') + '<div>Coba lagi</div>'; }
    e.target.value = '';
  });
}

    if (bawah > 0) st.push(['warn', bawah + ' PIC di bawah target KPI ' + kp.target, canDo('kpi') ? "go('kpi')" : '']);
    let h = '<div class="strip" role="status">' + (st.length
      ? st.map(x => '<button type="button" class="' + x[0] + '"' + (x[2] ? ' onclick="' + x[2] + '"' : '') + '>' + esc(x[1]) + '</button>').join('')
      : '<button type="button" class="ok">' + ic('check') + 'Semua dalam ambang</button>') + '</div>';

    // 2) KPI ringkas
    h += '<div class="kpis" style="margin-bottom:12px">' +
      kpi('Temuan ' + fBulan(d.bulan), k.total, 'semua area') +
      kpi('Belum diperbaiki', k.aktif, k.belumDiambil ? k.belumDiambil + ' belum diambil PIC' : k.belumDiterima ? k.belumDiterima + ' menunggu diterima PIC' : 'Open & Revisi', "go('daftar',{status:'Perbaikan',bulan:''})") +
      kpi('Menunggu verifikasi', k.menunggu, (k.keberatan ? k.keberatan + ' keberatan · ' : '') + 'SLA ' + c.slaVerif + ' jam', canDo('verif') ? "go('verif')" : '') +
      kpi('Lewat target', k.terlambat, 'belum diperbaiki', "go('daftar',{status:'Terlambat',bulan:''})", k.terlambat > 0) +
      kpi('Rata-rata KPI PIC', kp.rata == null ? '-' : num(kp.rata), kp.capai + ' dari ' + kp.dinilai + ' capai target ' + kp.target, canDo('kpi') ? "go('kpi')" : '', kp.rata != null && kp.rata < kp.target) +
      kpi('Tepat waktu', k.tepatPct == null ? '-' : k.tepatPct + '%', k.closed + ' selesai bulan ini', "go('daftar',{status:'Closed'})") + '</div>';

    // 3) Fokus: poin per PIC
    const pics = d.pics || [];
    const mx = Math.max(1, ...pics.map(p => Math.abs(p.poin)));
    const shiftChip = p => p.shift === 'bertugas' ? ' <span class="chip c-ok" title="' + esc(p.shiftLabel) + '">Bertugas</span>' : (p.shift === 'absen' ? ' <span class="chip c-err" title="' + esc(p.shiftLabel) + '">Tidak masuk</span>' : '');
    h += '<div class="dash3"><div class="card span2"><h3>Poin per PIC<span class="sub">' + fBulan(d.bulan) + ' · ' + pics.length + ' Leader / PIC · ' + kp.bertugas + ' sedang bertugas</span></h3>' +
      (pics.length ? '<div class="tbl-wrap"><table class="tbl pic-tbl" style="min-width:760px"><tr><th>#</th><th>PIC</th><th class="num">Poin</th><th class="num">KPI</th><th class="num">' + (modeBebas() ? 'Diambil' : 'Ditugaskan') + '</th><th class="num">Selesai</th><th class="num">Lewat target</th><th class="num">Respon</th></tr>' +
        pics.map((p, i) => '<tr><td><span class="rank ' + (i < 3 && p.poin > 0 ? 'r' + (i + 1) : '') + '">' + (i + 1) + '</span></td>' +
          '<td><button type="button" class="pic-name" title="Riwayat poin ' + esc(p.nama) + '" onclick="openPoinPic(' + esc(JSON.stringify(p.nik)) + ',' + esc(JSON.stringify(d.bulan)) + ')">' + esc(p.nama) + '</button>' +
          '<div class="pic-meta" title="' + esc(p.area.join(', ')) + '">' + (p.area.length ? esc(p.area.join(', ')) : 'Area belum diatur') + shiftChip(p) + '</div></td>' +
          '<td class="num"><div class="pbar"><b>' + signed(p.poin) + '</b><i><span class="' + (p.poin < 0 ? 'neg' : '') + '" style="width:' + (Math.abs(p.poin) / mx * 100) + '%"></span></i></div></td>' +
          '<td class="num">' + kpiChip(p, kp.target) + '</td><td class="num">' + p.ditugaskan + '</td>' +
          '<td class="num">' + p.selesai + (p.menunggu ? ' <span class="small muted">+' + p.menunggu + '</span>' : '') + '</td>' +
          '<td class="num">' + (p.overdue ? '<span class="chip c-err">' + p.overdue + '</span>' : '0') + '</td>' +
          '<td class="num">' + pctTxt(p.pctRespon) + '</td></tr>').join('') + '</table></div>'
        : emptyBox('Belum ada Leader / PIC IEG. Tambahkan akun role Leader di HRIS → Pengaturan → Pengguna.')) +
      '<p class="small muted" style="margin:10px 0 0">' + (modeBebas()
        ? 'Semua PIC berhak melakukan 6S: <b>+</b> menemukan temuan, menyelesaikan temuan tepat waktu (bonus bila cepat) · <b>−</b> terlambat dan revisi. Makin banyak yang diproses, makin banyak poinnya.'
        : 'Poin PIC: <b>+</b> menemukan temuan di area PIC lain, perbaikan tepat waktu (bonus bila cepat) · <b>−</b> temuan di area yang ia pegang, terlambat, revisi, tugas tidak direspon.') + ' Klik nama untuk melihat riwayat poinnya.' +
      (canDo('kpi') ? ' <a href="#" onclick="go(\'kpi\');return false">Rincian KPI PIC</a>' : '') + '</p></div>';

    // Perlu tindakan
    const urgent = [];
    (d.belumRespon || []).forEach(t => urgent.push(t));
    (d.terlambat || []).forEach(t => { if (!urgent.some(x => x.id === t.id)) urgent.push(t); });
    h += '<div class="card"><h3>Perlu tindakan<span class="sub">' + (modeBebas() ? 'lama belum diambil' : 'belum direspon') + ' &amp; lewat target</span></h3>' +
      (urgent.length ? '<div class="tlist" style="grid-template-columns:1fr">' + urgent.slice(0, 8).map(tItem).join('') + '</div>' : emptyBox('Tidak ada yang tertunda')) + '</div></div>';

    // 4) Pendukung: kategori & tren
    h += '<div class="dash3"><div class="card"><h3>Temuan per kategori 6S<span class="sub">' + fBulan(d.bulan) + '</span></h3>' +
      barList(S.boot.rList.map(r => ({ l: r, v: d.byR[r] || 0 }))) +
      '<div class="small muted" style="margin-top:10px">Tingkat: ' + S.boot.tingkat.map(x => x + ' <b class="tnum">' + (d.byTingkat[x] || 0) + '</b>').join(' · ') + '</div></div>';
    h += '<div class="card span2"><h3>Temuan baru per minggu<span class="sub">8 minggu terakhir</span></h3>' +
      colChart(d.tren.map(t => ({ l: t.label, v: t.baru, tip: 'Minggu ' + t.label + ': ' + t.baru + ' temuan baru, ' + t.selesai + ' selesai' }))) + '</div></div>';
    DB.innerHTML = h;
    $$('.kpi.click', DB).forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); } }));
  } catch (e) { DB.innerHTML = emptyBox(e.message); }
};

VIEWS.input = function () {
  const B = S.boot;
  const F = { areaId: AREA_PARAM && B.areas.some(a => a.id === AREA_PARAM) ? AREA_PARAM : '', r: '', tingkat: '', foto: '' };
  const v = $('#view');
  v.innerHTML = '<div class="grid g2"><div class="card">' +
    '<div class="field"><label for="iArea">Area</label><select class="inp" id="iArea"><option value="">— Pilih area —</option>' +
    B.areas.map(a => '<option value="' + esc(a.id) + '"' + (a.id === F.areaId ? ' selected' : '') + '>' + esc(a.nama) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label for="iLok">Lokasi detail</label><input class="inp" id="iLok" placeholder="contoh: Rak A-03, Meja 2, Mesin 1"><span class="hint">Lokasi yang sama + kategori sama dalam ' + B.config.hariBerulang + ' hari dihitung temuan berulang.</span></div>' +
    '<div class="field"><label>Kategori 6S</label><div class="seg" id="iR">' + B.rList.map(r => '<button type="button" data-v="' + esc(r) + '" title="' + esc((B.rInfo || {})[r] || '') + '">' + esc(r) + '</button>').join('') + '</div><span class="hint" id="iRInfo">Pilih salah satu dari 6S.</span></div>' +
    '<div class="field"><label>Tingkat</label><div class="seg" id="iT">' + B.tingkat.map(x => '<button type="button" data-v="' + x + '">' + x + ' · standar ' + B.config.deadline[x] + ' jam</button>').join('') + '</div><span class="hint">PIC yang menerima tugas menentukan target selesai sendiri; batas standar dipakai untuk poin tepat waktu.</span></div>' +
    '<div class="field"><label for="iDesk">Deskripsi temuan</label><textarea class="inp" id="iDesk" placeholder="Jelaskan kondisi yang ditemukan"></textarea></div>' +
    '</div><div class="card">' +
    '<div class="field"><label>Foto sebelum (bukti temuan)</label>' + photoPicker('iFoto', 'Ambil foto temuan') + '</div>' +
    '<div class="note" id="iTim" style="margin-bottom:12px" hidden></div>' +
    '<div class="field"><label>PIC perbaikan</label><div class="note" id="iAuto">PIC dipilih otomatis dari jadwal shift &amp; absensi hari ini setelah area dipilih.</div>' +
    '<button type="button" class="btn ghost sm" id="iGanti" style="margin-top:6px" hidden>Ganti PIC</button>' +
    '<div id="iPicWrap" style="margin-top:8px" hidden><select class="inp" id="iPic" aria-label="PIC perbaikan"><option value="">— Pilih area dulu —</option></select></div></div>' +
    '<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="iBer"><span>Tandai sebagai temuan berulang<br><span class="small muted">Sistem juga mendeteksi otomatis dari lokasi + kategori.</span></span></label>' +
    '<div class="note" id="iEst" style="margin-bottom:12px">Pilih area, kategori, dan tingkat untuk melihat dampak poin.</div>' +
    (canEdit('input') ? '<button class="btn primary block" id="iSubmit">' + ic('plus') + 'Simpan temuan</button>' : '<div class="note warn">Akses Anda untuk Input Temuan hanya lihat saja.</div>') + '</div></div>';

  const opt = (u, lbl) => '<option value="' + esc(u.nik) + '">' + esc(u.nama) + (lbl ? ' — ' + esc(lbl) : '') + '</option>';
  let picReq = 0;
  const setPic = async () => {
    const a = B.areas.find(x => x.id === F.areaId);
    const sel = $('#iPic'), box = $('#iAuto');
    const manual = on => { $('#iPicWrap').hidden = !on; $('#iGanti').textContent = on ? 'Pakai PIC otomatis' : 'Ganti PIC'; if (!on) sel.value = ''; };
    manual(false); $('#iGanti').hidden = true;
    if (modeBebas()) {
      // Ambil bebas: temuan tidak terikat PIC / gudang mana pun
      F.autoPic = null;
      box.className = 'note';
      box.innerHTML = ic('check') + ' Temuan masuk ke <b>Tugas tersedia</b>. Leader / PIC mana pun bisa mengambil &amp; memprosesnya — satu temuan hanya diproses satu orang.';
      $('#iTim').hidden = !a;
      if (a) $('#iTim').innerHTML = 'Area: <b>' + esc(a.nama) + '</b> · dilaporkan oleh ' + esc(S.user.nama);
      est(); return;
    }
    if (!a) {
      sel.innerHTML = '<option value="">— Pilih area dulu —</option>';
      box.className = 'note'; box.textContent = 'PIC dipilih otomatis dari jadwal shift & absensi hari ini setelah area dipilih.';
      $('#iTim').hidden = true; return;
    }
    const mandiri = S.user.tim && S.user.tim === a.tim;
    $('#iTim').hidden = false;
    $('#iTim').innerHTML = 'Tim penanggung jawab: <b>' + esc(a.tim) + '</b>' + (mandiri ? ' · ini tim Anda sendiri (lapor mandiri)' : ' · dilaporkan oleh ' + (S.user.tim ? 'Tim ' + esc(S.user.tim) : esc(S.user.nama)));
    box.className = 'note'; box.innerHTML = '<span class="small muted">Mencari PIC yang bertugas…</span>';
    const req = ++picReq;
    let r;
    try { r = await call('apiPicBertugas', S.token, a.id); } catch (e) { r = { pic: null, alasan: e.message, kandidat: [] }; }
    if (req !== picReq) return;   // area sudah diganti
    const lbl = {}; (r.kandidat || []).forEach(k => { lbl[k.nik.toLowerCase()] = JAD_TXT[k.status] || ''; });
    const areaPic = B.users.filter(u => lbl[u.nik.toLowerCase()] !== undefined);
    const lain = B.users.filter(u => lbl[u.nik.toLowerCase()] === undefined);
    sel.innerHTML = (r.pic ? '<option value="">Otomatis — ' + esc(r.pic.nama) + '</option>' : '<option value="">— Pilih PIC —</option>') +
      (areaPic.length ? '<optgroup label="Kandidat sesuai jadwal hari ini">' + areaPic.map(u => opt(u, lbl[u.nik.toLowerCase()])).join('') + '</optgroup>' : '') +
      (lain.length ? '<optgroup label="PIC lain">' + lain.map(u => opt(u)).join('') + '</optgroup>' : '');
    $('#iGanti').onclick = () => { manual($('#iPicWrap').hidden); est(); };
    F.autoPic = r.pic || null; est();
    if (r.pic) {
      $('#iGanti').hidden = false;
      box.className = 'note';
      box.innerHTML = ic('check') + ' Tugas akan masuk ke <b>' + esc(r.pic.nama) + '</b><div class="small" style="margin-top:2px">' + esc(r.alasan) + ' · harus diterima dalam ' + r.slaRespon + ' jam' + (r.mulai ? ' sejak shift mulai' : '') + '</div>' +
        ((r.kandidat || []).length > 1 ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + r.kandidat.map(k => '<span class="small" title="' + esc(k.label) + '">' + esc(k.nama) + ' ' + jadChip(k.status) + '</span>').join('') + '</div>' : '');
    } else {
      box.className = 'note warn'; box.textContent = (r.alasan || 'Belum ada PIC.') + ' Pilih PIC secara manual:';
      manual(true);
    }
  };
  const est = () => {
    if (!F.areaId || !F.tingkat) return;
    const c = B.config, ket = [];
    if (modeBebas()) {
      let pb = c.potong[F.tingkat]; if ($('#iBer').checked) { pb *= c.faktorBerulang; ket.push('berulang ×' + c.faktorBerulang); }
      const a0 = B.areas.find(x => x.id === F.areaId), plus0 = F.tingkat === 'Kritis' ? c.poinTepatKritis : c.poinTepat;
      $('#iEst').innerHTML = ((S.user.pic || c.laporSemua) && c.poinLaporPic ? 'Anda mendapat <b>+' + num(c.poinLaporPic) + '</b> sebagai penemu. ' : '') +
        'PIC yang mengambil &amp; menyelesaikannya dalam batas standar <b>' + c.deadline[F.tingkat] + ' jam</b> mendapat <b>+' + plus0 + '</b> (bonus +' + c.bonusCepat + ' bila sangat cepat). ' +
        'Skor area ' + esc(a0 ? a0.nama : '') + ' dipotong <b>−' + num(pb) + '</b>' + (ket.length ? ' (' + ket.join(', ') + ')' : '') + '.';
      return;
    }
    // Poin per PIC: PIC penanggung jawab dipotong, penemu dari area lain mendapat poin
    const sel = $('#iPic'), man = sel && sel.value && !$('#iPicWrap').hidden;
    const pic = man ? { nik: sel.value, nama: (B.users.find(u => u.nik === sel.value) || {}).nama || sel.value } : F.autoPic;
    const me = S.user.nik.toLowerCase();
    const mandiri = (pic && pic.nik.toLowerCase() === me) || (S.user.areaPic || []).indexOf(F.areaId) >= 0;
    let p = c.potong[F.tingkat] * (c.faktorPotongPic == null ? 1 : c.faktorPotongPic);
    if ($('#iBer').checked) { p *= c.faktorBerulang; ket.push('berulang ×' + c.faktorBerulang); }
    if (mandiri) { p *= c.faktorMandiri; ket.push('lapor mandiri ×' + c.faktorMandiri); }
    const plus = F.tingkat === 'Kritis' ? c.poinTepatKritis : c.poinTepat;
    $('#iEst').innerHTML = (pic ? 'PIC <b>' + esc(pic.nama) + '</b>' : 'PIC area') + ' dipotong <b>−' + num(p) + '</b>' + (ket.length ? ' (' + ket.join(', ') + ')' : '') +
      ((!mandiri || c.laporAreaSendiri) && (S.user.pic || c.laporSemua) && c.poinLaporPic ? '. Anda mendapat <b>+' + num(c.poinLaporPic) + '</b> sebagai penemu' + (mandiri ? '' : ' (area PIC lain)') : '') +
      '. Bila diperbaiki dalam batas standar <b>' + c.deadline[F.tingkat] + ' jam</b>, PIC mendapat <b>+' + plus + '</b> (bonus +' + c.bonusCepat + ' bila sangat cepat).';
  };
  const seg = (id, key) => $$('#' + id + ' button').forEach(b => b.addEventListener('click', () => {
    $$('#' + id + ' button').forEach(x => x.classList.remove('on')); b.classList.add('on'); F[key] = b.dataset.v; est();
    if (id === 'iR') $('#iRInfo').textContent = (B.rInfo || {})[F.r] || '';
  }));
  seg('iR', 'r'); seg('iT', 'tingkat');
  $('#iArea').addEventListener('change', e => { F.areaId = e.target.value; setPic(); est(); });
  $('#iBer').addEventListener('change', est);
  $('#iPic').addEventListener('change', est);
  bindPhoto('iFoto', () => { const a = B.areas.find(x => x.id === F.areaId); return stampText(a ? a.nama : 'Area belum dipilih'); }, d => { F.foto = d; });
  setPic();

  if ($('#iSubmit')) $('#iSubmit').addEventListener('click', async () => {
    const payload = { areaId: F.areaId, lokasi: $('#iLok').value.trim(), kategoriR: F.r, tingkat: F.tingkat, deskripsi: $('#iDesk').value.trim(), foto: F.foto, picNik: $('#iPic').value, berulang: $('#iBer').checked };
    const miss = [];
    if (!payload.areaId) miss.push('area'); if (!payload.kategoriR) miss.push('kategori 6S'); if (!payload.tingkat) miss.push('tingkat');
    if (!payload.deskripsi) miss.push('deskripsi'); if (!payload.foto) miss.push('foto');
    if (!payload.picNik && !$('#iPicWrap').hidden) miss.push('PIC');
    if (miss.length) return toast('Lengkapi: ' + miss.join(', '), true);
    const btn = $('#iSubmit'); btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      const t = await call('apiCreateTemuan', S.token, payload);
      refreshBadges();
      openModal('Temuan tersimpan',
        '<div class="note" style="margin-bottom:12px"><b>' + esc(t.id) + '</b> · ' + esc(t.area) + '<br>' + (t.picNik ? 'PIC: <b>' + esc(t.pic) + '</b> · harus diterima sebelum ' + fDate(t.batasRespon) : 'Masuk <b>Tugas tersedia</b> — Leader / PIC mana pun bisa mengambilnya') + '<br>Batas standar perbaikan ' + fDate(t.deadlineStandar) + ' (PIC menentukan target)<br>Skor Tim ' + esc(t.tim) + ': <b>' + signed(t.poinArea) + '</b>' + (t.berulang ? ' (berulang)' : '') + (t.mandiri ? ' (lapor mandiri)' : '') + '</div>' +
        '<div class="grid g2"><button class="btn" onclick="closeModal();go(\'input\')">' + ic('plus') + 'Input lagi</button>' +
        '<button class="btn primary" id="okWa">' + ic('wa') + 'Bagikan ke WA</button></div>');
      $('#okWa').onclick = () => shareWA(waTemuan(t));
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.innerHTML = ic('plus') + 'Simpan temuan'; }
  });
};

    '<div class="meta">' + statusChip(t) + rChip(t.r) + tingkatChip(t.tingkat) + (t.berulang ? '<span class="chip nodot c-err">Berulang</span>' : '') + '</div>' +

/* ---------- Daftar temuan: datatable ---------- */
VIEWS.daftar = async function (opt) {
  const v = $('#view'), B = S.boot;
  const st = S.df || (S.df = { bulan: S.bulan, status: '', area: '', pic: '', q: '', sort: 'tanggal', dir: -1, page: 1, per: 20 });
  if (opt && Object.keys(opt).length) {
    if ('bulan' in opt) st.bulan = opt.bulan;
    if ('status' in opt) st.status = opt.status;
    if ('areaId' in opt) st.area = opt.areaId;
    st.page = 1;
  }
  const stOpts = [['', 'Semua status'], ['Aktif', 'Belum selesai'], ['Perbaikan', 'Belum diperbaiki'], ['Terlambat', 'Terlambat'], ['Open', 'Open'], ['Revisi', 'Revisi'], ['Menunggu Verifikasi', 'Menunggu verifikasi'], ['Keberatan', 'Keberatan'], ['Closed', 'Closed'], ['Batal', 'Batal']];
  v.innerHTML = '<div class="toolbar">' + monthInput('dfBulan', st.bulan) +
    (st.bulan ? '<button class="btn sm" id="dfAll" title="Tampilkan semua bulan">Semua bulan</button>' : '') +
    '<select class="inp" id="dfSt" style="max-width:190px">' + stOpts.map(o => '<option value="' + o[0] + '">' + o[1] + '</option>').join('') + '</select>' +
    '<select class="inp" id="dfArea" style="max-width:200px"><option value="">Semua area</option>' + B.areas.map(a => '<option value="' + esc(a.id) + '">' + esc(a.nama) + '</option>').join('') + '</select>' +
    '<select class="inp" id="dfPic" style="max-width:190px"><option value="">Semua PIC</option></select>' +
    '<input class="inp grow" id="dfQ" placeholder="Cari ID, lokasi, deskripsi, PIC, pelapor" value="' + esc(st.q) + '">' +
    '<button class="icon-btn" id="dfRe" title="Muat ulang" aria-label="Muat ulang">' + ic('refresh') + '</button></div><div id="dfBody"></div>';
  $('#dfSt').value = st.status; $('#dfArea').value = st.area;
  const DB = $('#dfBody');
  let rows = [];
  const aktif = t => t.status === 'Open' || t.status === 'Revisi';
  const key = {
    id: t => t.id, tanggal: t => t.tanggal || 0, area: t => (t.area + ' ' + t.lokasi).toLowerCase(),
    tingkat: t => ({ Kritis: 0, Mayor: 1, Minor: 2 }[t.tingkat] ?? 3), pelapor: t => (t.pelapor || '').toLowerCase(),
    pic: t => (t.pic || '~').toLowerCase(), target: t => t.deadline || Infinity, status: t => t.status
  };
  const fillPic = () => {
    const names = [...new Set(rows.map(t => t.pic).filter(Boolean))].sort((a, b) => a.localeCompare(b));

VIEWS.verif = async function () {
  const v = $('#view'), me = S.user.nik.toLowerCase(), sla = S.boot.config.slaVerif * 36e5;
  const st = S.vf || (S.vf = { q: '', status: '', area: '', pic: '', sort: 'kirim', dir: 1, page: 1, per: 20 });
  if (st.pic === undefined) st.pic = '';
  v.innerHTML = '<div class="toolbar">' +
    '<input class="inp grow" id="vfQ" placeholder="Cari ID, area, lokasi, PIC, catatan" value="' + esc(st.q) + '">' +
    '<select class="inp" id="vfSt" style="max-width:210px"><option value="">Semua status</option><option value="belum">Belum diverifikasi</option><option value="Menunggu Verifikasi">· Menunggu verifikasi</option><option value="Keberatan">· Keberatan</option><option value="sudah">Sudah diverifikasi</option><option value="Closed">· Diterima (Closed)</option><option value="Revisi">· Ditolak (Revisi)</option></select>' +

  let rows = [];

  const waktu = t => t.status === 'Keberatan' ? t.tglKeberatan : (t.tglPerbaikan || t.tglKeberatan);
  const okStatus = t => !st.status || (st.status === 'belum' ? pend(t) : st.status === 'sudah' ? !pend(t) : t.status === st.status);
  const fillPic = () => {
    const names = [...new Set(rows.map(t => t.pic).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (st.pic && names.indexOf(st.pic) < 0) names.unshift(st.pic);
    $('#vfPic').innerHTML = '<option value="">Semua PIC</option>' + names.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
    $('#vfPic').value = st.pic;
  };
  const key = {
    id: t => t.id, area: t => (t.area + ' ' + t.lokasi).toLowerCase(), pic: t => (t.pic || '').toLowerCase(),
    kirim: t => waktu(t) || 0, verif: t => pend(t) ? Infinity : (t.tglVerifikasi || 0), status: t => (pend(t) ? 0 : 1) + t.status, tingkat: t => ({ Kritis: 0, Mayor: 1, Minor: 2 }[t.tingkat] ?? 3)
  };
  const draw = () => {
    const q = st.q.toLowerCase();
    let list = rows.filter(t => okStatus(t) && (!st.area || t.areaId === st.area) && (!st.pic || t.pic === st.pic) &&
      (!q || [t.id, t.area, t.lokasi, t.pic, t.verifikator, t.deskripsi, t.catatanPerbaikan, t.catatanKeberatan, t.catatanVerifikasi].join(' ').toLowerCase().indexOf(q) >= 0));
    list.sort((a, b) => { const x = key[st.sort](a), y = key[st.sort](b); return (x > y ? 1 : x < y ? -1 : 0) * st.dir || a.id.localeCompare(b.id); });
    const n = list.length, pages = Math.max(1, Math.ceil(n / st.per));
    st.page = Math.min(st.page, pages);
    const view = list.slice((st.page - 1) * st.per, st.page * st.per);
    const lewat = rows.filter(t => t.status === 'Menunggu Verifikasi' && Date.now() - t.tglPerbaikan > sla).length;
    const th = (k, l, cls) => '<th class="sort' + (cls ? ' ' + cls : '') + (st.sort === k ? (st.dir > 0 ? ' asc' : ' desc') : '') + '" data-k="' + k + '">' + l + '</th>';
    VB.innerHTML =
      '<div class="small muted" style="margin-bottom:8px">' + rows.filter(t => t.status === 'Menunggu Verifikasi').length + ' menunggu verifikasi · ' + rows.filter(t => t.status === 'Keberatan').length + ' keberatan · ' + rows.filter(t => !pend(t)).length + ' sudah diverifikasi' +
      (lewat ? ' · <b style="color:var(--err-t)">' + lewat + ' lewat SLA ' + S.boot.config.slaVerif + ' jam</b>' : '') + '</div>' +
      (n ? '<div class="tbl-wrap"><table class="tbl dt" style="min-width:980px"><thead><tr>' + th('id', 'ID') + '<th>Foto</th>' + th('area', 'Area &amp; temuan') + th('tingkat', 'Kategori') + th('pic', 'Diproses oleh') + th('kirim', 'Dikirim') + th('verif', 'Diverifikasi') + th('status', 'Status') + '<th></th></tr></thead><tbody>' +
        view.map(t => {
          const p = pend(t), own = p && (t.picNik || '').toLowerCase() === me, w = waktu(t), tunggu = Date.now() - (w || Date.now());
          const telat = t.status === 'Menunggu Verifikasi' && tunggu > sla;
          return '<tr class="' + (own ? 'own' : '') + '"><td class="cell-main">' + esc(t.id) + '</td>' +
            '<td><div class="ph2">' + imgTag(t.fotoBefore, '', 120) + imgTag(t.fotoAfter, '', 120) + '</div></td>' +
            '<td><div class="cell-main">' + esc(t.area) + (t.lokasi ? ' · ' + esc(t.lokasi) : '') + '</div><div class="cell-sub" title="' + esc(t.deskripsi) + '">' + esc(t.deskripsi) + '</div>' +
              '<div class="cell-sub" title="' + esc(t.status === 'Keberatan' ? t.catatanKeberatan : t.catatanPerbaikan) + '">' + (t.status === 'Keberatan' ? 'Keberatan: ' + esc(t.catatanKeberatan) : t.catatanPerbaikan ? 'Perbaikan: ' + esc(t.catatanPerbaikan) : '') + '</div></td>' +
            '<td>' + rChip(t.r) + ' ' + tingkatChip(t.tingkat) + (t.revisi ? '<div class="cell-sub">revisi ke-' + (t.revisi + 1) + '</div>' : '') + '</td>' +
            '<td>' + esc(t.pic || '-') + (own ? '<div><span class="chip c-warn">Perbaikan Anda</span></div>' : '') + '</td>' +
            '<td style="white-space:nowrap">' + (w ? fDate(w) : '-') + (p ? '<div class="cell-sub" style="' + (telat ? 'color:var(--err-t);font-weight:700' : '') + '">menunggu ' + durasi(tunggu) + (telat ? ' · lewat SLA' : '') + '</div>' : '') + '</td>' +
            '<td style="white-space:nowrap">' + (p ? '<span class="muted">Belum</span>' : fDate(t.tglVerifikasi) + '<div class="cell-sub">' + esc(t.verifikator || '-') + '</div>' +
              (t.catatanVerifikasi ? '<div class="cell-sub" title="' + esc(t.catatanVerifikasi) + '">' + esc(t.catatanVerifikasi) + '</div>' : '')) + '</td>' +
            '<td>' + statusChip(t) + (t.terlambat ? '<div class="cell-sub" style="color:var(--err-t)">dikirim lewat target</div>' : '') + '</td>' +
            '<td>' + (!p || (t.status === 'Menunggu Verifikasi' && !canApprove(t) && !own) || (t.status === 'Keberatan' && !canEdit('verif')) ? '<button class="btn sm" data-open="' + esc(t.id) + '"' + (p && !own ? ' title="Approval oleh ' + esc(approverText(t).replace(/&[^;]+;/g, '')) + '"' : '') + '>Lihat</button>' : own && !S.user.super ? '<button class="btn sm" data-open="' + esc(t.id) + '" title="Anda yang memproses — harus diverifikasi auditor lain">Lihat</button>'
              : '<button class="btn sm primary" data-open="' + esc(t.id) + '">' + (t.status === 'Keberatan' ? 'Putuskan' : 'Periksa') + '</button>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="dt-foot"><span>Menampilkan ' + ((st.page - 1) * st.per + 1) + '–' + Math.min(n, st.page * st.per) + ' dari ' + n + '</span>' +
        '<span class="pg"><select class="inp" id="vfPer" style="width:auto;min-height:32px">' + [10, 20, 50, 100].map(x => '<option' + (x === st.per ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>' +
        '<button class="btn sm" id="vfPrev"' + (st.page <= 1 ? ' disabled' : '') + '>‹</button><span style="align-self:center">' + st.page + ' / ' + pages + '</span><button class="btn sm" id="vfNext"' + (st.page >= pages ? ' disabled' : '') + '>›</button></span></div>' +
        (rows.some(t => pend(t) && (t.picNik || '').toLowerCase() === me) ? '<p class="small muted" style="margin:8px 0 0">Baris bertanda <b>Perbaikan Anda</b> dikerjakan oleh akun Anda sendiri' + (S.user.super ? '. Sebagai super admin Anda tetap bisa memverifikasinya (tercatat di riwayat).' : ', jadi harus diverifikasi auditor lain.') + '</p>' : '')
      : emptyBox(rows.length ? 'Tidak ada data untuk filter ini.' : 'Belum ada perbaikan atau keberatan.'));
    $$('th.sort', VB).forEach(h => h.onclick = () => { const k = h.dataset.k; if (st.sort === k) st.dir = -st.dir; else { st.sort = k; st.dir = k === 'kirim' ? 1 : 1; } draw(); });
    $$('[data-open]', VB).forEach(b => b.onclick = () => openDetail(b.dataset.open));
    if ($('#vfPer')) $('#vfPer').onchange = e => { st.per = +e.target.value; st.page = 1; draw(); };
    if ($('#vfPrev')) $('#vfPrev').onclick = () => { st.page--; draw(); };
    if ($('#vfNext')) $('#vfNext').onclick = () => { st.page++; draw(); };
  };
  const load = async () => {
    loading(VB);
    try { rows = await call('apiListTemuan', S.token, { scope: 'verifikasiSemua' }); fillPic(); draw(); }
    catch (e) { VB.innerHTML = emptyBox(e.message); }
  };
  let to;
  $('#vfQ').addEventListener('input', e => { clearTimeout(to); to = setTimeout(() => { st.q = e.target.value; st.page = 1; draw(); }, 200); });
  $('#vfSt').onchange = e => { st.status = e.target.value; st.page = 1; draw(); };
  $('#vfArea').onchange = e => { st.area = e.target.value; st.page = 1; draw(); };
  $('#vfPic').onchange = e => { st.pic = e.target.value; st.page = 1; draw(); };
  $('#vfRe').onclick = load;

/* Riwayat temuan berurutan waktu: dilaporkan, ditugaskan/diterima/dialihkan, perbaikan, verifikasi */
function timeline(t) {
  const ev = [{ ts: t.tanggal, h: '<b>Dilaporkan</b> oleh ' + esc(t.pelapor) + (t.timPelapor ? ' (Tim ' + esc(t.timPelapor) + ')' : '') }];
  (t.riwayat || []).forEach(e => ev.push({ ts: e.ts, h: '<b>' + esc(e.ev) + '</b>' + (e.oleh && e.oleh !== 'Sistem' ? ' oleh ' + esc(e.oleh) : e.oleh === 'Sistem' ? ' <span class="chip nodot c-pri">otomatis</span>' : '') + (e.ket ? '<div class="small">' + esc(e.ket) + '</div>' : '') }));
  if (t.tglPerbaikan) ev.push({ ts: t.tglPerbaikan, h: '<b>Perbaikan dikirim</b>' + (t.catatanPerbaikan ? ': ' + esc(t.catatanPerbaikan) : '') });
  if (t.tglVerifikasi) ev.push({ ts: t.tglVerifikasi, h: '<b>' + (t.status === 'Closed' ? 'Disetujui' : t.status === 'Batal' ? 'Dibatalkan' : t.status === 'Revisi' ? 'Ditolak' : 'Diputuskan') + '</b> oleh ' + esc(t.verifikator) + (t.catatanVerifikasi ? ': ' + esc(t.catatanVerifikasi) : '') + (t.revisi ? ' · revisi ke-' + t.revisi : '') });
  ev.sort((a, b) => a.ts - b.ts);
  return ev.map(e => '<div>' + e.h + '<br><span class="small muted">' + fDate(e.ts) + '</span></div>').join('');
}
function renderDetail(t) {
  const me = S.user.nik.toLowerCase();
  const isPic = t.picNik.toLowerCase() === me;
  const role = S.user.role;
  const ph = (fid, cap) => '<div class="ph"><span class="cap">' + cap + '</span>' + (fid ? '<img src="' + thumbUrl(fid, 800) + '" data-fid="' + esc(fid) + '" onerror="fotoFallback(this)" onclick="window.open(\'' + viewUrl(fid) + '\',\'_blank\')" alt="' + cap + '">' : '<span class="small muted">Belum ada</span>') + '</div>';
  let h = '<div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' + statusChip(t) + rChip(t.r) + tingkatChip(t.tingkat) + (t.berulang ? '<span class="chip nodot c-err">Berulang</span>' : '') + (t.mandiri ? '<span class="chip nodot c-ok">Lapor mandiri</span>' : '') + '</div>' +
    '<div class="photos">' + ph(t.fotoBefore, 'Sebelum') + ph(t.fotoAfter, 'Sesudah') + '</div>' +
    '<dl class="kv"><dt>ID</dt><dd><b>' + esc(t.id) + '</b></dd>' +
    '<dt>Area</dt><dd>' + esc(t.area) + (t.lokasi ? ' · ' + esc(t.lokasi) : '') + '</dd>' +
    '<dt>Tim</dt><dd><b>' + esc(t.tim) + '</b></dd>' +
    '<dt>Temuan</dt><dd>' + esc(t.deskripsi) + '</dd>' +
    '<dt>PIC</dt><dd>' + (t.picNik ? esc(t.pic) + ((t.status === 'Open' || t.status === 'Revisi') && t.tglTerima ? ' <span class="chip c-info">Sedang diproses sejak ' + fDate(t.tglTerima) + '</span>' : '') : '<span class="chip c-warn">Belum diambil</span> <span class="small muted">siapa pun bisa memproses</span>') + '</dd>' +
    (belumDiambil(t) && t.status === 'Open'
      ? '<dt>Batas standar</dt><dd>' + fDate(t.deadlineStandar) + ' <span class="small muted">(target ditentukan PIC saat mengambil)</span></dd>' :
     menungguTerima(t)
      ? '<dt>Respon PIC</dt><dd>' + (t.responTelat ? '<b style="color:var(--err-t)">Lewat batas respon</b> ' : 'Sebelum ') + fDate(t.batasRespon) + '</dd>' +
        '<dt>Batas standar</dt><dd>' + fDate(t.deadlineStandar) + ' <span class="small muted">(target ditentukan PIC saat menerima)</span></dd>'
      : '<dt>Target selesai</dt><dd>' + fDate(t.deadline) + ' <span class="small muted">(' + esc(sisa(t)) + ')</span>' +
        (t.deadlineStandar && t.deadline > t.deadlineStandar + 60000 ? '<div class="small muted">Melewati batas standar ' + fDate(t.deadlineStandar) + (t.targetAlasan ? ' · alasan: ' + esc(t.targetAlasan) : '') + '</div>' : '') + '</dd>') +
    '<dt>Potongan tim</dt><dd>' + signed(t.poinArea) + '</dd>' +
    (t.poinPic != null ? '<dt>Poin perbaikan</dt><dd><b>' + signed(t.poinPic) + '</b> untuk Tim ' + esc(t.tim) + '</dd>' : '') + '</dl>' +
    '<div class="timeline">' + timeline(t) + '</div>';

  // Ambil (temuan tersedia) atau terima (tugas otomatis) & tentukan target
  const bisaAmbil = belumDiambil(t) && canEdit('tugas') && (S.user.pic || role === 'Admin');
  const bisaTerima = bisaAmbil || ((isPic || role === 'Admin') && menungguTerima(t) && canEdit('tugas'));
  if (bisaAmbil && t.status === 'Revisi') {
    h += '<div class="card" style="margin-top:12px;background:var(--surface-2)"><h3>Ambil &amp; lanjutkan revisi</h3>' +
      '<div class="note warn" style="margin-bottom:10px">Ditolak: ' + esc(t.catatanVerifikasi) + '<div class="small" style="margin-top:4px">Target tetap ' + fDate(t.deadline) + '</div></div>' +
      '<button class="btn primary block" id="tAmbilRev">' + ic('check') + 'Ambil tugas ini</button></div>';
  } else if (bisaTerima) {
    const c = S.boot.config, now = Date.now(), std = t.deadlineStandar || t.deadline;
    const maks = Math.max(t.tingkat === 'Kritis' ? std : Math.max(std, t.tanggal + c.targetMaks * 36e5), now + 2 * 36e5);
    const besok = fromWib(toWib(now + 864e5).slice(0, 10) + 'T12:00');
    const quick = [['+2 jam', now + 2 * 36e5], ['+4 jam', now + 4 * 36e5], ['+8 jam', now + 8 * 36e5], ['Besok 12:00', besok], ['Batas standar', std]]
      .filter(q => q[1] >= now + 30 * 6e4 && q[1] <= maks);
    h += '<div class="card" style="margin-top:12px;background:var(--surface-2)"><h3>' + (bisaAmbil ? 'Ambil &amp; proses temuan ini' : 'Terima tugas &amp; tentukan target') + '</h3>' +
      '<div class="note' + (t.responTelat && !bisaAmbil ? ' warn' : '') + '" style="margin-bottom:10px">' + (bisaAmbil ? 'Setelah diambil, temuan ini terkunci untuk Anda dan tampil <b>Sedang diproses oleh ' + esc(S.user.nama) + '</b>. Tentukan kapan bisa selesai.' : t.responTelat ? 'Batas respon sudah lewat. Segera terima agar tidak dialihkan ke PIC lain.' : 'Terima sebelum <b>' + fDate(t.batasRespon) + '</b>, atau tugas otomatis dialihkan ke PIC lain yang bertugas.') +
      '<div class="small" style="margin-top:4px">Batas standar ' + esc(t.tingkat) + ': ' + fDate(std) + ' · paling lambat ' + fDate(maks) + (t.tingkat === 'Kritis' ? ' (Kritis tidak boleh melewati standar)' : '') + '</div></div>' +
      '<div class="seg" id="tQuick" style="margin-bottom:10px">' + quick.map(q => '<button type="button" data-ms="' + q[1] + '">' + q[0] + '</button>').join('') + '</div>' +
      '<div class="field"><label for="tTarget">Target selesai (WIB)</label><input class="inp" type="datetime-local" id="tTarget" value="' + toWib(Math.max(now + 36e5, Math.min(std, maks))) + '" min="' + toWib(now + 30 * 6e4) + '" max="' + toWib(maks) + '"></div>' +
      '<div class="field" id="tAlasanBox" hidden><label for="tAlasan">Alasan melewati batas standar</label><textarea class="inp" id="tAlasan" placeholder="mis. sedang stock opname, menunggu material"></textarea></div>' +
      '<button class="btn primary block" id="tGo">' + ic('check') + (bisaAmbil ? 'Ambil tugas' : 'Terima tugas') + '</button></div>';
  }
  // Sedang diproses PIC lain
  if (t.picNik && !isPic && (t.status === 'Open' || t.status === 'Revisi') && t.tglTerima) {
    h += '<div class="note" style="margin-top:12px">Sedang diproses oleh <b>' + esc(t.pic) + '</b> sejak ' + fDate(t.tglTerima) + ' · target ' + fDate(t.deadline) + '</div>';
  }
  // Aksi PIC (bisa langsung kirim perbaikan tanpa menerima dulu, mis. perbaikan kecil yang selesai saat itu juga)
  if (((isPic || role === 'Admin') && t.picNik || bisaAmbil) && (t.status === 'Open' || t.status === 'Revisi') && canEdit('tugas')) {
    h += '<div class="card" style="margin-top:12px;background:var(--surface-2)"><h3>' + (bisaAmbil ? 'Atau langsung kirim perbaikan' : menungguTerima(t) ? 'Atau langsung kirim perbaikan' : 'Kirim perbaikan') + '</h3>' +
      (bisaAmbil ? '<p class="small muted" style="margin-top:0">Sudah dibereskan? Kirim foto sesudahnya — temuan otomatis tercatat diproses oleh Anda.</p>' : '') +
      (t.status === 'Revisi' ? '<div class="note warn" style="margin-bottom:10px">Ditolak: ' + esc(t.catatanVerifikasi) + '</div>' : '') +
      '<div class="field">' + photoPicker('pFoto', 'Ambil foto sesudah perbaikan') + '</div>' +
      '<div class="field"><label for="pCat">Catatan perbaikan</label><textarea class="inp" id="pCat" placeholder="Apa yang sudah dilakukan"></textarea></div>' +
      '<button class="btn primary block" id="pSend">Kirim untuk verifikasi</button>' +
      (isPic ? '<button class="btn ghost block" id="kAju" style="margin-top:8px">Temuan tidak valid? Ajukan keberatan</button>' : '') + '</div>';
  }
  // Keberatan PIC

  if (t.status === 'Menunggu Verifikasi' && !canApprove(t) && (canEdit('verif') || (t.pelaporNik || '').toLowerCase() === me || isPic)) {

  }
  if (canApprove(t)) {
    h += '<div class="card" style="margin-top:12px;background:var(--surface-2)"><h3>Approval perbaikan</h3>' +
      (false ? '' :
        (isPic ? '<div class="note" style="margin-bottom:10px">Anda yang mengerjakan perbaikan ini. Sebagai super admin Anda tetap bisa memverifikasi; tindakan ini tercatat di riwayat.</div>' : '') +
        '<div class="field"><label for="vCat">Catatan (wajib bila ditolak)</label><textarea class="inp" id="vCat"></textarea></div>' +
        '<div class="grid g2"><button class="btn danger" id="vNo">Tolak, perbaiki lagi</button><button class="btn ok" id="vYes">Setujui &amp; tutup</button></div>') + '</div>';
  }
  const bisaAlih = !!t.picNik && (t.status === 'Open' || t.status === 'Revisi') && ((isPic && canEdit('tugas')) || canEdit('verif') || canEdit('admin'));
  const bisaLepas = bisaAlih && modeBebas();
  h += '<div class="grid g2" style="margin-top:12px"><button class="btn" id="dWa">' + ic('wa') + 'Bagikan ke WA</button>' +
    (bisaLepas ? '<button class="btn" id="dLepas">Batalkan proses</button>' : '') +
    (bisaAlih ? '<button class="btn" id="dAlih">Alihkan ke PIC lain</button>' : '') +
    (canEdit('admin') && t.status !== 'Batal' ? '<button class="btn danger" id="dCancel">Batalkan temuan</button>' : '') + '</div>';

  $('#dWa').onclick = () => shareWA(waTemuan(t));
  if ($('#tGo')) {

    $('#tGo').onclick = async () => {
      const target = fromWib($('#tTarget').value);
      if (!target) return toast('Isi target selesai.', true);
      const alasan = $('#tAlasan').value.trim();
      if (target > std + 6e4 && !alasan) return toast('Tulis alasan karena target melewati batas standar.', true);
      const b = $('#tGo'); b.disabled = true;
      try { const r = await call('apiTerimaTugas', S.token, t.id, target, alasan); toast((bisaAmbil ? 'Tugas diambil' : 'Tugas diterima') + ' · target ' + fDate(r.deadline)); renderDetail(r); afterChange(); }
      catch (e) { toast(e.message, true); b.disabled = false; if (/diambil oleh|Sedang diproses/.test(e.message)) openDetail(t.id); }
    };

  if ($('#tAmbilRev')) $('#tAmbilRev').onclick = async () => {
    const b = $('#tAmbilRev'); b.disabled = true;
    try { const r = await call('apiTerimaTugas', S.token, t.id, 0, ''); toast('Tugas diambil'); renderDetail(r); afterChange(); }
    catch (e) { toast(e.message, true); b.disabled = false; if (/diambil oleh/.test(e.message)) openDetail(t.id); }
  };
  if ($('#dLepas')) $('#dLepas').onclick = () => {
    openModal('Batalkan proses ' + t.id,
      '<div class="note" style="margin-bottom:12px">Temuan dilepas dari <b>' + esc(t.pic) + '</b> dan kembali ke <b>Tugas tersedia</b> agar bisa diambil PIC lain. Keterangan tercatat di riwayat.</div>' +
      '<div class="field"><label for="lAlasan">Keterangan kenapa batal *</label><textarea class="inp" id="lAlasan" placeholder="mis. dipanggil ke area lain, butuh alat yang belum ada"></textarea></div>' +
      '<div class="grid g2"><button class="btn" id="lBack">Kembali</button><button class="btn danger" id="lGo">Batalkan proses</button></div>');
    $('#lBack').onclick = () => renderDetailInModal(t);
    $('#lGo').onclick = async () => {
      const alasan = $('#lAlasan').value.trim();
      if (!alasan) { $('#lAlasan').focus(); return toast('Keterangan kenapa batal wajib diisi.', true); }
      $('#lGo').disabled = true;
      try { const r = await call('apiLepasTugas', S.token, t.id, alasan); toast('Proses dibatalkan, temuan kembali tersedia'); renderDetailInModal(r); afterChange(); }
      catch (e) { toast(e.message, true); $('#lGo').disabled = false; }
    };
  };
  if ($('#dAlih')) $('#dAlih').onclick = () => {

    const lain = S.boot.users.filter(u => u.nik.toLowerCase() !== t.picNik.toLowerCase());
    const g1 = lain.filter(u => ap.indexOf(u.nik.toLowerCase()) >= 0), g2 = lain.filter(u => ap.indexOf(u.nik.toLowerCase()) < 0);

      '<div class="note" style="margin-bottom:12px">PIC sekarang: <b>' + esc(t.pic) + '</b>. ' + (t.status === 'Open' ? 'PIC baru harus menerima tugas & menentukan target sendiri.' : 'PIC baru melanjutkan revisi dengan target yang sama.') + '</div>' +
      '<div class="field"><label for="aTo">PIC tujuan</label><select class="inp" id="aTo"><option value="">— Pilih PIC —</option>' +
      (g1.length ? '<optgroup label="PIC area ' + esc(t.area) + '">' + g1.map(o).join('') + '</optgroup>' : '') + (g2.length ? '<optgroup label="PIC lain">' + g2.map(o).join('') + '</optgroup>' : '') + '</select></div>' +
      '<div class="field"><label for="aWhy">Alasan</label><textarea class="inp" id="aWhy" placeholder="mis. shift saya selesai, bukan area saya"></textarea></div>' +
      '<div class="grid g2"><button class="btn" id="aBack">Kembali</button><button class="btn primary" id="aGo">Alihkan</button></div>');
    $('#aBack').onclick = () => renderDetailInModal(t);
    $('#aGo').onclick = async () => {
      const to = $('#aTo').value, why = $('#aWhy').value.trim();
      if (!to) return toast('Pilih PIC tujuan.', true);
      if (!why) return toast('Tulis alasan pengalihan.', true);
      $('#aGo').disabled = true;
      try { const r = await call('apiAlihkan', S.token, t.id, to, why); toast('Dialihkan ke ' + r.pic); renderDetailInModal(r); afterChange(); }
      catch (e) { toast(e.message, true); $('#aGo').disabled = false; }
    };
  };
  if ($('#pSend')) {
    let foto = '';
    bindPhoto('pFoto', () => stampText(t.area) + ' · ' + t.id, d => { foto = d; });
    $('#pSend').onclick = async () => {
      if (!foto) return toast('Foto sesudah perbaikan wajib diambil.', true);
      const b = $('#pSend'); b.disabled = true; b.textContent = 'Mengirim…';
      try { const r = await call('apiSubmitPerbaikan', S.token, t.id, $('#pCat').value.trim(), foto); toast('Perbaikan terkirim, menunggu verifikasi'); renderDetail(r); afterChange(); }
      catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Kirim untuk verifikasi'; if (/diambil oleh|Sedang diproses/.test(e.message)) openDetail(t.id); }
    };
  }
  if ($('#kAju')) $('#kAju').onclick = () => {
    openModal('Keberatan ' + t.id,
      '<div class="note" style="margin-bottom:12px">Ajukan bila temuan ini salah (bukan area/tanggung jawab Anda, kondisi sudah sesuai standar, atau ganda). Auditor akan memutuskan; selama ditinjau batas waktu dihentikan.</div>' +
      '<div class="field"><label for="kAlasan">Alasan keberatan</label><textarea class="inp" id="kAlasan"></textarea></div>' +
      '<div class="grid g2"><button class="btn" id="kBack">Kembali</button><button class="btn primary" id="kGo">Kirim keberatan</button></div>');
    $('#kBack').onclick = () => renderDetailInModal(t);
    $('#kGo').onclick = async () => {
      const alasan = $('#kAlasan').value.trim();
      if (!alasan) return toast('Tulis alasan keberatan.', true);
      $('#kGo').disabled = true;
      try { const r = await call('apiKeberatan', S.token, t.id, alasan); toast('Keberatan terkirim ke auditor'); renderDetailInModal(r); afterChange(); }
      catch (e) { toast(e.message, true); $('#kGo').disabled = false; }
    };
  };
  const putus = async (terima) => {
    const cat = $('#kCat').value.trim();
    if (!terima && !cat) return toast('Tulis alasan keberatan ditolak.', true);
    $$('#kYes,#kNo').forEach(b => b.disabled = true);
    try { const r = await call('apiPutusKeberatan', S.token, t.id, terima, cat); toast(terima ? 'Keberatan diterima, temuan dibatalkan' : 'Keberatan ditolak, kembali ke PIC'); renderDetail(r); afterChange(); }
    catch (e) { toast(e.message, true); $$('#kYes,#kNo').forEach(b => b.disabled = false); }
  };
  if ($('#kYes')) { $('#kYes').onclick = () => putus(true); $('#kNo').onclick = () => putus(false); }
  const verif = async (ok) => {
    const cat = $('#vCat').value.trim();
    if (!ok && !cat) return toast('Tulis alasan penolakan.', true);
    $$('#vYes,#vNo').forEach(b => b.disabled = true);
    try { const r = await call('apiVerifikasi', S.token, t.id, ok, cat); toast(ok ? 'Disetujui. Tim ' + r.tim + ' ' + signed(r.poinPic) + ' poin' : 'Dikembalikan ke PIC'); renderDetail(r); afterChange(); }
    catch (e) { toast(e.message, true); $$('#vYes,#vNo').forEach(b => b.disabled = false); }
  };
  if ($('#vYes')) { $('#vYes').onclick = () => verif(true); $('#vNo').onclick = () => verif(false); }
  if ($('#dCancel')) $('#dCancel').onclick = () => {
    openModal('Batalkan ' + t.id,
      '<div class="note warn" style="margin-bottom:12px">Pakai bila temuan salah input atau ganda. Semua poin dari temuan ini akan dikembalikan.</div>' +
      '<div class="field"><label for="bAlasan">Alasan pembatalan</label><textarea class="inp" id="bAlasan"></textarea></div>' +
      '<div class="grid g2"><button class="btn" id="bBack">Kembali</button><button class="btn danger" id="bGo">Batalkan temuan</button></div>');
    $('#bBack').onclick = () => renderDetailInModal(t);
    $('#bGo').onclick = async () => {
      const alasan = $('#bAlasan').value.trim();
      if (!alasan) return toast('Alasan wajib diisi.', true);
      $('#bGo').disabled = true;
      try { const r = await call('apiBatalkanTemuan', S.token, t.id, alasan); toast('Temuan dibatalkan, poin dikembalikan'); renderDetailInModal(r); afterChange(); }
      catch (e) { toast(e.message, true); $('#bGo').disabled = false; }
    };
  };
}
/* Riwayat poin satu PIC: bertambah / berkurang per kejadian, saldo berjalan */

  } catch (e) { $('#sheet').innerHTML = emptyBox(e.message); }
}

/* =====================================================================
 *  VIEW: AUDIT 6S
 * ===================================================================== */
VIEWS.audit = function () {
  const B = S.boot;
  const v = $('#view');
  v.innerHTML = '<div class="grid g2"><div class="card"><h3>Audit checklist 6S</h3>' +
    '<div class="field"><label for="aArea">Area yang diaudit</label><select class="inp" id="aArea"><option value="">— Pilih area —</option>' +
    B.areas.map(a => '<option value="' + esc(a.id) + '">' + esc(a.nama) + '</option>').join('') + '</select>' +
    '<span class="hint">Skor 1 = sangat buruk, 3 = cukup, 5 = sesuai standar.</span></div><div id="aItems"></div></div>' +
    '<div class="card"><h3>Riwayat audit<span class="sub">' + fBulan(S.bulan) + '</span></h3><div id="aHist"></div></div></div>';
  let items = [];
  const AH = $('#aHist');
  const hist = async () => {
    loading(AH);
    try {
      const rows = await call('apiListAudit', S.token, S.bulan);
      AH.innerHTML = rows.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Tanggal</th><th>Area</th>' + B.rList.map(r => '<th class="num">' + r + '</th>').join('') + '<th class="num">Total</th><th>Auditor</th></tr>' +
        rows.map(a => '<tr><td>' + fDate(a.tanggal, false) + '</td><td>' + esc(a.area) + '</td>' + B.rList.map(r => '<td class="num">' + (a[r] == null ? '-' : num(a[r], 0) + '%') + '</td>').join('') + '<td class="num"><b>' + num(a.total) + '%</b></td><td>' + esc(a.auditor) + '</td></tr>').join('') + '</table></div>' : emptyBox('Belum ada audit bulan ini');
    } catch (e) { AH.innerHTML = emptyBox(e.message); }
  };
  const summary = () => {
    const per = {}; let tot = 0, n = 0;
    items.forEach(i => { if (!i.skor) return; per[i.r] = per[i.r] || { s: 0, n: 0 }; per[i.r].s += i.skor; per[i.r].n++; tot += i.skor; n++; });
    $('#aSum').innerHTML = n === items.length ? 'Total skor <b>' + num(tot / (n * 5) * 100) + '%</b> · ' + B.rList.filter(r => per[r]).map(r => r + ' ' + num(per[r].s / (per[r].n * 5) * 100, 0) + '%').join(' · ') : 'Terisi ' + n + ' dari ' + items.length + ' item.';
  };
  $('#aArea').addEventListener('change', async e => {
    const id = e.target.value; if (!id) { $('#aItems').innerHTML = ''; return; }
    loading($('#aItems'));
    try {
      items = (await call('apiChecklist', S.token, id)).map(i => Object.assign(i, { skor: 0, catatan: '' }));
      let h = '', last = '';
      items.forEach((it, idx) => {
        if (it.r !== last) { h += '<div style="margin-top:10px">' + rChip(it.r) + '</div>'; last = it.r; }
        h += '<div class="audit-item"><div class="q">' + esc(it.item) + '</div><div class="seg score" data-i="' + idx + '">' + [1, 2, 3, 4, 5].map(s => '<button type="button" data-s="' + s + '">' + s + '</button>').join('') + '</div></div>';
      });
      h += '<div class="note" id="aSum" style="margin:12px 0"></div><div class="field"><label for="aCat">Catatan audit</label><textarea class="inp" id="aCat"></textarea></div>' +
        '<div class="small muted" style="margin-bottom:10px">Ada kondisi yang perlu diperbaiki? Buat juga lewat <a href="#" onclick="go(\'input\');return false">Input Temuan</a> supaya ada PIC dan batas waktunya.</div>' +
        (canEdit('audit') ? '<button class="btn primary block" id="aSave">Simpan audit</button>' : '<div class="note warn">Akses Anda untuk Audit 6S hanya lihat saja.</div>');
      $('#aItems').innerHTML = items.length ? h : emptyBox('Checklist area ini kosong. Tambahkan di Master Data → Checklist audit.');
      $$('#aItems .seg').forEach(sg => sg.addEventListener('click', ev => {
        const b = ev.target.closest('button'); if (!b) return;
        $$('button', sg).forEach(x => x.classList.remove('on')); b.classList.add('on');
        items[+sg.dataset.i].skor = +b.dataset.s; summary();
      }));
      if (items.length) summary();
      if (items.length && $('#aSave')) { $('#aSave').onclick = async () => {
        if (items.some(i => !i.skor)) return toast('Beri skor untuk semua item.', true);
        const b = $('#aSave'); b.disabled = true; b.textContent = 'Menyimpan…';
        try { const r = await call('apiSaveAudit', S.token, { areaId: id, items: items, catatan: $('#aCat').value.trim() }); toast('Audit tersimpan · ' + num(r.total) + '%'); $('#aArea').value = ''; $('#aItems').innerHTML = ''; hist(); }
        catch (err) { toast(err.message, true); b.disabled = false; b.textContent = 'Simpan audit'; }
      }; }
    } catch (err) { $('#aItems').innerHTML = emptyBox(err.message); }
  });
  hist();
};
