/* Tab Papan Poin PIC: peringkat user & riwayat poin (tabel di desktop, kartu di mobile) */
async function poinPapan(v) {
  const c = S.boot.config;
  const st = S.pp || (S.pp = { sub: 'user', q: '' });
  v.innerHTML = '<div class="toolbar flt">' + monthInput('pBulan', S.bulan) +
    '<div class="seg" id="pSub"><button data-t="user"' + (st.sub === 'user' ? ' class="on"' : '') + '>Peringkat</button><button data-t="log"' + (st.sub === 'log' ? ' class="on"' : '') + '>Riwayat poin</button></div>' +
    '<span class="grow"></span><input class="inp" id="pQ" placeholder="Cari nama / username" value="' + esc(st.q) + '" style="max-width:240px"></div>' +
    '<div id="pBody"></div>' +
    '<details class="note small" style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">Cara hitung poin PIC</summary><div style="margin-top:6px">' +
    (c.poinLaporPic ? '<b>+' + num(c.poinLaporPic) + '</b> setiap menemukan temuan' + (modeBebas() || c.laporAreaSendiri ? '' : ' di area PIC lain') + (c.laporSemua ? ' (semua yang input)' : ' (Leader / PIC)') + ' · ' : '') +
    '<b>+' + c.poinTepat + '</b> perbaikan disetujui dalam batas standar (Kritis +' + c.poinTepatKritis + ', bonus cepat +' + c.bonusCepat + '; setengahnya bila lewat standar tapi sesuai target) · ' +
    '6S harian per shift: selesai menambah, terlewat memotong · ' +
    '<b>−' + c.potongTelat + '</b> per hari terlambat (temuan yang sedang lewat target ikut dipotong per hari berjalan) · <b>−' + c.potongRevisi + '</b> setiap revisi' +
    (modeBebas() ? '' : ' · temuan di area yang dipegang dipotong ' + S.boot.tingkat.map(x => x + ' −' + c.potong[x]).join(', ') + ' · tidak merespon tugas −1') +
    '. Temuan yang dibatalkan mengembalikan semua poinnya. Klik nama untuk melihat riwayat poin user tersebut.</div></details>';
  $('#pBulan').addEventListener('change', e => { if (e.target.value) { S.bulan = e.target.value; VIEWS.poin(); } });
  let data = null;
  const PB = $('#pBody');
  const warna = x => x > 0 ? 'var(--ok-t)' : x < 0 ? 'var(--err-t)' : 'inherit';
  const sg = x => x ? signed(x) : '0';
  const draw = () => {
    if (!data) return;
    const q = st.q.toLowerCase();
    const nm = (nik, nama) => '<button type="button" class="pic-name" title="Riwayat poin ' + esc(nama) + '" onclick="openPoinPic(' + esc(JSON.stringify(nik)) + ',' + esc(JSON.stringify(data.bulan)) + ')">' + esc(nama) + '</button>';
    const cocok = r => !q || (r.nama + ' ' + r.nik).toLowerCase().indexOf(q) >= 0;
    let h = '';
    if (st.sub === 'user') {
      const list = data.papan.filter(cocok);
      const mx = Math.max(1, ...data.papan.map(p => Math.abs(p.poin)));
      const nol = data.papan.filter(p => !p.poin && !p.ditemukan && !p.diproses && !p.selesai).length;
      const rk = (p, i) => '<span class="rank ' + (i < 3 && p.poin > 0 ? 'r' + (i + 1) : '') + '">' + (i + 1) + '</span>';
      h = list.length ?
        '<div class="tbl-wrap hr-desk"><table class="tbl pic-tbl" style="min-width:940px"><thead><tr><th>#</th><th>PIC</th><th class="num">Total poin</th>' +
          '<th class="num">Menemukan</th><th class="num">Perbaikan</th><th class="num">6S harian</th><th class="num">Potongan</th>' +
          '<th class="num">Temuan</th><th class="num">Diproses</th><th class="num">Selesai</th><th class="num">Lewat target</th></tr></thead><tbody>' +
          list.map(p => { const i = data.papan.indexOf(p); return '<tr><td>' + rk(p, i) + '</td><td>' + nm(p.nik, p.nama) + '<div class="pic-meta">' + esc(p.nik) + '</div></td>' +
            '<td class="num"><div class="pbar"><b style="color:' + warna(p.poin) + '">' + signed(p.poin) + '</b><i><span class="' + (p.poin < 0 ? 'neg' : '') + '" style="width:' + (Math.abs(p.poin) / mx * 100) + '%"></span></i></div></td>' +
            '<td class="num">' + sg(p.lapor) + '</td><td class="num">' + sg(p.perbaikan) + '</td><td class="num">' + sg(p.harian) + '</td>' +
            '<td class="num" style="color:' + (p.potongan ? 'var(--err-t)' : 'inherit') + '">' + (p.potongan ? num(p.potongan) : '0') + '</td>' +
            '<td class="num">' + p.ditemukan + '</td><td class="num">' + p.diproses + '</td><td class="num">' + p.selesai + (p.telat ? '<div class="cell-sub" style="max-width:none">' + p.telat + ' telat</div>' : '') + '</td>' +
            '<td class="num">' + (p.overdue ? '<span class="chip c-err">' + p.overdue + '</span>' : '0') + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        '<div class="hr-cards">' + list.map(p => { const i = data.papan.indexOf(p); return '<div class="hr-card">' +
            '<div class="hr-c-head"><div style="display:flex;gap:10px;align-items:center;min-width:0">' + rk(p, i) + '<div style="min-width:0">' + nm(p.nik, p.nama) + '<div class="hr-c-sub">' + esc(p.nik) + '</div></div></div>' +
              '<div style="text-align:right;flex:none"><div class="hr-c-sub">Total poin</div><div class="tnum" style="font-size:22px;font-weight:800;color:' + warna(p.poin) + '">' + signed(p.poin) + '</div></div></div>' +
            '<div class="hr-c-sec"><div class="rk-grid">' +
              '<div><small>Menemukan</small><b>' + sg(p.lapor) + '</b></div><div><small>Perbaikan</small><b>' + sg(p.perbaikan) + '</b></div><div><small>6S harian</small><b>' + sg(p.harian) + '</b></div>' +
              '<div><small>Potongan</small><b style="color:' + (p.potongan ? 'var(--err-t)' : 'inherit') + '">' + (p.potongan ? num(p.potongan) : '0') + '</b></div>' +
              '<div><small>Temuan</small><b>' + p.ditemukan + '</b></div><div><small>Diproses</small><b>' + p.diproses + '</b></div>' +
              '<div><small>Selesai</small><b>' + p.selesai + (p.telat ? ' <span class="small muted">(' + p.telat + ' telat)</span>' : '') + '</b></div>' +
              '<div><small>Lewat target</small><b style="color:' + (p.overdue ? 'var(--err-t)' : 'inherit') + '">' + p.overdue + '</b></div></div></div>' +
          '</div>'; }).join('') + '</div>' +
        (nol ? '<p class="small muted" style="margin:8px 0 0">' + nol + ' user belum melakukan 6S bulan ini (poin, temuan, dan perbaikan masih 0).</p>' : '')
        : emptyBox(data.papan.length ? 'Tidak ada user yang cocok.' : 'Belum ada Leader / PIC IEG.');
    } else {
      const list = data.riwayatPic.filter(cocok);
      const tm = r => r.temuanId ? '<a href="#" onclick="openDetail(' + esc(JSON.stringify(r.temuanId)) + ');return false">' + esc(r.temuanId) + '</a>' : '';
      h = list.length ?
        '<div class="tbl-wrap hr-desk"><table class="tbl" style="min-width:820px"><thead><tr><th>Waktu</th><th>PIC</th><th class="num">Poin</th><th>Kejadian</th><th>Temuan</th></tr></thead><tbody>' +
          list.map(r => '<tr><td class="small" style="white-space:nowrap">' + fDate(r.ts) + '</td><td>' + nm(r.nik, r.nama) + '<div class="pic-meta">' + esc(r.nik) + '</div></td>' +
            '<td class="num"><span class="chip nodot ' + (r.poin < 0 ? 'c-err' : 'c-ok') + '">' + signed(r.poin) + '</span></td><td>' + esc(r.ket) + '</td><td>' + (tm(r) || '-') + '</td></tr>').join('') + '</tbody></table></div>' +
        '<div class="hr-cards">' + list.map(r => '<div class="hr-card" style="gap:8px">' +
            '<div class="hr-c-head"><div style="min-width:0">' + nm(r.nik, r.nama) + '<div class="hr-c-sub">' + fDate(r.ts) + '</div></div><span class="chip nodot ' + (r.poin < 0 ? 'c-err' : 'c-ok') + '">' + signed(r.poin) + '</span></div>' +
            '<div class="hr-c-pic">' + esc(r.ket) + (tm(r) ? '<div class="hr-c-sub" style="margin-top:2px">Temuan ' + tm(r) + '</div>' : '') + '</div></div>').join('') + '</div>'
        : emptyBox('Belum ada riwayat poin bulan ini');
    }
    PB.innerHTML = h;
  };
  $$('#pSub button').forEach(b => b.onclick = () => { $$('#pSub button').forEach(x => x.classList.toggle('on', x === b)); st.sub = b.dataset.t; draw(); });
  let tq; $('#pQ').addEventListener('input', e => { clearTimeout(tq); tq = setTimeout(() => { st.q = e.target.value; draw(); }, 200); });
  loading(PB);
  try { data = await call('apiLeaderboard', S.token, S.bulan); draw(); } catch (e) { PB.innerHTML = emptyBox(e.message); }
}

        '<p class="small muted"><b>PIC perbaikan hanya Leader / PIC IEG</b> (role Leader / PIC di HRIS, atau role 6S PIC); user yang tertaut ke operator RKA tidak bisa menjadi PIC. KPI dihitung per PIC. Semua pengguna dengan role PIC, Auditor, atau Admin bisa membuat temuan di area tim mana pun. Tim pengguna menentukan apakah laporannya dihitung lapor mandiri atau temuan dari tim lain.</p>' +
        '<p class="small muted">Akun &amp; password memakai akun HRIS. Role 6S bawaan mengikuti role HRIS: Admin → Admin, Supervisor → Auditor, Leader → PIC, Viewer → Viewer.</p>';
    } else if (tab === 'area') {
      const timList = Array.from(new Set(D.areas.map(a => a.tim))).sort();
      h = '<datalist id="dlTim">' + timList.map(t => '<option value="' + esc(t) + '">').join('') + '</datalist>' +
        '<div class="tbl-wrap"><table class="tbl" style="min-width:960px"><tr><th>Kode</th><th>Nama area</th><th>Tim</th><th>PIC per shift</th><th>PIC cadangan</th><th>Aktif</th><th></th></tr>' +
        D.areas.map((a, i) => '<tr><td>' + esc(a.id) + '</td><td><input class="inp" data-an="' + i + '" value="' + esc(a.nama) + '"></td><td><input class="inp" list="dlTim" data-at="' + i + '" value="' + esc(a.tim) + '"></td><td>' + ((a.pics || []).length ? (a.pics || []).map(n => { const u = D.users.find(x => x.nik.toLowerCase() === n); return u ? '<div class="small">' + esc(u.nama) + ' ' + (u.jadwal ? jadChip(u.jadwal.status) : '') + '</div>' : ''; }).join('') : '<span class="small" style="color:var(--warn-t)">Belum ada</span>') +
          ((a.tanpaAkun || []).length ? '<div class="small" style="color:var(--warn-t)" title="Buat akun HRIS (role Leader) dan tautkan ke karyawan ini">Belum punya akun: ' + esc(a.tanpaAkun.join(', ')) + '</div>' : '') + '</td><td><select class="inp" data-ap="' + i + '"><option value="">— tidak ada —</option>' +
          D.users.filter(u => u.pic).map(u => '<option value="' + esc(u.nik) + '"' + (u.nik === a.picNik ? ' selected' : '') + '>' + esc(u.nama) + '</option>').join('') + '</select></td><td><input type="checkbox" data-aa="' + i + '"' + (a.aktif ? ' checked' : '') + ' style="width:20px;height:20px;accent-color:var(--primary)"></td><td><button class="btn sm" data-as="' + i + '">Simpan</button></td></tr>').join('') + '</table></div>' +
        '<div class="toolbar" style="margin-top:12px"><input class="inp" id="naId" placeholder="Kode (A10)" style="max-width:120px"><input class="inp grow" id="naNama" placeholder="Nama area baru"><button class="btn" id="naAdd">' + ic('plus') + 'Tambah area</button></div>' +
        '<p class="small muted"><b>PIC per shift</b> diatur di <b>HRIS → Operator</b> (isian Area gudang 6S) atau tab Pengguna (Area tanggung jawab) — keduanya data yang sama. <b>PIC cadangan</b> menerima tugas bila semua PIC area libur / tidak masuk.</p>' +
        '<p class="small muted">Satu tim boleh memegang beberapa area: tulis nama tim yang sama (mis. "Retur" untuk Gudang Retur Ekspedisi dan Meja Kerja Retur). Skor dihitung per tim. Area baru otomatis mendapat checklist umum 6S; ubah itemnya di tab <b>Checklist audit</b>.</p>';
    } else if (tab === 'cek') {
      const aid = S.cekArea && D.areas.some(a => a.id === S.cekArea) ? S.cekArea : (D.areas[0] ? D.areas[0].id : '');
      S.cekArea = aid;
      const list = (D.checklist && D.checklist[aid]) || [];
      h = '<div class="card"><div class="toolbar"><select class="inp grow" id="ckArea">' + D.areas.map(a => '<option value="' + esc(a.id) + '"' + (a.id === aid ? ' selected' : '') + '>' + esc(a.id + ' · ' + a.nama) + '</option>').join('') + '</select></div>' +
        '<p class="small muted" style="margin-top:0">Satu baris satu item, format <b>Kategori | Item</b>. Kategori: ' + S.boot.rList.join(', ') + ' (nama lama Ringkas/Rapi/Resik/Rawat/Rajin juga diterima).</p>' +
        '<textarea class="inp" id="ckTxt" style="min-height:260px;font-family:ui-monospace,monospace;font-size:12.5px">' + esc(list.map(c => c.r + ' | ' + c.item).join('\n')) + '</textarea>' +
        '<div class="small muted" id="ckInfo" style="margin:8px 0 12px">' + list.length + ' item</div><button class="btn primary" id="ckSave">Simpan checklist</button></div>';
    } else {
      h = '<div class="card"><div class="grid g2">' + D.config.map((c, i) => '<div class="field"><label for="cf' + i + '">' + esc(c.key) + '</label><input class="inp tnum" id="cf' + i + '" data-k="' + esc(c.key) + '" type="number" step="0.1" min="0" value="' + esc(c.value) + '"><span class="hint">' + esc(c.ket) + '</span></div>').join('') + '</div>' +
        '<button class="btn primary" id="cfSave">Simpan aturan</button></div>';
    }
    MB.innerHTML = (canEdit('admin') ? '' : '<div class="note warn" style="margin-bottom:12px">Akses Anda untuk Master Data hanya lihat saja.</div>') + h;
    if (!canEdit('admin')) { $$('button, input, select, textarea', MB).forEach(x => { if (x.id !== 'uQ' && x.id !== 'ckArea') x.disabled = true; }); }
    if (tab === 'user') {
      $('#uImp').onclick = importForm;
      $$('[data-u]').forEach(b => b.onclick = () => userForm(D.users[+b.dataset.u]));
      $('#uQ').oninput = e => { const q = e.target.value.toLowerCase(); $$('#uTbl tr[data-q]').forEach(r => r.hidden = r.dataset.q.indexOf(q) < 0); };
    } else if (tab === 'area') {
      $$('[data-as]').forEach(b => b.onclick = async () => {
        const i = +b.dataset.as, a = D.areas[i];
        try { await call('apiSaveArea', S.token, { id: a.id, nama: $('[data-an="' + i + '"]').value.trim(), tim: $('[data-at="' + i + '"]').value.trim(), picNik: $('[data-ap="' + i + '"]').value, aktif: $('[data-aa="' + i + '"]').checked }); toast('Area ' + a.id + ' disimpan'); S.boot = await call('apiBootstrap', S.token); load(); }
        catch (e) { toast(e.message, true); }
      });
      $('#naAdd').onclick = async () => {
        try { await call('apiSaveArea', S.token, { id: $('#naId').value.trim(), nama: $('#naNama').value.trim() }); toast('Area ditambahkan'); S.boot = await call('apiBootstrap', S.token); load(); }
        catch (e) { toast(e.message, true); }
      };
    } else if (tab === 'cek') {
      const parseCk = () => $('#ckTxt').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
        const i = l.indexOf('|');
        return i < 0 ? { r: '', item: l } : { r: l.slice(0, i).trim(), item: l.slice(i + 1).trim() };
      });
      $('#ckArea').onchange = e => { S.cekArea = e.target.value; draw(); };
      $('#ckTxt').oninput = () => { $('#ckInfo').textContent = parseCk().length + ' item'; };
      $('#ckSave').onclick = async () => {
        const rows = parseCk();   // nama kategori dinormalisasi di server
        try { const r = await call('apiSaveChecklist', S.token, S.cekArea, rows); if (!D.checklist || Array.isArray(D.checklist)) D.checklist = {}; D.checklist[S.cekArea] = r; toast('Checklist ' + S.cekArea + ' disimpan (' + r.length + ' item)'); draw(); }
        catch (e) { toast(e.message, true); }
      };
    } else {
      $('#cfSave').onclick = async () => {
        try { await call('apiSaveConfig', S.token, $$('[data-k]').map(x => ({ key: x.dataset.k, value: x.value }))); toast('Aturan disimpan'); S.boot = await call('apiBootstrap', S.token); }
        catch (e) { toast(e.message, true); }
      };
    }
  };
  const userForm = (u) => {
    const ikut = 'Ikuti role HRIS (' + (HRIS_ROLE[u.hrisRole] || u.hrisRole) + ')';
    openModal('Atur pengguna 6S',
      '<div class="grid g2"><div class="field"><label>Username</label><input class="inp" value="' + esc(u.nik) + '" disabled></div>' +
      '<div class="field"><label>Nama</label><input class="inp" value="' + esc(u.nama) + '" disabled></div></div>' +
      '<div class="grid g2"><div class="field"><label for="fRole">Role 6S</label><select class="inp" id="fRole"><option value="">' + esc(ikut) + '</option>' + S.boot.roles.map(r => '<option value="' + r + '"' + (u.custom && u.role === r ? ' selected' : '') + '>' + roleLabel(r) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="fArea">Tim / area utama</label><select class="inp" id="fArea"><option value="">— tidak ada —</option>' + D.areas.map(a => '<option value="' + esc(a.id) + '"' + (u.areaId === a.id ? ' selected' : '') + '>' + esc(a.tim === a.nama ? a.nama : a.tim + ' — ' + a.nama) + '</option>').join('') + '</select></div></div>' +
      (u.pic ? '<div class="field"><label>Area tanggung jawab (PIC per shift)</label><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px">' +
        D.areas.map(a => '<label class="chk"><input type="checkbox" data-fa="' + esc(a.id) + '"' + ((u.areaPic || []).indexOf(a.id) >= 0 ? ' checked' : '') + '><span>' + esc(a.nama) + '</span></label>').join('') + '</div>' +
        '<span class="hint">' + (u.tertaut ? 'Jadwal hari ini: ' + esc(u.jadwal ? u.jadwal.label : '-') : '<b style="color:var(--warn-t)">Akun belum ditautkan ke karyawan IEG</b> — tautkan di HRIS → Pengaturan → Pengguna agar jadwal shift terbaca.') + '</span></div>'
        : '<p class="small muted">Bukan Leader / PIC IEG, jadi tidak bisa menjadi PIC area.</p>') +
      '<label class="chk" style="margin-bottom:14px"><input type="checkbox" id="fAktif"' + (u.aktif ? ' checked' : '') + '><span>Aktif di Monitoring 6S</span></label>' +
      '<p class="small muted">Admin: semua menu · Auditor: input temuan, verifikasi, audit · PIC: input temuan di area mana pun &amp; kirim perbaikan · Viewer: lihat saja. Nama &amp; password diubah di HRIS.</p>' +
      '<button class="btn primary block" id="fSave">Simpan</button>');
    $('#fSave').onclick = async () => {
      try {
        const body = { nik: u.nik, role: $('#fRole').value, areaId: $('#fArea').value, aktif: $('#fAktif').checked };
        if (u.pic) body.areaPic = $$('[data-fa]').filter(x => x.checked).map(x => x.dataset.fa);
        await call('apiSaveUser', S.token, body);
        closeModal(); toast('Pengguna disimpan'); S.boot = await call('apiBootstrap', S.token); load();
      } catch (e) { toast(e.message, true); }
    };
  };
  const importForm = () => {
    openModal('Atur tim pengguna',
      '<p class="small muted" style="margin-top:0">Salin dari Excel lalu tempel di bawah. Satu baris satu orang, kolom: <b>Username HRIS</b> · <b>Kode/nama area atau tim</b> · <b>Role 6S</b> (boleh kosong = ikut role HRIS). Akun harus sudah ada di HRIS.</p>' +
      '<textarea class="inp" id="impTxt" style="min-height:200px;font-family:ui-monospace,monospace;font-size:12.5px" placeholder="budi	Gudang Besar	PIC&#10;sari	A06	Auditor"></textarea>' +
      '<div class="small muted" id="impInfo" style="margin:8px 0 12px">0 baris</div><button class="btn primary block" id="impGo">Import</button>');
    const parse = () => $('#impTxt').value.split(/\r?\n/).map(l => l.split(/\t|;|,/).map(x => x.trim())).filter(r => r.join('') !== '');
    $('#impTxt').oninput = () => { $('#impInfo').textContent = parse().length + ' baris siap diimport'; };
    $('#impGo').onclick = async () => {
      const rows = parse(); if (!rows.length) return toast('Belum ada data.', true);
      if (/^(nik|username|user)$/i.test(rows[0][0])) rows.shift();
      const b = $('#impGo'); b.disabled = true; b.textContent = 'Mengimport…';
      try {
        const r = await call('apiImportUsers', S.token, rows);
        $('#impInfo').innerHTML = '<b>' + r.diubah + '</b> pengguna diperbarui' + (r.gagal.length ? '<br><span style="color:var(--err-t)">' + r.gagal.map(esc).join('<br>') + '</span>' : '');
        S.boot = await call('apiBootstrap', S.token); load();
        toast('Import selesai');
      } catch (e) { toast(e.message, true); }
      b.disabled = false; b.textContent = 'Import';
    };
  };
  $$('#mTabs button').forEach(b => b.addEventListener('click', () => { $$('#mTabs button').forEach(x => x.classList.remove('on')); b.classList.add('on'); tab = b.dataset.t; if (D) draw(); }));
  try { await load(); } catch (e) { MB.innerHTML = emptyBox(e.message); }
};

/* Jam mulai (S pertama disimpan) & selesai (6 S lengkap) 6S harian */
const fJam = ms => ms ? new Intl.DateTimeFormat('id-ID', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(new Date(ms)) : '-';

    '<div class="card" style="margin-bottom:12px"><h3>Approval perbaikan</h3>' +
    '<div class="grid g2">' + selOpsi(opsi('VERIFIKATOR')) + selOpsi(opsi('TUGAS_OTOMATIS')) + '</div>' +
    '<p class="small muted" style="margin:0"><b>Supervisor</b> = role 6S Supervisor (Auditor) yang punya akses edit menu Verifikasi. <b>Penemu temuan</b> = user yang input temuan tersebut; bila penemu sendiri yang memperbaiki, approval kembali ke Supervisor. Super Admin selalu bisa approval. Keberatan tetap diputuskan Supervisor.</p></div>' +
    // 2. Aturan nilai
    '<div class="card" style="margin-bottom:12px"><h3>Aturan nilai<span class="sub">aktifkan / nonaktifkan dan atur besarnya</span></h3>' +
    '<div class="grid g2">' + selOpsi(opsi('POIN_LAPOR_SEMUA')) + selOpsi(opsi('POIN_LAPOR_AREA_SENDIRI')) + '</div>' +
    D.grup.map(g => '<h4 style="margin:14px 0 6px">' + esc(g.nama) + '</h4><div class="tbl-wrap"><table class="tbl" style="min-width:640px"><thead><tr><th style="width:80px">Aktif</th><th>Aturan</th><th>Nilai</th></tr></thead><tbody>' +
      g.aturan.map(a => '<tr><td><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" data-aktif="' + a.id + '"' + (a.aktif ? ' checked' : '') + ' style="width:18px;height:18px"> <span class="small" data-lbl="' + a.id + '">' + (a.aktif ? 'Aktif' : 'Nonaktif') + '</span></label></td>' +
        '<td><b>' + esc(a.judul) + '</b><div class="cell-sub" style="max-width:none;white-space:normal">' + esc(a.ket) + '</div></td>' +
        '<td>' + a.keys.map(k => '<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><input class="inp tnum" type="number" step="0.1" min="0" data-nilai="' + k.key + '" data-grp="' + a.id + '" value="' + k.value + '" style="width:90px;min-height:32px"' + (a.aktif ? '' : ' disabled') + ' title="' + esc(k.ket) + '"><span class="small muted">' + esc(k.key) + '</span></div>').join('') + '</td></tr>').join('') +
      '</tbody></table></div>').join('') +
    '<button class="btn primary" id="atSave" style="margin-top:12px">' + ic('check') + 'Simpan approval &amp; aturan nilai</button></div>' +
    // 3. Control akses
    '<div class="card"><h3>Control akses menu<span class="sub">per role, dan pengecualian per user</span></h3>' +
    '<div class="tbl-wrap"><table class="tbl" style="min-width:640px"><thead><tr><th>Menu</th>' + roles.map(r => '<th>' + esc(roleLabel(r)) + '</th>').join('') + '</tr></thead><tbody>' +
    A.menus.map(m => '<tr><td><b>' + esc(m.label) + '</b>' + (m.viewOnly ? '<div class="cell-sub">hanya lihat</div>' : '') + '</td>' +
      roles.map(r => '<td>' + selLvl('data-rm="' + m.id + '" data-r="' + r + '"', m, lvl(roleMenus(r), roleRo(r), m.id), r === 'Viewer') + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>' +
    '<h4 style="margin:16px 0 6px">Pengecualian per user</h4><p class="small muted" style="margin:0 0 8px">User di sini memakai akses khusus, menggantikan akses role-nya.</p>' +
    '<div class="toolbar"><select class="inp grow" id="auPick"><option value="">— Pilih user untuk diberi akses khusus —</option>' +
    A.users.map(u => '<option value="' + esc(u.username.toLowerCase()) + '">' + esc(u.nama) + ' · ' + esc(roleLabel(u.role)) + '</option>').join('') + '</select>' +
    '<button class="btn" id="auAdd">Tambah</button></div><div id="auList"></div>' +
    '<button class="btn primary" id="akSave" style="margin-top:12px">' + ic('check') + 'Simpan control akses</button></div>';

  const drawUsers = () => {
    const ks = Object.keys(users);
    $('#auList').innerHTML = ks.length ? '<div class="tbl-wrap"><table class="tbl" style="min-width:720px"><thead><tr><th>User</th>' + A.menus.map(m => '<th>' + esc(m.label.split(' (')[0]) + '</th>').join('') + '<th></th></tr></thead><tbody>' +
      ks.map(u => '<tr><td><b>' + esc(uName(u)) + '</b><div class="cell-sub">' + esc(roleLabel(uRole(u))) + '</div></td>' +
        A.menus.map(m => '<td>' + selLvl('data-um="' + m.id + '" data-u="' + esc(u) + '"', m, lvl(users[u].menus, users[u].ro, m.id), uRole(u) === 'Viewer') + '</td>').join('') +
        '<td><button class="btn sm" data-udel="' + esc(u) + '">Hapus</button></td></tr>').join('') + '</tbody></table></div>'
      : '<div class="small muted">Belum ada pengecualian user.</div>';
    $$('[data-um]').forEach(s => s.onchange = () => {
      const o = users[s.dataset.u], id = s.dataset.um;
      o.menus = o.menus.filter(x => x !== id); o.ro = o.ro.filter(x => x !== id);
      if (s.value) o.menus.push(id); if (s.value === 'lihat') o.ro.push(id);
    });
    $$('[data-udel]').forEach(b => b.onclick = () => { delete users[b.dataset.udel]; drawUsers(); });
  };
  drawUsers();
  $('#auAdd').onclick = () => {
    const u = $('#auPick').value;
    if (!u) return toast('Pilih user dulu.', true);
    if (!users[u]) { const r = uRole(u); users[u] = { menus: roleMenus(r).slice(), ro: roleRo(r).slice() }; }
    drawUsers();
  };
  $$('[data-aktif]').forEach(c => c.onchange = () => {
    $$('[data-grp="' + c.dataset.aktif + '"]').forEach(i => { i.disabled = !c.checked; });
    $('[data-lbl="' + c.dataset.aktif + '"]').textContent = c.checked ? 'Aktif' : 'Nonaktif';
  });
  $('#atSave').onclick = async () => {
    const d = { aktif: {}, nilai: {}, opsi: {} };
    $$('[data-aktif]').forEach(c => { d.aktif[c.dataset.aktif] = c.checked; });
    $$('[data-nilai]').forEach(i => { d.nilai[i.dataset.nilai] = i.value; });
    $$('[data-opsi]').forEach(s => { d.opsi[s.dataset.opsi] = +s.value; });
    const b = $('#atSave'); b.disabled = true;
    try { await call('apiAturSimpan', S.token, d); S.boot = await call('apiBootstrap', S.token); toast('Approval & aturan nilai disimpan'); refreshBadges(); }
    catch (e) { toast(e.message, true); }
    b.disabled = false;
  };
  $('#akSave').onclick = async () => {
    const p = { roles: {}, users: {}, ro: { roles: {}, users: {} } };
    roles.forEach(r => { p.roles[r] = []; p.ro.roles[r] = []; });
    $$('[data-rm]').forEach(s => { if (s.value) p.roles[s.dataset.r].push(s.dataset.rm); if (s.value === 'lihat') p.ro.roles[s.dataset.r].push(s.dataset.rm); });
    Object.keys(users).forEach(u => { p.users[u] = users[u].menus; p.ro.users[u] = users[u].ro; });
    const b = $('#akSave'); b.disabled = true;
    try { await call('apiAksesSimpan', S.token, p); toast('Control akses disimpan'); VIEWS.atur(); }
    catch (e) { toast(e.message, true); b.disabled = false; }
  };
};
VIEWS.qr = function () {
  const v = $('#view');
  v.innerHTML = '<div class="toolbar no-print"><span class="grow small muted">Tempel QR di setiap area. Saat dipindai dengan PDT/HP, form temuan langsung terisi area tersebut.</span><button class="btn primary" onclick="window.print()">' + ic('print') + 'Cetak</button></div>' +
    '<div class="qr-grid">' + S.boot.areas.map(a => {
      const url = APP_URL + '?area=' + encodeURIComponent(a.id);
      return '<div class="card qr-card"><img alt="QR ' + esc(a.nama) + '" src="https://quickchart.io/qr?size=360&margin=1&text=' + encodeURIComponent(url) + '"><b>' + esc(a.nama) + '</b><div class="small muted">' + esc(a.id) + ' · Scan untuk lapor temuan 6S</div></div>';
    }).join('') + '</div>';
};

/* Kembali ke HRIS (sesi yang sama, tanpa login ulang) */
VIEWS.hris = function () { location.href = HOME_URL; };

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
init();
</script>
</body>
</html>
