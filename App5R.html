<!DOCTYPE html>
<html lang="id" data-theme="morning">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" type="image/svg+xml" href="assets/image/favicon.svg">
<link rel="apple-touch-icon" href="assets/image/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<title>Monitoring 5R · PT. Inovasi Eka Gemilang</title>
<style>
/* ===== Design OCS v3.0 — Morning (light) / Evening (dark) ===== */
:root, [data-theme="morning"]{
  --bg:#F8F9FF; --surface:#FFFFFF; --surface-2:#F3F4FF; --hover:#EEF2FF;
  --border:rgba(79,70,229,.10); --line:#E0E0E0;
  --text:#1D2D3E; --text-2:#242424; --muted:#556B82;
  --primary:#4F46E5; --primary-ink:#4338CA; --primary-soft:#EEF2FF; --on-primary:#FFFFFF;
  --accent:#7C3AED; --pink:#EC4899;
  --grad:linear-gradient(135deg,#4F46E5,#7C3AED 55%,#EC4899);
  --side:linear-gradient(180deg,#0F172A 0%,#1E1B4B 55%,#172554 100%);
  --side-text:#C7D2FE; --side-active:linear-gradient(90deg,rgba(99,102,241,.45),rgba(236,72,153,.25));
  --th:linear-gradient(90deg,#EEF2FF,#FCE7F3); --th-text:#4338CA;
  --ok-t:#2E7D32; --ok-b:#E8F5E9; --ok:#4CAF50;
  --warn-t:#B45309; --warn-b:#FFF3E0; --warn:#FB8C00;
  --err-t:#B00020; --err-b:#FDECEE; --err:#B00020;
  --info-t:#1565C0; --info-b:#E3F2FD; --info:#2196F3;
  --neu-t:#475569; --neu-b:#F1F5F9;
  --bar:#4F46E5; --track:#EEF0FB;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.04);
  --shadow-lg:0 10px 30px rgba(30,27,75,.18);
  --scroll:#C7CBEF;
}
[data-theme="evening"]{
  --bg:#12171C; --surface:#1D232A; --surface-2:#232A33; --hover:#2A3240;
  --border:rgba(165,180,252,.14); --line:#2F3943;
  --text:#EAECEE; --text-2:#D5DADD; --muted:#A9B4BE;
  --primary:#818CF8; --primary-ink:#A5B4FC; --primary-soft:rgba(129,140,248,.16); --on-primary:#12171C;
  --accent:#A78BFA; --pink:#F472B6;
  --grad:linear-gradient(135deg,#6366F1,#8B5CF6 55%,#EC4899);
  --side:linear-gradient(180deg,#050811 0%,#0F172A 60%,#172554 100%);
  --side-text:#C7D2FE; --side-active:linear-gradient(90deg,rgba(129,140,248,.35),rgba(244,114,182,.20));
  --th:linear-gradient(90deg,rgba(99,102,241,.20),rgba(236,72,153,.12)); --th-text:#C7D2FE;
  --ok-t:#81C784; --ok-b:rgba(76,175,80,.16); --ok:#66BB6A;
  --warn-t:#FFB74D; --warn-b:rgba(251,140,0,.16); --warn:#FFA726;
  --err-t:#FF8A80; --err-b:rgba(255,82,82,.15); --err:#FF6B6B;
  --info-t:#90CAF9; --info-b:rgba(33,150,243,.16); --info:#64B5F6;
  --neu-t:#CBD5E1; --neu-b:rgba(148,163,184,.14);
  --bar:#818CF8; --track:#262E38;
  --shadow:0 1px 2px rgba(0,0,0,.30); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  --scroll:#3A4552;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13.5px/1.5 "Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
a{color:var(--primary)}
.tnum{font-variant-numeric:tabular-nums}

/* ===== Login ===== */
.login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--grad)}
.login-card{width:100%;max-width:360px;background:var(--surface);border-radius:18px;padding:24px 20px;box-shadow:var(--shadow-lg)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.5px}
.brand-t{font-weight:800;font-size:16px;line-height:1.1}
.brand-s{font-size:12px;color:var(--muted)}

/* ===== Shell (sama dengan HRIS) ===== */
.shell{min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;z-index:40;transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.side.open{transform:none;box-shadow:var(--shadow-lg)}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-mark{width:34px;height:34px;border-radius:8px;background:#fff;padding:3px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-mark img{width:100%;height:100%;object-fit:contain;display:block}
.side-toggle{display:none;place-items:center;flex:none;width:28px;height:28px;margin-left:auto;border:0;border-radius:7px;background:transparent;color:#94A3B8;cursor:pointer}
.side-toggle svg{width:19px;height:19px}
.side-toggle:focus-visible{outline:2px solid #A5B4FC;outline-offset:1px}
@media(hover:hover){.side-toggle:hover{background:rgba(255,255,255,.08);color:#fff}}
.side-title{min-width:0;color:#fff;font-weight:700;font-size:14px;line-height:1.25}
.side-title>div,.side-title small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-title small{display:block;font-weight:500;color:#94A3B8;font-size:11.5px}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav-sec{font-size:11px;font-weight:600;color:#94A3B8;padding:16px 12px 6px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;min-height:38px;padding:0 12px;margin:1px 0;border-radius:8px;color:var(--side-text);text-decoration:none;font-weight:500;font-size:13px;cursor:pointer}
@media(hover:hover){.nav a:hover{background:rgba(255,255,255,.08);color:#fff}}
.nav a.active{background:var(--side-active);color:#fff;font-weight:600}
.nav a.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#F472B6}
.nav svg{width:19px;height:19px;flex:none;opacity:.9}
.nav .badge{margin-left:auto}
.side-foot{padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.side-user{display:flex;gap:10px;align-items:center;padding:8px;margin-bottom:4px;border-radius:8px;color:#fff}
.side-user .user-meta{flex:1;min-width:0}
.side-user b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user small{display:block;color:#94A3B8;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.side-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-text);min-height:34px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;text-decoration:none}
.side-link svg{width:18px;height:18px;flex:none}
@media(hover:hover){.side-link:hover{background:rgba(255,255,255,.08);color:#fff}}
.side-credit{padding:10px 10px 2px;font-size:11px;color:#94A3B8;text-align:center}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.main{min-height:100vh;display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:19px;height:19px}
.view{flex:1;padding:14px 12px 88px;width:100%;min-width:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer;position:relative;min-height:56px;justify-content:center}
.bnav a.active{color:var(--primary)}
.bnav a.active::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
.bnav svg{width:21px;height:21px}
.bnav .badge{position:absolute;top:4px;left:calc(50% + 6px)}
@media(min-width:768px){
  .bnav{display:none!important}
  .view{padding:20px 24px 36px}
  .top{padding:8px 24px;min-height:60px}
}
@media(min-width:1024px){
  .side{transform:none}
  .scrim,#btnMenu{display:none!important}
  .main{margin-left:248px}
  /* Sidebar mini: hanya ikon */
  .side-toggle{display:grid}
  .side,.main{transition:width .22s cubic-bezier(.2,.8,.2,1),margin-left .22s cubic-bezier(.2,.8,.2,1),transform .24s cubic-bezier(.2,.8,.2,1)}
  .side-mini .side{width:72px}
  .side-mini .main{margin-left:72px}
  .side-mini .side-brand{flex-direction:column;gap:8px;padding:14px 8px 12px}
  .side-mini .side-toggle{margin-left:0}
  .side-mini .side-title,.side-mini .nav a>span:not(.badge),.side-mini .side-user .user-meta,.side-mini .side-link>span,.side-mini .side-credit{display:none}
  .side-mini .nav-sec{font-size:0;padding:0;margin:8px 6px;border-top:1px solid rgba(255,255,255,.08)}
  .side-mini .nav{padding:10px 8px}
  .side-mini .nav a{justify-content:center;padding:0}
  .side-mini .nav a.active::before{left:-8px}
  .side-mini .nav .badge{position:absolute;top:3px;right:6px;margin:0}
  .side-mini .side-user,.side-mini .side-link{justify-content:center;padding-left:0;padding-right:0}
}

/* ===== Komponen ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 10px;font-size:14.5px;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--primary)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin-top:2px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--grad);border:0;color:#fff}.kpi.hero .l,.kpi.hero .s{color:rgba(255,255,255,.85)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--grad);border:0;color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok);border:0;color:#fff}
.btn.danger{background:var(--err-b);color:var(--err-t);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.inp{width:100%;min-height:38px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);outline:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 16px,calc(100% - 13px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.seg.score button{width:40px;padding:0}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13.5px}
.chk input{width:20px;height:20px;accent-color:var(--primary);margin:1px 0 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.c-ok{background:var(--ok-b);color:var(--ok-t)}.c-warn{background:var(--warn-b);color:var(--warn-t)}
.c-err{background:var(--err-b);color:var(--err-t)}.c-info{background:var(--info-b);color:var(--info-t)}
.c-neu{background:var(--neu-b);color:var(--neu-t)}.c-pri{background:var(--primary-soft);color:var(--primary-ink)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#EC4899;color:#fff;font-size:10.5px;font-weight:800;display:inline-grid;place-items:center}
.muted{color:var(--muted)}.small{font-size:12px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty svg{width:42px;height:42px;opacity:.5;display:block;margin:0 auto 8px}
.note{background:var(--primary-soft);color:var(--primary-ink);border-radius:10px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-b);color:var(--warn-t)}

/* Daftar temuan */
.tlist{display:grid;gap:10px}
@media(min-width:760px){.tlist{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1200px){.tlist{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1600px){.tlist{grid-template-columns:repeat(4,1fr)}}
.titem{display:flex;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.titem:hover{border-color:var(--primary)}
.titem.late{box-shadow:inset 3px 0 0 var(--err),var(--shadow)}
.thumb{width:68px;height:68px;border-radius:10px;background:var(--surface-2);flex:none;object-fit:cover}
.titem .b{flex:1;min-width:0}
.titem .id{font-size:11.5px;color:var(--muted);font-weight:700}
.titem .d{font-weight:600;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.titem .meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.titem .foot{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}

/* Grafik sederhana */
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(92px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar-lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:10px;background:var(--track);border-radius:0 5px 5px 0;overflow:hidden}
.bar-fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0;transition:width .4s ease}
.bars.stack .bar-row{grid-template-columns:1fr auto;row-gap:4px}
.bars.stack .bar-lab{grid-column:1;grid-row:1}.bars.stack .bar-val{grid-column:2;grid-row:1}
.bars.stack .bar-track{grid-column:1/-1;grid-row:2}.bars.stack .sub{grid-row:3;margin-top:0}
@media(min-width:700px){.bars.stack .bar-row{grid-template-columns:minmax(140px,38%) 1fr auto}.bars.stack .bar-lab,.bars.stack .bar-val,.bars.stack .bar-track{grid-row:1}.bars.stack .bar-lab{grid-column:1}.bars.stack .bar-track{grid-column:2}.bars.stack .bar-val{grid-column:3}.bars.stack .sub{grid-row:2;margin-top:-6px}}
.bar-val{font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.bar-row .sub{grid-column:1/-1;margin-top:-6px;font-size:11.5px;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:16px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col .cv{font-size:11px;font-weight:700;margin-bottom:3px;font-variant-numeric:tabular-nums}
.col .cb{width:70%;max-width:30px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.col-l{display:flex;gap:6px}.col-l span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);padding-top:4px}

/* Tabel */
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--border)}
table.tbl{border-collapse:collapse;width:100%;min-width:520px}
.tbl th{background:var(--th);color:var(--th-text);font-size:12.5px;font-weight:700;text-align:left;padding:10px 12px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--text-2)}
[data-theme="evening"] .tbl td{color:var(--text-2)}
.tbl tr:hover td{background:var(--hover)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:12.5px;background:var(--neu-b);color:var(--neu-t)}
.rank.r1{background:var(--grad);color:#fff}
.rank.r2{background:var(--primary-soft);color:var(--primary-ink)}
.rank.r3{background:var(--primary-soft);color:var(--primary-ink)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:12px;overflow:auto}
.tabs button{flex:1;min-height:38px;border:0;background:transparent;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;padding:0 12px}
.tabs button.on{background:var(--surface);color:var(--primary-ink);box-shadow:var(--shadow)}

/* Foto */
.photo-pick{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:var(--surface-2)}
.photo-pick:hover{border-color:var(--primary)}
.photo-pick img{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:0 auto}
.photo-pick svg{width:34px;height:34px;color:var(--primary)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{background:var(--surface-2);border-radius:12px;overflow:hidden;position:relative;aspect-ratio:1/1;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph .cap{position:absolute;left:6px;top:6px;background:rgba(15,23,42,.65);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;font-size:13.5px;margin:12px 0}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;word-break:break-word}
.timeline{border-left:2px solid var(--line);margin:8px 0 4px 6px;padding-left:14px;display:grid;gap:10px;font-size:13px}
.timeline div{position:relative}
.timeline div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary)}

/* Modal (bottom sheet di HP) */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:up .22s ease}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet-h h2{font-size:16px;margin:0;flex:1}
@media(min-width:700px){.modal{align-items:center;padding:24px}.sheet{max-width:760px;max-height:90vh;border-radius:16px;padding:20px 22px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:80;background:#1E1B4B;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);max-width:calc(100% - 24px);text-align:center}
.toast.err{background:#B00020}
@media(min-width:768px){.toast{bottom:24px}}
.spin{width:22px;height:22px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.audit-item{padding:10px 0;border-top:1px solid var(--line)}
.audit-item:first-child{border-top:0}
.audit-item .q{font-size:13.5px;margin-bottom:6px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.qr-card{text-align:center}
.qr-card img{width:180px;height:180px;background:#fff;border-radius:10px;padding:6px}
.qr-card b{display:block;margin-top:6px}
@media print{
  body{background:#fff}.side,.top,.bnav,.toolbar,.no-print{display:none!important}
  .main{margin:0}.view{padding:0}.qr-card{break-inside:avoid;border:1px solid #ccc;box-shadow:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* =====================================================================
 *  MONITORING 5R IEG — Frontend
 * ===================================================================== */
const AREA_PARAM = <?!= JSON.stringify(areaParam) ?>;
const APP_URL = <?!= JSON.stringify(appUrl) ?>;
const LOGIN_URL = <?!= JSON.stringify(loginUrl) ?>;
const HRIS_ROLE = { ADMIN: 'Admin', SUPERVISOR: 'Supervisor', LEADER: 'Leader', VIEWER: 'Viewer' };
const HOME_URL = LOGIN_URL.replace(/login$/, '');

const S = { token: null, user: null, boot: null, view: 'dash', bulan: null, badge: { tugas: 0, verif: 0 } };
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

/* ---------- Ikon ---------- */
const I = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
  plus: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  task: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  clip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3"/>',
  home: '<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  cam: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  wa: '<path d="M21 12a9 9 0 0 1-13.4 7.9L3 21l1.2-4.4A9 9 0 1 1 21 12z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-1.9-.9-.8.8a4 4 0 0 1-2-2l.8-.8-.9-1.9z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  print: '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  refresh: '<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>'
};
const ic = (n) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (I[n] || '') + '</svg>';

/* ---------- Menu ---------- */
const MENU = [
  { id: 'dash', t: 'Dashboard', i: 'dash', sec: 'Monitoring' },
  { id: 'input', t: 'Input Temuan', i: 'plus', roles: ['Admin', 'Auditor', 'PIC'] },
  { id: 'tugas', t: 'Tugas Saya', i: 'task', roles: ['Admin', 'Auditor', 'PIC'], badge: 'tugas' },
  { id: 'daftar', t: 'Daftar Temuan', i: 'list' },
  { id: 'verif', t: 'Verifikasi', i: 'shield', roles: ['Admin', 'Auditor'], badge: 'verif' },
  { id: 'audit', t: 'Audit 5R', i: 'clip', roles: ['Admin', 'Auditor'] },
  { id: 'poin', t: 'Papan Poin', i: 'trophy' },
  { id: 'kpi', t: 'KPI PIC', i: 'chart' },
  { id: 'admin', t: 'Master Data', i: 'gear', roles: ['Admin'], sec: 'Pengaturan' },
  { id: 'qr', t: 'QR Area', i: 'qr', roles: ['Admin'] }
];
const BNAV = ['dash', 'input', 'tugas', 'poin'];
const can = (m) => !m.roles || m.roles.indexOf(S.user.role) >= 0;
const canDo = (id) => { const m = MENU.find(x => x.id === id); return m && can(m); };

/* ---------- Util ---------- */
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } },
  del: k => { try { localStorage.removeItem(k); } catch (e) { } }
};
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const TZ = 'Asia/Jakarta';
function fDate(ms, withTime = true) {
  if (!ms) return '-';
  const o = { timeZone: TZ, day: '2-digit', month: 'short', year: 'numeric' };
  if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
  return new Intl.DateTimeFormat('id-ID', o).format(new Date(ms));
}
function fBulan(b) { const [y, m] = b.split('-'); return new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(new Date(+y, +m - 1, 1)); }
function durasi(ms) {
  const a = Math.abs(ms), d = Math.floor(a / 864e5), h = Math.floor(a % 864e5 / 36e5), m = Math.floor(a % 36e5 / 6e4);
  if (d) return d + ' hr ' + h + ' jam';
  if (h) return h + ' jam ' + m + ' mnt';
  return m + ' mnt';
}
function sisa(t) {
  if (t.status === 'Closed') return t.terlambat ? 'Selesai (terlambat)' : 'Selesai tepat waktu';
  if (t.status === 'Batal') return 'Dibatalkan';
  if (t.status === 'Menunggu Verifikasi') return 'Dikirim ' + fDate(t.tglPerbaikan);
  if (t.status === 'Keberatan') return 'Keberatan ditinjau · batas waktu dihentikan';
  const diff = t.deadline - Date.now();
  return diff < 0 ? 'Terlambat ' + durasi(diff) : 'Sisa ' + durasi(diff);
}
function num(n, d = 1) { return n == null ? '-' : (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString('id-ID'); }
function signed(n) { return (n > 0 ? '+' : '') + num(n); }

function statusChip(t) {
  if (t.status === 'Open' || t.status === 'Revisi') {
    if (t.terlambat) return '<span class="chip c-err">Terlambat</span>';
    return t.status === 'Revisi' ? '<span class="chip c-warn">Revisi</span>' : '<span class="chip c-info">Open</span>';
  }
  const m = { 'Menunggu Verifikasi': 'c-warn', 'Closed': 'c-ok', 'Batal': 'c-neu', 'Keberatan': 'c-pri' };
  const label = t.status === 'Menunggu Verifikasi' ? 'Menunggu verifikasi' : t.status;
  return '<span class="chip ' + (m[t.status] || 'c-neu') + '">' + esc(label) + '</span>';
}
function tingkatChip(x) { return '<span class="chip nodot ' + ({ Minor: 'c-neu', Mayor: 'c-warn', Kritis: 'c-err' }[x] || 'c-neu') + '">' + esc(x) + '</span>'; }
function rChip(r) { return '<span class="chip nodot c-pri">' + esc(r) + '</span>'; }
const FOTO_RE = /^[a-f0-9]{32}\.(jpg|png|webp)$/;
const thumbUrl = (id) => FOTO_RE.test(id) ? 'uploads/foto/' + id : '';
const viewUrl = thumbUrl;
function imgTag(id, cls, w) {
  if (!id) return '<div class="' + cls + '"></div>';
  return '<img class="' + cls + '" loading="lazy" alt="Foto temuan" src="' + thumbUrl(id, w) + '" data-fid="' + esc(id) + '" onerror="fotoFallback(this)">';
}
function fotoFallback(img) {
  if (img.dataset.fb) return;
  img.dataset.fb = '1';
  img.alt = 'Foto tidak dapat dimuat';
}

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, err ? 4500 : 2600);
}
function loading(el) { (el || $('#view')).innerHTML = '<div class="spin"></div>'; }
function emptyBox(msg) { return '<div class="empty">' + ic('inbox') + esc(msg) + '</div>'; }

/* ---------- Server call ---------- */
async function call(fn, ...args) {
  let res;
  try {
    const r = await fetch('api5r.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn, args }), credentials: 'same-origin' });
    res = await r.json();
  } catch (e) { throw new Error('Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.'); }
  if (!res) throw new Error('Tidak ada respon dari server.');
  if (res.ok) return res.data;
  if (res.error === 'SESI_HABIS') { logout(true); throw new Error('Sesi berakhir, silakan masuk lagi.'); }
  if (res.error === 'GANTI_PASSWORD') { location.replace(HOME_URL); throw new Error('Ganti password awal di HRIS terlebih dahulu.'); }
  throw new Error(res.error);
}

/* ---------- Tema ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  store.set('hris_theme', t);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = t === 'evening' ? '#12171C' : '#4F46E5';
  const b = $('#btnTheme');
  if (b) { b.innerHTML = ic(t === 'evening' ? 'sun' : 'moon'); b.title = t === 'evening' ? 'Tema Morning (terang)' : 'Tema Evening (gelap)'; }
}
function toggleTheme() { applyTheme(document.documentElement.getAttribute('data-theme') === 'evening' ? 'morning' : 'evening'); }

/* ---------- Login ---------- */
async function init() {
  applyTheme(store.get('hris_theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'evening' : 'morning'));
  const t = store.get('hris_token');
  if (t) {
    S.token = t;
    try {
      await boot();
      return;
    } catch (e) { if (!S.token) return; toast(e.message, true); return; }
  }
  showLogin();
}
function showLogin(msg) {
  const q = new URLSearchParams({ app: '5r' });
  if (msg) q.set('msg', msg);
  if (AREA_PARAM) q.set('area', AREA_PARAM);
  location.replace(LOGIN_URL + '?' + q.toString());
}
async function logout(expired) {
  const t = S.token;
  S.token = null; S.user = null;
  if (!expired && t) {
    try { await fetch('api.php?action=logout', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': t }, body: '{}' }); } catch (e) { }
  }
  store.del('hris_token');
  showLogin(expired ? 'Sesi berakhir, silakan masuk lagi.' : '');
}
async function boot() {
  S.boot = await call('apiBootstrap', S.token);
  S.user = S.boot.user; S.bulan = S.boot.bulanIni;
  $('#shell').hidden = false;
  if (AREA_PARAM) history.replaceState(null, '', location.pathname);
  $('#whoName').textContent = S.user.nama;
  $('#goHris').href = HOME_URL;
  const ava = $('#whoAva');
  if (S.user.foto) ava.innerHTML = '<img src="' + esc(S.user.foto) + '" alt="">';
  else ava.textContent = (S.user.nama || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const ar = S.boot.areas.find(a => a.id === S.user.areaId);
  $('#whoRole').textContent = S.user.role + (S.user.tim ? ' · Tim ' + S.user.tim : '');
  buildNav();
  setSideMini(document.documentElement.classList.contains('side-mini'));
  applyTheme(document.documentElement.getAttribute('data-theme'));
  go(AREA_PARAM && canDo('input') ? 'input' : 'dash');
  refreshBadges();
}

/* ---------- Navigasi ---------- */
function buildNav() {
  let h = '';
  MENU.filter(can).forEach(m => {
    if (m.sec) h += '<div class="nav-sec">' + m.sec + '</div>';
    h += '<a data-v="' + m.id + '" title="' + m.t + '" onclick="go(\'' + m.id + '\')">' + ic(m.i) + '<span>' + m.t + '</span>' + (m.badge ? '<span class="badge" data-b="' + m.badge + '" hidden>0</span>' : '') + '</a>';
  });
  $('#nav').innerHTML = h;
  let b = '';
  BNAV.forEach(id => {
    const m = MENU.find(x => x.id === id);
    if (!can(m)) return;
    b += '<a data-v="' + m.id + '" onclick="go(\'' + m.id + '\')">' + ic(m.i) + '<span>' + (id === 'input' ? 'Temuan' : id === 'tugas' ? 'Tugas' : id === 'poin' ? 'Poin' : 'Dashboard') + '</span>' + (m.badge ? '<span class="badge" data-b="' + m.badge + '" hidden>0</span>' : '') + '</a>';
  });
  b += '<a onclick="drawer(true)">' + ic('menu') + '<span>Menu</span></a>';
  $('#bnav').innerHTML = b;
  $('#bnav').style.gridTemplateColumns = 'repeat(' + $$('#bnav a').length + ',1fr)';
}
function setSideMini(on) {
  document.documentElement.classList.toggle('side-mini', on);
  store.set('side_mini', on ? '1' : '0');
  const b = $('#sideToggle');
  b.title = on ? 'Lebarkan sidebar' : 'Kecilkan sidebar';
  b.setAttribute('aria-label', b.title);
  b.setAttribute('aria-expanded', String(!on));
  $('#sideToggleArrow').setAttribute('d', on ? 'M14 10l2 2-2 2' : 'M16 10l-2 2 2 2');
}
function drawer(open) { $('#side').classList.toggle('open', open); $('#scrim').classList.toggle('show', open); }
const VIEWS = {};
function go(id, opt) {
  const m = MENU.find(x => x.id === id);
  if (!m || !can(m)) id = 'dash';
  S.view = id;
  $$('[data-v]').forEach(a => a.classList.toggle('active', a.dataset.v === id));
  $('#title').textContent = MENU.find(x => x.id === id).t;
  drawer(false); closeModal();
  window.scrollTo(0, 0);
  VIEWS[id](opt || {});
}
async function refreshBadges() {
  try {
    if (canDo('tugas')) {
      const r = await call('apiListTemuan', S.token, { scope: 'mine', status: 'Aktif' });
      S.badge.tugas = r.filter(t => t.status === 'Open' || t.status === 'Revisi').length;
    }
    if (canDo('verif')) {
      const v = await call('apiListTemuan', S.token, { scope: 'verifikasi' });

/* ---------- Foto: kompres + cap waktu ---------- */
function compressPhoto(file, stamp, max = 1280, q = 0.7) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0, c.width, c.height);
      if (stamp) {
        const fs = Math.max(14, Math.round(c.width / 40));
        g.font = '600 ' + fs + 'px sans-serif';
        const pad = Math.round(fs * .6), hBar = fs + pad * 2;
        g.fillStyle = 'rgba(15,23,42,.62)';
        g.fillRect(0, c.height - hBar, c.width, hBar);
        g.fillStyle = '#fff'; g.textBaseline = 'middle';
        g.fillText(stamp, pad, c.height - hBar / 2);
      }
      URL.revokeObjectURL(url);
      let out = c.toDataURL('image/webp', q);
      if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', q);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto tidak dapat dibaca.')); };
    img.src = url;
  });
}
function stampText(areaNama) { return fDate(Date.now()) + ' WIB · ' + areaNama + ' · ' + S.user.nama; }
function photoPicker(id, label) {
  return '<div class="photo-pick" id="' + id + '_box" onclick="document.getElementById(\'' + id + '\').click()">' + ic('cam') +
    '<div style="font-weight:700;margin-top:4px">' + esc(label) + '</div><div class="small muted">Ketuk untuk membuka kamera</div></div>' +
    '<input type="file" id="' + id + '" accept="image/*" capture="environment" hidden>';
}
function bindPhoto(id, getStamp, onDone) {
  $('#' + id).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const box = $('#' + id + '_box');
    box.innerHTML = '<div class="spin" style="margin:10px auto"></div>';
    try {
      const data = await compressPhoto(f, getStamp());
      box.innerHTML = '<img src="' + data + '" alt="Pratinjau foto"><div class="small muted" style="margin-top:6px">Ketuk untuk mengganti foto</div>';
      onDone(data);
    } catch (err) { toast(err.message, true); box.innerHTML = ic('cam') + '<div>Coba lagi</div>'; }
    e.target.value = '';
  });
}

  function fallback() { const ta = $('#waText'); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Salin manual: tekan lama teks lalu Salin', true); } }

async function rekapWA() {
  try {
    const rows = await call('apiListTemuan', S.token, { status: 'Aktif' });

/* ---------- Grafik sederhana ---------- */
function barList(items, max, stack) {
  if (!items.length) return emptyBox('Belum ada data');
  const mx = max || Math.max(1, ...items.map(i => i.v));
  return '<div class="bars' + (stack ? ' stack' : '') + '">' + items.map(i =>
    '<div class="bar-row" title="' + esc(i.tip || (i.l + ': ' + i.v)) + '"><div class="bar-lab">' + esc(i.l) + '</div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(0, Math.min(100, i.v / mx * 100)) + '%"></div></div>' +
    '<div class="bar-val">' + esc(i.vl != null ? i.vl : i.v) + '</div>' + (i.sub ? '<div class="sub">' + i.sub + '</div>' : '') + '</div>').join('') + '</div>';
}
function colChart(items) {
  const mx = Math.max(1, ...items.map(i => i.v));
  return '<div class="cols">' + items.map(i => '<div class="col" title="' + esc(i.tip) + '"><div class="cv">' + i.v + '</div><div class="cb" style="height:' + (i.v / mx * 100) + '%"></div></div>').join('') +
    '</div><div class="col-l">' + items.map(i => '<span>' + esc(i.l) + '</span>').join('') + '</div>';
}

  const LB = $('#lBody');
  const reload = async () => {
    loading(LB);
    try {
      let rows = await call('apiListTemuan', S.token, f);
      if (scope === 'verifikasi') rows = rows.filter(t => t.picNik.toLowerCase() !== S.user.nik.toLowerCase());
      const msg = scope === 'mine' ? 'Tidak ada tugas perbaikan. Mantap!' : scope === 'verifikasi' ? 'Tidak ada perbaikan atau keberatan yang perlu diputuskan.' : 'Tidak ada temuan untuk filter ini.';
      LB.innerHTML = '<div class="small muted" style="margin-bottom:8px">' + rows.length + ' temuan</div>' + (rows.length ? '<div class="tlist">' + rows.map(tItem).join('') + '</div>' : emptyBox(msg));
    } catch (e) { LB.innerHTML = emptyBox(e.message); }
  };
  if ($('#lBulan')) $('#lBulan').addEventListener('change', e => { f.bulan = e.target.value; reload(); });
  $('#lArea').addEventListener('change', e => { f.areaId = e.target.value; reload(); });
  if ($('#lStatus')) $('#lStatus').addEventListener('change', e => { f.status = e.target.value; reload(); });
  let to; $('#lQ').addEventListener('input', e => { clearTimeout(to); to = setTimeout(() => { f.q = e.target.value; reload(); }, 350); });
  reload();
}

VIEWS.tugas = async opt => {

function kpiChip(r, target) {
  if (r.skor == null) return '<span class="chip c-neu">Belum ada data</span>';
  return '<span class="chip ' + (r.skor >= target ? 'c-ok' : r.skor >= target - 15 ? 'c-warn' : 'c-err') + '">' + num(r.skor) + '</span>';
}
function pctTxt(v) { return v == null ? '-' : num(v) + '%'; }
function kpiStrip(r, target) {
  const it = (l, v, s) => '<div class="kpi"><div class="l">' + l + '</div><div class="v tnum" style="font-size:22px">' + v + '</div><div class="s">' + s + '</div></div>';
  return '<div class="kpis">' +
    it('Skor KPI', r.skor == null ? '-' : num(r.skor), r.status) +
    it('Tepat waktu', pctTxt(r.pctTepat), r.tepat + ' dari ' + r.selesai + ' selesai') +
    it('Tanpa revisi', pctTxt(r.pctFtr), r.revisi + ' kali revisi') +
    it('Penyelesaian', pctTxt(r.pctSelesai), r.selesai + ' dari ' + r.ditugaskan + ' ditugaskan') +
    it('Lewat batas', '<span style="color:' + (r.overdue ? 'var(--err-t)' : 'inherit') + '">' + r.overdue + '</span>', 'belum diperbaiki') +
    it('Rata-rata perbaikan', r.rataJam == null ? '-' : num(r.rataJam) + ' jam', 'sejak temuan dibuat') + '</div>';
}

        '<td class="num">' + kpiChip(r, d.target) + '</td><td class="num">' + r.ditugaskan + '</td><td class="num">' + r.selesai + (r.menunggu ? ' <span class="small muted">+' + r.menunggu + ' verif</span>' : '') + '</td>' +

async function openDetail(id) {
  openModal('Detail temuan', '<div class="spin"></div>');
  try {
    const t = await call('apiGetTemuan', S.token, id);
    renderDetail(t);
  } catch (e) { $('#sheet').innerHTML = emptyBox(e.message); }
}
function renderDetailInModal(t) { openModal('Detail temuan', ''); renderDetail(t); }
function renderDetail(t) {
  const me = S.user.nik.toLowerCase();
  const isPic = t.picNik.toLowerCase() === me;
  const role = S.user.role;
  const ph = (fid, cap) => '<div class="ph"><span class="cap">' + cap + '</span>' + (fid ? '<img src="' + thumbUrl(fid, 800) + '" data-fid="' + esc(fid) + '" onerror="fotoFallback(this)" onclick="window.open(\'' + viewUrl(fid) + '\',\'_blank\')" alt="' + cap + '">' : '<span class="small muted">Belum ada</span>') + '</div>';
  let h = '<div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' + statusChip(t) + rChip(t.r) + tingkatChip(t.tingkat) + (t.berulang ? '<span class="chip nodot c-err">Berulang</span>' : '') + (t.mandiri ? '<span class="chip nodot c-ok">Lapor mandiri</span>' : '') + '</div>' +
    '<div class="photos">' + ph(t.fotoBefore, 'Sebelum') + ph(t.fotoAfter, 'Sesudah') + '</div>' +
    '<dl class="kv"><dt>ID</dt><dd><b>' + esc(t.id) + '</b></dd>' +
    '<dt>Area</dt><dd>' + esc(t.area) + (t.lokasi ? ' · ' + esc(t.lokasi) : '') + '</dd>' +
    '<dt>Tim</dt><dd><b>' + esc(t.tim) + '</b></dd>' +
    '<dt>Temuan</dt><dd>' + esc(t.deskripsi) + '</dd>' +
    '<dt>PIC</dt><dd>' + esc(t.pic) + '</dd>' +
    '<dt>Batas waktu</dt><dd>' + fDate(t.deadline) + ' <span class="small muted">(' + esc(sisa(t)) + ')</span></dd>' +
    '<dt>Potongan tim</dt><dd>' + signed(t.poinArea) + '</dd>' +
    (t.poinPic != null ? '<dt>Poin perbaikan</dt><dd><b>' + signed(t.poinPic) + '</b> untuk Tim ' + esc(t.tim) + '</dd>' : '') + '</dl>' +
    '<div class="timeline">' +
    '<div><b>Dilaporkan</b> oleh ' + esc(t.pelapor) + (t.timPelapor ? ' (Tim ' + esc(t.timPelapor) + ')' : '') + '<br><span class="small muted">' + fDate(t.tanggal) + '</span></div>' +
    (t.tglPerbaikan ? '<div><b>Perbaikan dikirim</b>' + (t.catatanPerbaikan ? ': ' + esc(t.catatanPerbaikan) : '') + '<br><span class="small muted">' + fDate(t.tglPerbaikan) + '</span></div>' : '') +
    (t.tglVerifikasi ? '<div><b>' + (t.status === 'Closed' ? 'Disetujui' : t.status === 'Batal' ? 'Dibatalkan' : 'Ditolak') + '</b> oleh ' + esc(t.verifikator) + (t.catatanVerifikasi ? ': ' + esc(t.catatanVerifikasi) : '') + '<br><span class="small muted">' + fDate(t.tglVerifikasi) + (t.revisi ? ' · revisi ke-' + t.revisi : '') + '</span></div>' : '') +
    '</div>';

  // Aksi PIC
  if ((isPic || role === 'Admin') && (t.status === 'Open' || t.status === 'Revisi') && role !== 'Viewer') {
    h += '<div class="card" style="margin-top:12px;background:var(--surface-2)"><h3>Kirim perbaikan</h3>' +
      (t.status === 'Revisi' ? '<div class="note warn" style="margin-bottom:10px">Ditolak: ' + esc(t.catatanVerifikasi) + '</div>' : '') +
      '<div class="field">' + photoPicker('pFoto', 'Ambil foto sesudah perbaikan') + '</div>' +
      '<div class="field"><label for="pCat">Catatan perbaikan</label><textarea class="inp" id="pCat" placeholder="Apa yang sudah dilakukan"></textarea></div>' +
      '<button class="btn primary block" id="pSend">Kirim untuk verifikasi</button>' +
      (isPic ? '<button class="btn ghost block" id="kAju" style="margin-top:8px">Temuan tidak valid? Ajukan keberatan</button>' : '') + '</div>';
  }
  // Keberatan PIC
  if (t.status === 'Keberatan') {
    h += '<div class="card" style="margin-top:12px;background:var(--surface-2)"><h3>Keberatan PIC</h3>' +
      '<div class="note" style="margin-bottom:10px">' + esc(t.catatanKeberatan) + '<div class="small" style="margin-top:4px">Diajukan ' + fDate(t.tglKeberatan) + ' · batas waktu dihentikan selama ditinjau</div></div>' +
      ((role === 'Admin' || role === 'Auditor') ? (isPic ? '<div class="note warn">Keberatan Anda sendiri harus diputuskan auditor lain.</div>' :
        '<div class="field"><label for="kCat">Catatan keputusan (wajib bila ditolak)</label><textarea class="inp" id="kCat"></textarea></div>' +
        '<div class="grid g2"><button class="btn" id="kNo">Tolak, lanjut perbaikan</button><button class="btn danger" id="kYes">Terima, batalkan temuan</button></div>' +
        '<p class="small muted" style="margin:8px 0 0">Diterima: temuan batal dan semua poinnya dikembalikan. Ditolak: kembali ke PIC, batas waktu diperpanjang sebesar lama peninjauan.</p>') : '<div class="small muted">Menunggu keputusan auditor.</div>') + '</div>';
  }
  // Aksi Auditor
  if ((role === 'Admin' || role === 'Auditor') && t.status === 'Menunggu Verifikasi') {
    h += '<div class="card" style="margin-top:12px;background:var(--surface-2)"><h3>Verifikasi perbaikan</h3>' +
      (isPic ? '<div class="note warn">Anda PIC temuan ini, jadi verifikasi harus dilakukan auditor lain.</div>' :
        '<div class="field"><label for="vCat">Catatan (wajib bila ditolak)</label><textarea class="inp" id="vCat"></textarea></div>' +
        '<div class="grid g2"><button class="btn danger" id="vNo">Tolak, perbaiki lagi</button><button class="btn ok" id="vYes">Setujui &amp; tutup</button></div>') + '</div>';
  }

    let foto = '';
    bindPhoto('pFoto', () => stampText(t.area) + ' · ' + t.id, d => { foto = d; });
    $('#pSend').onclick = async () => {
      if (!foto) return toast('Foto sesudah perbaikan wajib diambil.', true);
      const b = $('#pSend'); b.disabled = true; b.textContent = 'Mengirim…';
      try { const r = await call('apiSubmitPerbaikan', S.token, t.id, $('#pCat').value.trim(), foto); toast('Perbaikan terkirim, menunggu verifikasi'); renderDetail(r); afterChange(); }
      catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Kirim untuk verifikasi'; }
    };
  }
  if ($('#kAju')) $('#kAju').onclick = () => {
    openModal('Keberatan ' + t.id,
      '<div class="note" style="margin-bottom:12px">Ajukan bila temuan ini salah (bukan area/tanggung jawab Anda, kondisi sudah sesuai standar, atau ganda). Auditor akan memutuskan; selama ditinjau batas waktu dihentikan.</div>' +
      '<div class="field"><label for="kAlasan">Alasan keberatan</label><textarea class="inp" id="kAlasan"></textarea></div>' +

    $('#kBack').onclick = () => renderDetailInModal(t);
    $('#kGo').onclick = async () => {
      const alasan = $('#kAlasan').value.trim();
      if (!alasan) return toast('Tulis alasan keberatan.', true);
      $('#kGo').disabled = true;
      try { const r = await call('apiKeberatan', S.token, t.id, alasan); toast('Keberatan terkirim ke auditor'); renderDetailInModal(r); afterChange(); }
      catch (e) { toast(e.message, true); $('#kGo').disabled = false; }
    };
  };
  const putus = async (terima) => {
    const cat = $('#kCat').value.trim();
    if (!terima && !cat) return toast('Tulis alasan keberatan ditolak.', true);
    $$('#kYes,#kNo').forEach(b => b.disabled = true);
    try { const r = await call('apiPutusKeberatan', S.token, t.id, terima, cat); toast(terima ? 'Keberatan diterima, temuan dibatalkan' : 'Keberatan ditolak, kembali ke PIC'); renderDetail(r); afterChange(); }
    catch (e) { toast(e.message, true); $$('#kYes,#kNo').forEach(b => b.disabled = false); }
  };
  if ($('#kYes')) { $('#kYes').onclick = () => putus(true); $('#kNo').onclick = () => putus(false); }
  const verif = async (ok) => {
    const cat = $('#vCat').value.trim();
    if (!ok && !cat) return toast('Tulis alasan penolakan.', true);
    $$('#vYes,#vNo').forEach(b => b.disabled = true);
    try { const r = await call('apiVerifikasi', S.token, t.id, ok, cat); toast(ok ? 'Disetujui. Tim ' + r.tim + ' ' + signed(r.poinPic) + ' poin' : 'Dikembalikan ke PIC'); renderDetail(r); afterChange(); }
    catch (e) { toast(e.message, true); $$('#vYes,#vNo').forEach(b => b.disabled = false); }
  };
  if ($('#vYes')) { $('#vYes').onclick = () => verif(true); $('#vNo').onclick = () => verif(false); }
  if ($('#dCancel')) $('#dCancel').onclick = () => {
    openModal('Batalkan ' + t.id,
      '<div class="note warn" style="margin-bottom:12px">Pakai bila temuan salah input atau ganda. Semua poin dari temuan ini akan dikembalikan.</div>' +
      '<div class="field"><label for="bAlasan">Alasan pembatalan</label><textarea class="inp" id="bAlasan"></textarea></div>' +
      '<div class="grid g2"><button class="btn" id="bBack">Kembali</button><button class="btn danger" id="bGo">Batalkan temuan</button></div>');
    $('#bBack').onclick = () => renderDetailInModal(t);
    $('#bGo').onclick = async () => {
      const alasan = $('#bAlasan').value.trim();
      if (!alasan) return toast('Alasan wajib diisi.', true);
      $('#bGo').disabled = true;
      try { const r = await call('apiBatalkanTemuan', S.token, t.id, alasan); toast('Temuan dibatalkan, poin dikembalikan'); renderDetailInModal(r); afterChange(); }
      catch (e) { toast(e.message, true); $('#bGo').disabled = false; }
    };
  };
}

      h += '<div class="note" id="aSum" style="margin:12px 0"></div><div class="field"><label for="aCat">Catatan audit</label><textarea class="inp" id="aCat"></textarea></div>' +
        '<div class="small muted" style="margin-bottom:10px">Ada kondisi yang perlu diperbaiki? Buat juga lewat <a href="#" onclick="go(\'input\');return false">Input Temuan</a> supaya ada PIC dan batas waktunya.</div>' +
        '<button class="btn primary block" id="aSave">Simpan audit</button>';
      $('#aItems').innerHTML = items.length ? h : emptyBox('Checklist area ini kosong. Tambahkan di Master Data → Checklist audit.');
      $$('#aItems .seg').forEach(sg => sg.addEventListener('click', ev => {
        const b = ev.target.closest('button'); if (!b) return;
        $$('button', sg).forEach(x => x.classList.remove('on')); b.classList.add('on');
        items[+sg.dataset.i].skor = +b.dataset.s; summary();
      }));
      if (items.length) { summary(); $('#aSave').onclick = async () => {
        if (items.some(i => !i.skor)) return toast('Beri skor untuk semua item.', true);
        const b = $('#aSave'); b.disabled = true; b.textContent = 'Menyimpan…';
        try { const r = await call('apiSaveAudit', S.token, { areaId: id, items: items, catatan: $('#aCat').value.trim() }); toast('Audit tersimpan · ' + num(r.total) + '%'); $('#aArea').value = ''; $('#aItems').innerHTML = ''; hist(); }
        catch (err) { toast(err.message, true); b.disabled = false; b.textContent = 'Simpan audit'; }
      }; }
    } catch (err) { $('#aItems').innerHTML = emptyBox(err.message); }
  });
  hist();
};

/* =====================================================================
 *  VIEW: PAPAN POIN
 * ===================================================================== */
VIEWS.poin = async function () {
  const v = $('#view');
  const c = S.boot.config;
  v.innerHTML = '<div class="toolbar">' + monthInput('pBulan', S.bulan) + '</div>' +
    '<div class="tabs" id="pTabs"><button class="on" data-t="tim">Peringkat tim</button><button data-t="pic">Kontributor</button><button data-t="log">Riwayat poin</button></div><div id="pBody"></div>' +
    '<div class="note small" style="margin-top:12px"><b>Cara hitung skor tim:</b> setiap tim mulai ' + c.skorAwal + ' tiap bulan. ' +
    'Temuan di area tim dipotong ' + S.boot.tingkat.map(x => x + ' −' + c.potong[x]).join(', ') + ' (berulang ×' + c.faktorBerulang + ', lapor mandiri ×' + c.faktorMandiri + '). ' +
    'Perbaikan yang disetujui tepat waktu mengembalikan +' + c.poinTepat + ' (Kritis +' + c.poinTepatKritis + ', bonus cepat +' + c.bonusCepat + '); terlambat −' + c.potongTelat + ' per hari (temuan yang lewat batas dan belum diperbaiki juga dipotong per hari berjalan). Setiap revisi −' + c.potongRevisi + ' untuk tim & PIC.' +
    (c.poinPelapor ? ' Tim pelapor dapat +' + c.poinPelapor + ' per temuan valid di area tim lain.' : '') + '</div>';
  $('#pBulan').addEventListener('change', e => { if (e.target.value) { S.bulan = e.target.value; VIEWS.poin(); } });
  let tab = 'tim', data = null;
  const PB = $('#pBody');
  const rank = i => '<span class="rank ' + (i < 3 ? 'r' + (i + 1) : '') + '">' + (i + 1) + '</span>';
  const draw = () => {
    if (!data) return;
    let h = '';
    if (tab === 'tim') {
      const showPel = data.tims.some(t => t.pelapor);
      h = '<div class="tbl-wrap"><table class="tbl"><tr><th>#</th><th>Tim</th><th class="num">Skor</th><th class="num">Potongan</th><th class="num">Perbaikan</th>' + (showPel ? '<th class="num">Pelapor</th>' : '') +
        '<th class="num">Temuan diterima</th><th class="num">Belum selesai</th><th class="num">Melapor tim lain</th><th class="num">Audit</th></tr>' +
        data.tims.map((t, i) => '<tr><td>' + rank(i) + '</td><td><b>' + esc(t.tim) + '</b>' + (t.areas.join('') !== t.tim ? '<div class="small muted">' + esc(t.areas.join(', ')) + '</div>' : '') + '</td>' +
          '<td class="num"><b>' + num(t.skor) + '</b></td><td class="num">' + signed(t.potongan) + '</td><td class="num">' + signed(t.perbaikan) + '</td>' + (showPel ? '<td class="num">' + signed(t.pelapor) + '</td>' : '') +
          '<td class="num">' + t.temuan + (t.berulang ? ' <span class="chip nodot c-err">' + t.berulang + ' berulang</span>' : '') + '</td>' +
          '<td class="num">' + (t.aktif ? '<span class="chip c-warn">' + t.aktif + '</span>' : '0') + '</td><td class="num">' + t.dilaporkan + '</td>' +
          '<td class="num">' + (t.audit == null ? '-' : num(t.audit) + '% (' + t.auditN + 'x)') + '</td></tr>').join('') + '</table></div>';
    } else if (tab === 'pic') {
      h = data.pics.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>#</th><th>Nama</th><th>Tim</th><th class="num">Poin untuk tim</th><th class="num">Tepat waktu</th><th class="num">Terlambat</th><th class="num">Revisi</th><th class="num">Belum selesai &amp; lewat batas</th></tr>' +
        data.pics.map((p, i) => '<tr><td>' + rank(i) + '</td><td><b>' + esc(p.nama) + '</b><div class="small muted">' + esc(p.nik) + '</div></td><td>' + esc(p.tim || '-') + '</td><td class="num"><b>' + signed(p.poin) + '</b></td><td class="num">' + p.tepat + '</td><td class="num">' + p.telat + '</td><td class="num">' + p.revisi + '</td><td class="num">' + (p.overdue ? '<span class="chip c-err">' + p.overdue + '</span>' : '0') + '</td></tr>').join('') + '</table></div>' +
        '<p class="small muted">Poin di sini sudah termasuk dalam skor tim. Dipakai untuk melihat siapa yang paling aktif memperbaiki.</p>' : emptyBox('Belum ada perbaikan yang disetujui bulan ini');
    } else {
      h = data.riwayat.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Waktu</th><th>Jenis</th><th>Tim / nama</th><th class="num">Poin</th><th>Temuan</th><th>Keterangan</th></tr>' +
        data.riwayat.map(r => '<tr><td>' + fDate(r.ts) + '</td><td><span class="chip nodot ' + (r.jenis === 'TIM' ? 'c-pri' : 'c-neu') + '">' + (r.jenis === 'TIM' ? 'Skor tim' : 'Kontribusi') + '</span></td><td>' + esc(r.nama) + '</td><td class="num"><b>' + signed(r.poin) + '</b></td><td><a href="#" onclick="openDetail(\'' + esc(r.temuanId) + '\');return false">' + esc(r.temuanId) + '</a></td><td>' + esc(r.ket) + '</td></tr>').join('') + '</table></div>' : emptyBox('Belum ada riwayat poin');
    }
    PB.innerHTML = h;
  };
  $$('#pTabs button').forEach(b => b.addEventListener('click', () => { $$('#pTabs button').forEach(x => x.classList.remove('on')); b.classList.add('on'); tab = b.dataset.t; draw(); }));
  loading(PB);
  try { data = await call('apiLeaderboard', S.token, S.bulan); draw(); } catch (e) { PB.innerHTML = emptyBox(e.message); }
};

/* =====================================================================
 *  VIEW: MASTER DATA (Admin)
 * ===================================================================== */
VIEWS.admin = async function () {
  const v = $('#view');
  v.innerHTML = '<div class="tabs" id="mTabs"><button class="on" data-t="user">Pengguna</button><button data-t="area">Area &amp; PIC</button><button data-t="cek">Checklist audit</button><button data-t="cfg">Aturan poin</button></div><div id="mBody"></div>';
  let tab = 'user', D = null;
  const MB = $('#mBody');
  const load = async () => { loading(MB); D = await call('apiAdminData', S.token); draw(); };
  const areaName = id => { const a = D.areas.find(x => x.id === id); return a ? a.nama : '-'; };
  const draw = () => {
    let h = '';
    if (tab === 'user') {
      h = '<div class="toolbar"><input class="inp grow" id="uQ" placeholder="Cari nama / username / tim"><button class="btn" id="uImp">' + ic('list') + 'Atur tim dari Excel</button><a class="btn primary" href="' + esc(HOME_URL) + 'pengaturan">' + ic('plus') + 'Tambah akun di HRIS</a></div>' +
        '<div class="tbl-wrap"><table class="tbl" id="uTbl"><tr><th>Username</th><th>Nama</th><th>Role 5R</th><th>PIC</th><th>Tim</th><th>Area utama</th><th>Status</th><th></th></tr>' +
        D.users.map((u, i) => '<tr data-q="' + esc((u.nik + ' ' + u.nama + ' ' + (u.tim || '')).toLowerCase()) + '"><td>' + esc(u.nik) + '</td><td>' + esc(u.nama) + '</td><td>' + esc(u.role) + (u.custom ? '' : ' <span class="small muted">(ikut HRIS)</span>') + '</td><td>' + (u.pic ? '<span class="chip c-pri">PIC</span>' : (u.role === 'PIC' && u.employer && u.employer !== 'IEG' ? '<span class="small muted">' + esc(u.employer) + '</span>' : '-')) + '</td><td>' + esc(u.tim || '-') + '</td><td>' + esc(areaName(u.areaId)) + '</td><td>' + (u.aktif ? '<span class="chip c-ok">Aktif</span>' : '<span class="chip c-neu">Nonaktif</span>') + '</td><td><button class="btn sm" data-u="' + i + '">Ubah</button></td></tr>').join('') + '</table></div>' +
        '<p class="small muted"><b>PIC perbaikan hanya Leader / PIC IEG</b> (role Leader / PIC di HRIS, atau role 5R PIC); user yang tertaut ke operator RKA tidak bisa menjadi PIC. KPI dihitung per PIC. Semua pengguna dengan role PIC, Auditor, atau Admin bisa membuat temuan di area tim mana pun. Tim pengguna menentukan apakah laporannya dihitung lapor mandiri atau temuan dari tim lain.</p>' +
        '<p class="small muted">Akun &amp; password memakai akun HRIS. Role 5R bawaan mengikuti role HRIS: Admin → Admin, Supervisor → Auditor, Leader → PIC, Viewer → Viewer.</p>';
    } else if (tab === 'area') {
      const timList = Array.from(new Set(D.areas.map(a => a.tim))).sort();
      h = '<datalist id="dlTim">' + timList.map(t => '<option value="' + esc(t) + '">').join('') + '</datalist>' +
        '<div class="tbl-wrap"><table class="tbl" style="min-width:760px"><tr><th>Kode</th><th>Nama area</th><th>Tim</th><th>PIC area</th><th>Aktif</th><th></th></tr>' +
        D.areas.map((a, i) => '<tr><td>' + esc(a.id) + '</td><td><input class="inp" data-an="' + i + '" value="' + esc(a.nama) + '"></td><td><input class="inp" list="dlTim" data-at="' + i + '" value="' + esc(a.tim) + '"></td><td><select class="inp" data-ap="' + i + '"><option value="">— belum ada —</option>' +
          D.users.filter(u => u.pic).map(u => '<option value="' + esc(u.nik) + '"' + (u.nik === a.picNik ? ' selected' : '') + '>' + esc(u.nama) + '</option>').join('') + '</select></td><td><input type="checkbox" data-aa="' + i + '"' + (a.aktif ? ' checked' : '') + ' style="width:20px;height:20px;accent-color:var(--primary)"></td><td><button class="btn sm" data-as="' + i + '">Simpan</button></td></tr>').join('') + '</table></div>' +
        '<div class="toolbar" style="margin-top:12px"><input class="inp" id="naId" placeholder="Kode (A10)" style="max-width:120px"><input class="inp grow" id="naNama" placeholder="Nama area baru"><button class="btn" id="naAdd">' + ic('plus') + 'Tambah area</button></div>' +
        '<p class="small muted">Satu tim boleh memegang beberapa area: tulis nama tim yang sama (mis. "Retur" untuk Gudang Retur Ekspedisi dan Meja Kerja Retur). Skor dihitung per tim. Area baru otomatis mendapat checklist umum 5R; ubah itemnya di tab <b>Checklist audit</b>.</p>';
    } else if (tab === 'cek') {
      const aid = S.cekArea && D.areas.some(a => a.id === S.cekArea) ? S.cekArea : (D.areas[0] ? D.areas[0].id : '');
      S.cekArea = aid;
      const list = (D.checklist && D.checklist[aid]) || [];
      h = '<div class="card"><div class="toolbar"><select class="inp grow" id="ckArea">' + D.areas.map(a => '<option value="' + esc(a.id) + '"' + (a.id === aid ? ' selected' : '') + '>' + esc(a.id + ' · ' + a.nama) + '</option>').join('') + '</select></div>' +
        '<p class="small muted" style="margin-top:0">Satu baris satu item, format <b>Kategori | Item</b>. Kategori: ' + S.boot.rList.join(', ') + '.</p>' +
        '<textarea class="inp" id="ckTxt" style="min-height:260px;font-family:ui-monospace,monospace;font-size:12.5px">' + esc(list.map(c => c.r + ' | ' + c.item).join('\n')) + '</textarea>' +
        '<div class="small muted" id="ckInfo" style="margin:8px 0 12px">' + list.length + ' item</div><button class="btn primary" id="ckSave">Simpan checklist</button></div>';
    } else {
      h = '<div class="card"><div class="grid g2">' + D.config.map((c, i) => '<div class="field"><label for="cf' + i + '">' + esc(c.key) + '</label><input class="inp tnum" id="cf' + i + '" data-k="' + esc(c.key) + '" type="number" step="0.1" min="0" value="' + esc(c.value) + '"><span class="hint">' + esc(c.ket) + '</span></div>').join('') + '</div>' +
        '<button class="btn primary" id="cfSave">Simpan aturan</button></div>';
    }
    MB.innerHTML = h;
    if (tab === 'user') {
      $('#uImp').onclick = importForm;
      $$('[data-u]').forEach(b => b.onclick = () => userForm(D.users[+b.dataset.u]));
      $('#uQ').oninput = e => { const q = e.target.value.toLowerCase(); $$('#uTbl tr[data-q]').forEach(r => r.hidden = r.dataset.q.indexOf(q) < 0); };
    } else if (tab === 'area') {
      $$('[data-as]').forEach(b => b.onclick = async () => {
        const i = +b.dataset.as, a = D.areas[i];
        try { await call('apiSaveArea', S.token, { id: a.id, nama: $('[data-an="' + i + '"]').value.trim(), tim: $('[data-at="' + i + '"]').value.trim(), picNik: $('[data-ap="' + i + '"]').value, aktif: $('[data-aa="' + i + '"]').checked }); toast('Area ' + a.id + ' disimpan'); S.boot = await call('apiBootstrap', S.token); load(); }
        catch (e) { toast(e.message, true); }
      });
      $('#naAdd').onclick = async () => {
        try { await call('apiSaveArea', S.token, { id: $('#naId').value.trim(), nama: $('#naNama').value.trim() }); toast('Area ditambahkan'); S.boot = await call('apiBootstrap', S.token); load(); }
        catch (e) { toast(e.message, true); }
      };
    } else if (tab === 'cek') {
      const parseCk = () => $('#ckTxt').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
        const i = l.indexOf('|');
        return i < 0 ? { r: '', item: l } : { r: l.slice(0, i).trim(), item: l.slice(i + 1).trim() };
      });
      $('#ckArea').onchange = e => { S.cekArea = e.target.value; draw(); };
      $('#ckTxt').oninput = () => { $('#ckInfo').textContent = parseCk().length + ' item'; };
      $('#ckSave').onclick = async () => {
        const rows = parseCk().map(x => ({ r: (S.boot.rList.find(r => r.toLowerCase() === x.r.toLowerCase()) || x.r), item: x.item }));
        try { const r = await call('apiSaveChecklist', S.token, S.cekArea, rows); if (!D.checklist || Array.isArray(D.checklist)) D.checklist = {}; D.checklist[S.cekArea] = r; toast('Checklist ' + S.cekArea + ' disimpan (' + r.length + ' item)'); draw(); }
        catch (e) { toast(e.message, true); }
      };
    } else {
      $('#cfSave').onclick = async () => {
        try { await call('apiSaveConfig', S.token, $$('[data-k]').map(x => ({ key: x.dataset.k, value: x.value }))); toast('Aturan disimpan'); S.boot = await call('apiBootstrap', S.token); }
        catch (e) { toast(e.message, true); }
      };
    }
  };
  const userForm = (u) => {
    const ikut = 'Ikuti role HRIS (' + (HRIS_ROLE[u.hrisRole] || u.hrisRole) + ')';
    openModal('Atur pengguna 5R',
      '<div class="grid g2"><div class="field"><label>Username</label><input class="inp" value="' + esc(u.nik) + '" disabled></div>' +
      '<div class="field"><label>Nama</label><input class="inp" value="' + esc(u.nama) + '" disabled></div></div>' +
      '<div class="grid g2"><div class="field"><label for="fRole">Role 5R</label><select class="inp" id="fRole"><option value="">' + esc(ikut) + '</option>' + S.boot.roles.map(r => '<option' + (u.custom && u.role === r ? ' selected' : '') + '>' + r + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="fArea">Tim / area utama</label><select class="inp" id="fArea"><option value="">— tidak ada —</option>' + D.areas.map(a => '<option value="' + esc(a.id) + '"' + (u.areaId === a.id ? ' selected' : '') + '>' + esc(a.tim === a.nama ? a.nama : a.tim + ' — ' + a.nama) + '</option>').join('') + '</select></div></div>' +
      '<label class="chk" style="margin-bottom:14px"><input type="checkbox" id="fAktif"' + (u.aktif ? ' checked' : '') + '><span>Aktif di Monitoring 5R</span></label>' +
      '<p class="small muted">Admin: semua menu · Auditor: input temuan, verifikasi, audit · PIC: input temuan di area mana pun &amp; kirim perbaikan · Viewer: lihat saja. Nama &amp; password diubah di HRIS.</p>' +
      '<button class="btn primary block" id="fSave">Simpan</button>');
    $('#fSave').onclick = async () => {
      try {
        await call('apiSaveUser', S.token, { nik: u.nik, role: $('#fRole').value, areaId: $('#fArea').value, aktif: $('#fAktif').checked });
        closeModal(); toast('Pengguna disimpan'); S.boot = await call('apiBootstrap', S.token); load();
      } catch (e) { toast(e.message, true); }
    };
  };
  const importForm = () => {
    openModal('Atur tim pengguna',
      '<p class="small muted" style="margin-top:0">Salin dari Excel lalu tempel di bawah. Satu baris satu orang, kolom: <b>Username HRIS</b> · <b>Kode/nama area atau tim</b> · <b>Role 5R</b> (boleh kosong = ikut role HRIS). Akun harus sudah ada di HRIS.</p>' +
      '<textarea class="inp" id="impTxt" style="min-height:200px;font-family:ui-monospace,monospace;font-size:12.5px" placeholder="budi	Gudang Besar	PIC&#10;sari	A06	Auditor"></textarea>' +
      '<div class="small muted" id="impInfo" style="margin:8px 0 12px">0 baris</div><button class="btn primary block" id="impGo">Import</button>');
    const parse = () => $('#impTxt').value.split(/\r?\n/).map(l => l.split(/\t|;|,/).map(x => x.trim())).filter(r => r.join('') !== '');
    $('#impTxt').oninput = () => { $('#impInfo').textContent = parse().length + ' baris siap diimport'; };
    $('#impGo').onclick = async () => {
      const rows = parse(); if (!rows.length) return toast('Belum ada data.', true);
      if (/^(nik|username|user)$/i.test(rows[0][0])) rows.shift();
      const b = $('#impGo'); b.disabled = true; b.textContent = 'Mengimport…';
      try {
        const r = await call('apiImportUsers', S.token, rows);
        $('#impInfo').innerHTML = '<b>' + r.diubah + '</b> pengguna diperbarui' + (r.gagal.length ? '<br><span style="color:var(--err-t)">' + r.gagal.map(esc).join('<br>') + '</span>' : '');
        S.boot = await call('apiBootstrap', S.token); load();
        toast('Import selesai');
      } catch (e) { toast(e.message, true); }
      b.disabled = false; b.textContent = 'Import';
    };
  };
  $$('#mTabs button').forEach(b => b.addEventListener('click', () => { $$('#mTabs button').forEach(x => x.classList.remove('on')); b.classList.add('on'); tab = b.dataset.t; if (D) draw(); }));
  try { await load(); } catch (e) { MB.innerHTML = emptyBox(e.message); }
};

};
