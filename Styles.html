        color: var(--text-3);
        font-size: 11.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .batch-op-curr {
        flex: none;
    }

    .days-pick {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .days-pick label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: var(--r);
        min-height: 32px;
        padding: 0 10px;
        cursor: pointer;
        font-size: 12.5px;
    }

    @media (hover: hover) {
        .days-pick label:hover {
            background: var(--surface-2);
        }
    }

    .bagrow-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .bagrow-btn {
        min-height: 26px;
        padding: 0 10px;
        font-size: 11.5px;
        border-radius: var(--r-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--primary);
        font-weight: 600;
        cursor: pointer;
    }

    /* ---------------------------------------------------------------- 8 Request OS & WhatsApp */
    .order-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
    }

    .order-grid > div {
        min-width: 0;
    }

    @media (min-width: 1000px) {
        .order-grid {
            grid-template-columns: minmax(0, 1fr) minmax(340px, 440px);
        }

        #odRight {
            position: sticky;
            top: 76px;
            align-self: start;
        }
    }

    .od-top {
        align-items: flex-end;
    }

    .od-card-stat {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px 16px;
        padding: 12px 16px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        margin-bottom: 12px;
    }

    .od-stat-item,
    .od-stat-main {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .od-stat-label,
    .od-stat-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
    }

    .od-stat-input-wrap,
    .od-stat-control {
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .od-stat-input {
        width: 80px !important;
        min-height: 36px;
        padding: 0 10px;
        font-size: 18px;
        font-weight: 700;
        text-align: center;
    }

    .od-stat-unit {
        font-size: 13px;
        color: var(--text-2);
    }

    .od-stat-divider {
        width: 1px;
        align-self: stretch;
        background: var(--border);
    }

    .od-stat-status {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
    }

    .od-stat-status.ok {
        color: var(--ok);
    }

    .od-stat-status.warn {
        color: var(--warn);
    }

    .od-stat-status.err {
        color: var(--err);
    }

    .od-search-bar {
        position: relative;
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }

    .od-search-bar .od-search-ico,
    .od-search-bar .od-search-icon {
        position: absolute;
        left: 11px;
        color: var(--text-3);
        font-size: 18px;
        pointer-events: none;
    }

    .od-search-bar input {
        width: 100%;
        padding-left: 36px;
        min-height: 36px;
    }

    .od-date-picker-box {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 10px 12px;
        margin-bottom: 12px;
    }

    .od-week-pills {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
    }

    .status-line {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 0 0 12px;
    }

    .jam-sel {
        width: auto;
        min-height: 30px;
        padding: 2px 8px;
        font-size: 12px;
    }

    /* Daftar pilih kandidat */
    .picks {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        overflow: hidden;
        background: var(--surface);
    }

    @media (min-width: 700px) {
        .picks {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (min-width: 1200px) {
        .picks {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
    }

    .picks.one {
        grid-template-columns: minmax(0, 1fr) !important;
        max-height: 58vh;
        overflow-y: auto;
        overflow-x: hidden;
    }

    .pick-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 2;
    }

    .pick-head-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
    }

    .pick-head-actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }

    .pick {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        background: var(--surface);
        box-shadow: inset 3px 0 0 transparent;
    }

    @media (hover: hover) {
        .pick:hover {
            background: var(--surface-2);
        }
    }

    .pick .grow {
        flex: 1;
        min-width: 0;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .pick input {
        flex: none;
    }

    .pick.is-picked {
        background: var(--primary-soft);
        box-shadow: inset 3px 0 0 var(--primary);
    }

    .pick.vacant-row {
        justify-content: space-between;
        gap: 8px;
        background: var(--surface-2);
        padding: 7px 12px;
    }

    .pick.vacant-row.is-picked {
        background: var(--warn-bg);
        box-shadow: inset 3px 0 0 var(--warn);
    }

    .vac-check-label {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        cursor: pointer;
        margin: 0;
    }

    .vac-label-text {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--warn);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .vac-qty-box {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 2px;
        flex-shrink: 0;
        margin-left: auto;
    }

    .pick.vacant-row.is-picked .vac-qty-box {
        border-color: var(--warn-line);
    }

    .vac-qty-btn {
        width: 28px;
        height: 28px;
        min-height: 28px;
        border-radius: var(--r-sm);
        border: 0;
        background: transparent;
        color: var(--text-2);
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
    }

    @media (hover: hover) {
        .vac-qty-btn:hover:not(:disabled) {
            background: var(--surface-3);
            color: var(--text);
        }
    }

    .vac-qty-input {
        width: 38px !important;
        min-width: 38px;
        height: 26px;
        min-height: 26px !important;
        padding: 0 2px !important;
        text-align: center;
        font-size: 13.5px;
        font-weight: 700;
        border: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        -moz-appearance: textfield;
        flex-shrink: 0;
    }

    .vac-qty-input::-webkit-outer-spin-button,
    .vac-qty-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .more {
        margin-top: 10px;
    }

    .more > summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--primary);
        padding: 6px 0;
    }

    .more > .picks,
    .more > .wa-wrap {
        margin-top: 6px;
    }

    /* Persetujuan supervisor */
    .pending-approval-card {
        background: var(--warn-bg);
        border: 1px solid var(--warn-line);
        border-radius: var(--r-lg);
        padding: 12px 14px;
        margin-bottom: 16px;
    }

    .pending-approval-head {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--warn);
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .pending-approval-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .pending-approval-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 9px 12px;
    }

    .pending-approval-item.active {
        border-color: var(--primary);
        box-shadow: inset 3px 0 0 var(--primary);
    }

    .pending-approval-info {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 12.5px;
    }

    .pending-approval-info small {
        color: var(--text-2);
        font-size: 11.5px;
    }

    .approval-banner {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 14px;
        border-radius: var(--r-lg);
        margin-bottom: 12px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
    }

    .approval-banner .material-symbols-outlined {
        font-size: 20px;
        margin-top: 1px;
        flex-shrink: 0;
    }

    .approval-banner-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 12.5px;
    }

    .approval-banner-text small {
        font-size: 12px;
        opacity: .85;
    }

    .approval-banner.ok {
        background: var(--ok-bg);
        color: var(--ok);
        border-color: var(--ok-line);
    }

    .approval-banner.warn {
        background: var(--warn-bg);
        color: var(--warn);
        border-color: var(--warn-line);
    }

    .approval-banner.err {
        background: var(--err-bg);
        color: var(--err);
        border-color: var(--err-line);
    }

    .approval-banner.draft {
        color: var(--text-2);
    }

    .spv-approval-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        padding: 10px 14px;
        border-radius: var(--r-lg);
        background: var(--primary-soft);
        border: 1px solid var(--primary-line);
        margin-bottom: 12px;
    }

    .spv-approval-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        font-size: 13px;
        color: var(--primary);
    }

    /* Pratinjau WhatsApp */
    .wa-preview-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        margin-bottom: 16px;
        overflow: hidden;
    }

    .wa-preview-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        padding: 10px 14px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
    }

    .wa-preview-title {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
    }

    .wa-wrap {
        background: #EFEAE2;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    [data-theme="evening"] .wa-wrap {
        background: #0B141A;
    }

    .wa-bubble {
        background: #FFFFFF;
        color: #111B21;
        border-radius: 10px;
        border-top-left-radius: 2px;
        padding: 12px 14px;
        white-space: pre-wrap;
        font-size: 13.5px;
        line-height: 1.55;
        box-shadow: 0 1px 1px rgba(11, 20, 26, 0.12);
        max-width: 100%;
        word-break: break-word;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="evening"] .wa-bubble {
        background: #202C33;
        color: #E9EDEF;
    }

    .wa-bubble.stale {
        opacity: .6;
    }

    .wa-mention-pill {
        color: #027EB5;
        font-weight: 600;
        word-break: break-all;
    }

    [data-theme="evening"] .wa-mention-pill {
        color: #53BDEB;
    }

    .wa-tag-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 14px;
        margin-bottom: 16px;
    }

    .wa-tag-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
    }

    .wa-tag-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .wa-tag-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border-radius: var(--r);
        background: var(--surface-2);
    }

    .wa-tag-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: #FFFFFF;
        flex-shrink: 0;
        background: var(--text-3);
    }

    .wa-tag-avatar.pic {
        background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
    }

    .wa-tag-avatar.cc {
        background: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
    }

    .wa-tag-info {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
    }

    .wa-tag-nama {
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .wa-tag-note {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: var(--r);
        background: var(--surface-2);
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-2);
    }

    textarea.wa-edit {
        min-height: 320px;
        font-size: 13px;
    }

    /* Orang / nomor WA */
    .ppl {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .ppl-row {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 6px;
        align-items: center;
    }

    .ppl-row input {
        min-height: 36px;
    }

    @media (max-width: 520px) {
        .ppl-row {
            grid-template-columns: 64px minmax(0, 1fr) auto;
        }

        .ppl-row .ppl-w {
            grid-column: 2 / 3;
        }
    }

    pre.env {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 10px 12px;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 6px 0 8px;
        font-size: 12px;
    }

    /* ---------------------------------------------------------------- 9 Overlay */
    .modal {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: var(--overlay);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        animation: fade .18s ease;
    }

    .modal-card {
        width: 100%;
        max-width: 560px;
        max-height: 92vh;
        max-height: 92dvh;
        background: var(--surface);
        border-radius: 16px 16px 0 0;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-lg);
        animation: rise .22s var(--ease-out);
    }

    @media (min-width: 640px) {
        .modal {
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            border-radius: 14px;
            border: 1px solid var(--border);
        }
    }

    .modal-card.wide {
        max-width: 1100px;
    }

    .db-tbl td,
    .db-tbl th {
        white-space: nowrap;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 10px 20px;
        flex: none;
    }

    .modal-head [data-close] {
        flex: none;
    }

    .modal-head h3 {
        margin: 0;
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
    }

    .modal-body {
        padding: 6px 20px 16px;
        overflow-y: auto;
        flex: 1 1 auto;
        min-height: 0;
        overscroll-behavior: contain;
    }

    .modal-body > p:first-child {
        margin-top: 0;
    }

    .modal-foot {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 12px 20px 16px;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
    }

    .toasts {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 76px;
        z-index: 80;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: calc(100% - 32px);
        max-width: 420px;
        pointer-events: none;
    }

    @media (min-width: 768px) {
        .toasts {
            bottom: 24px;
        }
    }

    .toast {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: #1E1B4B;
        color: #FFFFFF;
        padding: 11px 14px;
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-lg);
        font-size: 13px;
        font-weight: 500;
        white-space: pre-line;
        pointer-events: auto;
        animation: rise .2s var(--ease-out);
    }

    .toast::before {
        content: "info";
        font-family: 'Material Symbols Outlined';
        font-size: 18px;
        line-height: 1.1;
        color: #9FB0FF;
        flex: none;
    }

    .toast.ok::before {
        content: "check_circle";
        color: #5AD69A;
    }

    .toast.err::before {
        content: "error";
        color: #FF8F84;
    }

    .toast.warn::before {
        content: "warning";
        color: #F5C46E;
    }

    [data-theme="evening"] .toast {
        background: #262B3D;
        border: 1px solid #343A50;
    }

    .loading {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--bg) 40%, transparent);
    }

    .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid var(--surface-3);
        border-top-color: var(--primary);
        animation: spin .7s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes rise {
        from {
            transform: translateY(12px);
            opacity: 0;
        }

        to {
            transform: none;
            opacity: 1;
        }
    }

    @keyframes pop {
        from {
            transform: scale(.97);
            opacity: 0;
        }

        to {
            transform: none;
            opacity: 1;
        }
    }

    @keyframes fade {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    /* ---------------------------------------------------------------- 9b Mobile (HP) */
    .check + .field,
    .check + .grid2 {
        margin-top: 10px;
    }

    @media (max-width: 767px) {
        .view {
            padding: 12px 12px 28px;
        }

        /* Toolbar: setiap baris terisi penuh & rata, bukan tombol berserakan */
        .toolbar {
            gap: 8px;
        }

        .toolbar > * {
            flex: 1 1 auto;
            min-width: 0;
        }

        .toolbar > .spacer {
            display: none;
        }

        .toolbar input[type="date"],
        .toolbar select,
        .toolbar input[type="search"],
        .toolbar input[type="text"] {
            flex: 1 1 140px;
            width: auto;
            min-width: 0;
        }

        .toolbar .seg {
            display: flex;
            flex-wrap: nowrap;
        }

        .toolbar .seg button {
            flex: 1 1 0;
            padding: 0 8px;
        }

        .toolbar .btn {
            flex: 1 1 calc(50% - 4px);
            justify-content: center;
        }

        /* Tombol ikon saja (panah sebelum/berikut, ditandai aria-label) tetap ringkas */
        .toolbar .btn[aria-label] {
            flex: 0 0 40px;
            padding: 0;
        }

        /* Tombol aksi yang di HP cukup ikon (teks tetap dibaca pembaca layar lewat aria-label) */
        .toolbar .btn.icon-only-m {
            flex: 0 0 44px;
            width: 44px;
            min-height: 44px;
            padding: 0;
            justify-content: center;
        }

        .toolbar .btn.icon-only-m .btn-txt {
            display: none;
        }

        .toolbar .btn.icon-only-m .material-symbols-outlined {
            font-size: 21px;
