<style>
    /* =====================================================================
       IEG Design System v4 — tata letak rapi dengan palet warna asli sistem
       (indigo #4F46E5 · violet · pink); status tetap hijau/kuning/merah.
       Tema: Morning (terang) & Evening (gelap).
       Urutan: 1 Token · 2 Dasar · 3 Kontrol · 4 Shell · 5 Konten
               6 Absensi · 7 Jadwal · 8 Request OS · 9 Overlay · 10 Utilitas
       ===================================================================== */

    /* ---------------------------------------------------------------- 1 Token */
    /* Palet warna asli sistem IEG (indigo · violet · pink) */
    :root,
    [data-theme="morning"] {
        --bg: #F8F9FE;
        --surface: #FFFFFF;
        --surface-2: #F1F4FA;
        --surface-3: #E8EEFB;
        --border: rgba(79, 70, 229, 0.12);
        --line: #E2E8F0;
        --line-strong: #CBD5E1;
        --text: #0F172A;
        --text-2: #475569;
        --text-3: #64748B;

        --primary: #4F46E5;
        --primary-hover: #4338CA;
        --primary-ink: #FFFFFF;
        --primary-soft: #EEF2FF;
        --primary-line: #C7D2FE;
        --accent: #0284C7;
        --violet: #7C3AED;
        --pink: #EC4899;
        --grad: linear-gradient(135deg, #4F46E5 0%, #7C3AED 55%, #EC4899 100%);
        --th-bg: linear-gradient(#F4F5FF, #F4F5FF);
        --th-text: #3730A3;

        --side-bg: linear-gradient(180deg, #0F172A 0%, #1E1B4B 55%, #172554 100%);
        --side-line: rgba(255, 255, 255, 0.08);
        --side-text: #C7D2FE;
        --side-muted: #94A3B8;
        --side-hover: rgba(255, 255, 255, 0.08);
        --side-active: linear-gradient(90deg, rgba(99, 102, 241, 0.45), rgba(236, 72, 153, 0.25));
        --side-indicator: #F472B6;

        --ok: #16A34A;
        --ok-bg: #DCFCE7;
        --ok-line: #86EFAC;
        --warn: #D97706;
        --warn-bg: #FEF3C7;
        --warn-line: #FCD34D;
        --err: #DC2626;
        --err-bg: #FEE2E2;
        --err-line: #FCA5A5;
        --info: #0284C7;
        --info-bg: #E0F2FE;
        --info-line: #7DD3FC;
        --off: #64748B;
        --off-bg: #F1F5F9;

        --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
        --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow: var(--shadow-sm);
        --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
        --shadow-lg: 0 12px 28px -4px rgba(30, 27, 75, 0.15), 0 4px 10px -2px rgba(30, 27, 75, 0.06);
        --focus: 0 0 0 3px rgba(79, 70, 229, 0.25);
        --scroll: #CBD5E1;
        --overlay: rgba(15, 23, 42, 0.55);

        --r-sm: 6px;
        --r: 8px;
        --r-lg: 12px;
        --ease-out: cubic-bezier(.23, 1, .32, 1);
        color-scheme: light;
    }

    [data-theme="evening"] {
        --bg: #0B0F19;
        --surface: #111827;
        --surface-2: #1F2937;
        --surface-3: #2B3548;
        --border: rgba(129, 140, 248, 0.18);
        --line: #374151;
        --line-strong: #4B5563;
        --text: #F8FAFC;
        --text-2: #94A3B8;
        --text-3: #8391A7;

        --primary: #818CF8;
        --primary-hover: #A5B4FC;
        --primary-ink: #0B0F19;
        --primary-soft: rgba(129, 140, 248, 0.15);
        --primary-line: rgba(129, 140, 248, 0.4);
        --accent: #38BDF8;
        --violet: #A78BFA;
        --pink: #F472B6;
        --grad: linear-gradient(135deg, #6366F1 0%, #8B5CF6 55%, #EC4899 100%);
        --th-bg: linear-gradient(rgba(99, 102, 241, 0.16), rgba(99, 102, 241, 0.16));
        --th-text: #C7D2FE;

        --side-bg: linear-gradient(180deg, #050811 0%, #0F172A 60%, #172554 100%);
        --side-text: #CBD5E1;
        --side-active: linear-gradient(90deg, rgba(99, 102, 241, 0.35), rgba(236, 72, 153, 0.22));

        --ok: #4ADE80;
        --ok-bg: rgba(34, 197, 94, 0.18);
        --ok-line: rgba(34, 197, 94, 0.4);
        --warn: #FBBF24;
        --warn-bg: rgba(245, 158, 11, 0.18);
        --warn-line: rgba(245, 158, 11, 0.4);
        --err: #F87171;
        --err-bg: rgba(239, 68, 68, 0.22);
        --err-line: rgba(239, 68, 68, 0.45);
        --info: #38BDF8;
        --info-bg: rgba(14, 165, 233, 0.18);
        --info-line: rgba(14, 165, 233, 0.4);
        --off: #94A3B8;
        --off-bg: rgba(148, 163, 184, 0.14);

        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.55);
        --focus: 0 0 0 3px rgba(129, 140, 248, 0.35);
        --scroll: #475569;
        --overlay: rgba(0, 0, 0, 0.6);
        color-scheme: dark;
    }

    /* ---------------------------------------------------------------- 2 Dasar */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        height: 100%;
    }

    body {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        font-feature-settings: "cv11", "ss01";
    }

    h1, h2, h3 {
        text-wrap: balance;
    }

    p {
        text-wrap: pretty;
    }

    button,
    input,
    select,
    textarea {
        font: inherit;
        color: inherit;
    }

    a {
        color: var(--primary);
    }

    code {
        font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
        font-size: .92em;
        background: var(--surface-3);
        padding: 1px 5px;
        border-radius: 4px;
    }

    .hidden {
        display: none !important;
    }

    .muted {
        color: var(--text-2);
    }

    .small {
        font-size: 12px;
    }

    .mono {
        font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    }

    .num,
    .val,
    .bag-num,
    .abs-kpi-val,
    input[type="number"] {
        font-variant-numeric: tabular-nums;
    }

    :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
        outline: none;
    }

    .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 20px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        text-transform: none;
        letter-spacing: normal;
        white-space: nowrap;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'liga';
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        user-select: none;
    }

    .btn .material-symbols-outlined {
        font-size: 18px;
        flex-shrink: 0;
    }

    .btn.sm .material-symbols-outlined,
    .btn.xs .material-symbols-outlined {
        font-size: 16px;
    }

    .chip .material-symbols-outlined {
        font-size: 14px;
    }

    * {
        scrollbar-width: thin;
        scrollbar-color: var(--scroll) transparent;
    }

    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    ::-webkit-scrollbar-thumb {
        background: var(--scroll);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    /* ---------------------------------------------------------------- 3 Kontrol */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        padding: 0 14px;
        border-radius: var(--r);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
        box-shadow: var(--shadow-xs);
        transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .12s var(--ease-out);
    }

    .btn:active:not(:disabled) {
        transform: scale(.97);
    }

    .btn:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-ink);
    }

    .btn.grad {
        background: var(--grad);
        border-color: transparent;
        color: #FFFFFF;
    }

    .btn.ghost {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
        color: var(--text-2);
    }

    .btn.danger {
        color: var(--err);
        border-color: var(--err-line);
        background: var(--err-bg);
        box-shadow: none;
    }

    .btn.ok {
        color: var(--ok);
        border-color: var(--ok-line);
        background: var(--ok-bg);
        box-shadow: none;
    }

    @media (hover: hover) {
        .btn:hover:not(:disabled) {
            background: var(--surface-2);
            border-color: var(--line-strong);
        }

        .btn.primary:hover:not(:disabled) {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn.grad:hover:not(:disabled) {
            background: var(--grad);
            border-color: transparent;
            filter: brightness(1.06);
        }

        .btn.ghost:hover:not(:disabled) {
            background: var(--surface-3);
            border-color: transparent;
            color: var(--text);
        }

        .btn.danger:hover:not(:disabled) {
            background: var(--err-bg);
            border-color: var(--err);
        }

        .btn.ok:hover:not(:disabled) {
            background: var(--ok-bg);
            border-color: var(--ok);
        }
    }

    .btn.sm {
        min-height: 32px;
        padding: 0 11px;
        font-size: 12.5px;
    }

    .btn.xs {
        min-height: 26px;
        height: 26px;
        padding: 0 9px;
        font-size: 12px;
        border-radius: var(--r-sm);
        gap: 4px;
    }

    .btn.lg {
        min-height: 44px;
        font-size: 14px;
        padding: 0 18px;
    }

    .btn.block {
        width: 100%;
    }

    .btn-wa {
        background: linear-gradient(135deg, #25D366 0%, #128C7E 100%) !important;
        border-color: transparent !important;
        color: #FFFFFF !important;
    }

    @media (hover: hover) {
        .btn-wa:hover:not(:disabled) {
            filter: brightness(1.08);
        }
    }

    .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: var(--r);
        border: 1px solid transparent;
        background: transparent;
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        color: var(--text-2);
        flex: none;
        transition: background-color .15s ease, color .15s ease;
    }

    .icon-btn .material-symbols-outlined {
        font-size: 20px;
    }

    @media (hover: hover) {
        .icon-btn:hover {
            background: var(--surface-3);
            color: var(--text);
        }
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
    }

    .field > span {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
    }

    .field small {
        color: var(--text-3);
        font-size: 12px;
    }

    input,
    select,
    textarea {
        width: 100%;
        min-height: 38px;
        padding: 8px 12px;
        border-radius: var(--r);
        border: 1px solid var(--border);
        background: var(--surface);
        outline: none;
        transition: border-color .15s ease, box-shadow .15s ease;
    }

    input::placeholder,
    textarea::placeholder {
        color: var(--text-3);
    }

    textarea {
        min-height: 110px;
        resize: vertical;
        line-height: 1.55;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: var(--primary);
        box-shadow: var(--focus);
    }

    input:disabled,
    select:disabled,
    textarea:disabled {
        background: var(--surface-2);
        color: var(--text-3);
        cursor: not-allowed;
    }

    input[type="checkbox"],
    input[type="radio"] {
        width: 16px;
        height: 16px;
        min-height: 0;
        padding: 0;
        accent-color: var(--primary);
        flex: none;
        cursor: pointer;
    }

    input[type="color"] {
        padding: 2px;
        cursor: pointer;
    }

    .check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        cursor: pointer;
        user-select: none;
    }

    .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
    }

    .row > .grow {
        flex: 1 1 160px;
    }

    .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0 12px;
    }

    @media (min-width: 560px) {
        .grid2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    .pw-wrap {
        position: relative;
    }

    .pw-eye {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        height: 34px;
        width: 34px;
        border: 0;
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: center;
        color: var(--text-3);
        border-radius: var(--r-sm);
    }

    .pw-eye .material-symbols-outlined {
        font-size: 19px;
    }

    @media (hover: hover) {
        .pw-eye:hover {
            color: var(--text);
        }
    }

    .seg {
        display: inline-flex;
        background: var(--surface-3);
        border-radius: var(--r);
        padding: 3px;
        gap: 2px;
        flex-wrap: wrap;
    }

    .seg button {
        border: 0;
        background: transparent;
        padding: 0 12px;
        min-height: 30px;
        border-radius: var(--r-sm);
        font-weight: 600;
        font-size: 12.5px;
        color: var(--text-2);
        cursor: pointer;
        white-space: nowrap;
    }

    .seg button.on {
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow-sm);
    }

    @media (hover: hover) {
        .seg button:not(.on):hover {
            color: var(--text);
        }
    }

    .seg.sm button {
        min-height: 26px;
        padding: 0 10px;
        font-size: 12px;
    }

    /* Chip / badge status */
    .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 9px;
        min-height: 22px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        background: var(--surface-3);
        color: var(--text-2);
        border: 1px solid transparent;
        line-height: 1.4;
    }

    .chip.xs {
        font-size: 11px;
        padding: 1px 7px;
        min-height: 20px;
    }

    .chip.sm {
        font-size: 11.5px;
        padding: 2px 8px;
    }

    .chip.ok {
        background: var(--ok-bg);
        color: var(--ok);
    }

    .chip.warn {
        background: var(--warn-bg);
        color: var(--warn);
    }

    .chip.err {
        background: var(--err-bg);
        color: var(--err);
    }

    .chip.info {
        background: var(--info-bg);
        color: var(--info);
    }

    .chip.pri {
        background: var(--primary-soft);
        color: var(--primary);
    }

    .chip.ghost {
        background: transparent;
        border-color: var(--border);
    }

    .chip.muted {
        background: var(--surface-2);
        color: var(--text-3);
    }

    .chip .x {
        border: 0;
        background: transparent;
        cursor: pointer;
        color: inherit;
        padding: 0 0 0 2px;
        display: inline-flex;
        opacity: .7;
    }

    .shift-now {
        background: var(--grad);
        border: 0;
        color: #FFFFFF;
        padding: 4px 12px;
        min-height: 30px;
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
    }

    .shift-pulse {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4ADE80;
        margin-right: 2px;
    }

    .alert {
        padding: 10px 14px;
        border-radius: var(--r);
        font-size: 13px;
        margin: 10px 0;
        white-space: pre-line;
        border: 1px solid transparent;
        line-height: 1.5;
    }

    .alert.err {
        background: var(--err-bg);
        color: var(--err);
        border-color: var(--err-line);
    }

    .alert.warn {
        background: var(--warn-bg);
        color: var(--warn);
        border-color: var(--warn-line);
    }

    .alert.info {
        background: var(--info-bg);
        color: var(--info);
        border-color: var(--info-line);
    }

    .alert.ok {
        background: var(--ok-bg);
        color: var(--ok);
        border-color: var(--ok-line);
    }

    .alert .material-symbols-outlined {
        font-size: 18px;
        margin-right: 4px;
    }

    /* ---------------------------------------------------------------- Login */
    .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
    }

    .login-bg-orb {
        display: none;
    }

    .login-card {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px 22px;
        box-shadow: var(--shadow-md);
    }

    .login-header {
        margin-bottom: 24px;
    }

    .login-logo-showcase {
        display: flex;
        margin-bottom: 20px;
    }

    .logo-mark {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        overflow: hidden;
        padding: 4px;
    }

    .logo-mark.sm {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        padding: 3px;
    }

    .logo-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    .login-badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-3);
        margin-bottom: 6px;
    }

    .login-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1.3;
        color: var(--text);
        margin: 0 0 6px;
    }

    .login-subtitle {
        font-size: 13px;
        color: var(--text-2);
        margin: 0;
    }

    .login-form .field {
        margin-bottom: 16px;
    }

    .input-icon-wrap {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-lead-icon {
        position: absolute;
        left: 12px;
        font-size: 19px !important;
        color: var(--text-3);
        pointer-events: none;
    }

    .input-icon-wrap input {
        padding-left: 40px;
        min-height: 42px;
        font-size: 14px;
    }

    .input-icon-wrap.pw-wrap input {
        padding-right: 42px;
    }

    .input-icon-wrap:focus-within .input-lead-icon {
        color: var(--primary);
    }

    .login-submit-btn {
        margin-top: 6px;
    }

    .login-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 22px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
    }

    .login-meta-right {
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .status-dot-online {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
    }

    .login-credit {
        text-align: center;
        margin-top: 14px;
        font-size: 11.5px;
        color: var(--text-3);
    }

    /* ---------------------------------------------------------------- 4 Shell */
    .shell {
        min-height: 100%;
    }

    .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 248px;
        background: var(--side-bg);
        color: var(--side-text);
        display: flex;
        flex-direction: column;
        z-index: 40;
        transform: translateX(-100%);
        transition: transform .24s var(--ease-out);
    }

    .sidebar.open {
        transform: none;
        box-shadow: var(--shadow-lg);
    }

    .scrim {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        z-index: 35;
        display: none;
    }

    .scrim.show {
        display: block;
    }

    .side-brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 18px 16px 16px;
        border-bottom: 1px solid var(--side-line);
    }

    .side-toggle {
        display: none;
        place-items: center;
        flex: none;
        width: 28px;
        height: 28px;
        margin-left: auto;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--side-muted);
        cursor: pointer;
    }

    .side-toggle .material-symbols-outlined {
        font-size: 20px;
    }

    .side-toggle:focus-visible {
        outline: 2px solid #A5B4FC;
        outline-offset: 1px;
    }

    @media (hover: hover) {
        .side-toggle:hover {
            background: var(--side-hover);
            color: #FFFFFF;
        }
    }

    .side-title {
        flex: 1;
        min-width: 0;
        color: #FFFFFF;
        font-weight: 700;
        font-size: 14px;
        line-height: 1.25;
    }

    .side-title > div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .side-title small {
        display: block;
        margin-top: 2px;
        font-weight: 500;
        color: var(--side-muted);
        font-size: 11px;
        line-height: 1.3;
        /* nama perusahaan boleh turun ke baris kedua agar tidak terpotong */
        white-space: normal;
        overflow-wrap: anywhere;
    }

    .side-nav {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
    }

    .side-nav a {
        position: relative;
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 38px;
        padding: 0 12px;
        margin: 1px 0;
        border-radius: var(--r);
        color: var(--side-text);
        text-decoration: none;
        font-weight: 500;
        font-size: 13px;
        cursor: pointer;
    }

    @media (hover: hover) {
        .side-nav a:hover {
            background: var(--side-hover);
            color: #FFFFFF;
        }
    }

    .side-nav a.active {
        background: var(--side-active);
        color: #FFFFFF;
        font-weight: 600;
    }

    .side-nav a.active::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 9px;
        bottom: 9px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--side-indicator, #F472B6);
    }

    .side-nav .ico {
        width: 20px;
        display: grid;
        place-items: center;
        flex: none;
        opacity: .9;
    }

    .side-nav .ico .material-symbols-outlined {
        font-size: 20px;
    }

    .side-sec {
        font-size: 11px;
        font-weight: 600;
        color: var(--side-muted);
        padding: 16px 12px 6px;
    }

    .side-foot {
        padding: 10px;
        border-top: 1px solid var(--side-line);
    }

    .side-user {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: 8px;
        margin-bottom: 4px;
        border: 0;
        border-radius: var(--r);
        background: transparent;
        color: #FFFFFF;
        text-align: left;
        cursor: pointer;
    }

    @media (hover: hover) {
        .side-user:hover {
            background: var(--side-hover);
        }
    }

    .side-user .user-meta {
        flex: 1;
        min-width: 0;
        display: block;
    }

    .side-user-ico {
        font-size: 17px !important;
        color: var(--side-muted);
    }

    .side-user #sideUser {
        display: block;
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .side-user small {
        color: var(--side-muted);
        font-size: 11.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
    }

    .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--grad);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        color: #FFFFFF;
        flex: none;
        overflow: hidden;
    }

    /* Foto (avatar) — dipakai sidebar, daftar operator & editor foto */
    .avatar img,
    .op-ava img,
    .foto-ava img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .op-name {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
    }

    .op-ava {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        overflow: hidden;
        flex: none;
        display: inline-grid;
        place-items: center;
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 700;
        font-size: 12px;
    }

    .op-ava.lg {
        width: 40px;
        height: 40px;
        font-size: 15px;
    }

    .op-ava.clickable {
        cursor: zoom-in;
        transition: box-shadow .15s ease;
    }

    .op-ava.clickable:hover,
    .op-ava.clickable:focus-visible {
        box-shadow: 0 0 0 2px var(--primary);
        outline: none;
    }

    .foto-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
    }

    .foto-view img {
        width: 100%;
        max-width: 360px;
        max-height: 60vh;
        object-fit: contain;
        border-radius: 12px;
        display: block;
    }

    .foto-view-empty {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 56px;
        font-weight: 700;
    }

    .foto-edit {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px;
        margin-bottom: 14px;
        border: 1px dashed var(--line-strong);
        border-radius: var(--r-lg);
        background: var(--surface-2);
    }

    .foto-ava {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        overflow: hidden;
        flex: none;
        display: grid;
        place-items: center;
        background: var(--grad);
        color: #FFFFFF;
        font-weight: 700;
        font-size: 26px;
        box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--border);
    }

    .foto-act {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        min-width: 0;
    }

    .foto-act small {
        flex-basis: 100%;
        font-size: 11.5px;
    }

    .side-link {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: var(--side-text);
        min-height: 34px;
        padding: 0 10px;
        border-radius: var(--r);
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 500;
        text-decoration: none;
    }

    .side-link .material-symbols-outlined {
        font-size: 18px;
    }

    @media (hover: hover) {
        .side-link:hover {
            background: var(--side-hover);
            color: #FFFFFF;
        }
    }

    .side-credit {
        padding: 10px 10px 2px;
        font-size: 11px;
        color: var(--side-muted);
        text-align: center;
    }

    .main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: 64px;
        min-width: 0;
    }

    .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 56px;
        padding: 8px 12px;
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: saturate(1.4) blur(12px);
        -webkit-backdrop-filter: saturate(1.4) blur(12px);
        border-bottom: 1px solid var(--line);
    }

    .top-title {
        flex: 1;
        min-width: 0;
    }

    .top-title h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
    }

    .top-title .muted {
        font-size: 12px;
        color: var(--text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .top-actions {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .top-actions .shift-now {
        display: none;
        margin-right: 4px;
    }

    .view {
        padding: 14px 12px 28px;
        outline: none;
        width: 100%;
        min-width: 0;
    }

    .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-nav a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 56px;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--text-3);
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .bottom-nav a .ico {
        display: grid;
        place-items: center;
        width: 44px;
        height: 26px;
        border-radius: 13px;
    }

    .bottom-nav a .ico .material-symbols-outlined {
        font-size: 21px;
    }

    .bottom-nav a.active {
        color: var(--primary);
    }

    .bottom-nav a.active .ico {
        background: var(--primary-soft);
    }

    @media (min-width: 768px) {
        .bottom-nav {
            display: none;
        }

        .main {
            padding-bottom: 0;
        }

        .view {
            padding: 20px 24px 36px;
        }

        .top-actions .shift-now {
            display: inline-flex;
        }

        .topbar {
            padding: 8px 24px;
            min-height: 60px;
        }
    }

    @media (min-width: 1024px) {
        .sidebar {
            transform: none;
        }

        .scrim {
            display: none !important;
        }

        .main {
            margin-left: 248px;
        }

        /* Sidebar mini: hanya ikon (tombol di samping logo) */
        .side-toggle {
            display: grid;
        }

        .sidebar,
        .main {
            transition: width .22s var(--ease-out), margin-left .22s var(--ease-out), transform .24s var(--ease-out);
        }

        .side-mini .sidebar {
            width: 72px;
        }

        .side-mini .main {
            margin-left: 72px;
        }

        .side-mini .side-brand {
            flex-direction: column;
            gap: 8px;
            padding: 14px 8px 12px;
        }

        .side-mini .side-toggle {
            margin-left: 0;
        }

        .side-mini .side-title,
        .side-mini .side-nav .lbl,
        .side-mini .side-user .user-meta,
        .side-mini .side-user-ico,
        .side-mini .side-link > span:not(.material-symbols-outlined),
        .side-mini .side-credit {
            display: none;
        }

        .side-mini .side-sec {
            font-size: 0;
            padding: 0;
            margin: 8px 6px;
            border-top: 1px solid var(--side-line);
        }

        .side-mini .side-nav {
            padding: 10px 8px;
        }

        .side-mini .side-nav a {
            justify-content: center;
            padding: 0;
        }

        .side-mini .side-nav a.active::before {
            left: -8px;
        }

        .side-mini .side-user,
        .side-mini .side-link {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }

        .only-mobile {
            display: none !important;
        }
    }

    /* ---------------------------------------------------------------- 5 Konten */
    .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-xs);
        padding: 16px;
        margin-bottom: 16px;
    }

    @media (min-width: 768px) {
        .card {
            padding: 18px 20px;
        }
    }

    .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }

    .card-head h2,
    .card-head h3 {
        margin: 0;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: -0.005em;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .card-head h2 .material-symbols-outlined,
    .card-head h3 .material-symbols-outlined {
        font-size: 20px !important;
        color: var(--text-3) !important;
        margin: 0 !important;
    }

    details.card > summary,
    .more-card > summary {
        cursor: pointer;
        font-weight: 600;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    details.card > summary::-webkit-details-marker {
        display: none;
    }

    details.card > summary::before {
        content: "chevron_right";
        font-family: 'Material Symbols Outlined';
        font-size: 20px;
        color: var(--text-3);
        transition: transform .15s ease;
    }

    details.card[open] > summary::before {
        transform: rotate(90deg);
    }

    .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
    }

    .toolbar input[type="date"],
    .toolbar select {
        width: auto;
        min-width: 140px;
        min-height: 34px;
        padding-top: 5px;
        padding-bottom: 5px;
    }

    .toolbar input[type="search"],
    .toolbar input[type="text"] {
        min-height: 34px;
        padding-top: 5px;
        padding-bottom: 5px;
    }

    .toolbar .btn {
        min-height: 34px;
    }

    .toolbar .spacer,
    .spacer {
        flex: 1;
    }

    /* KPI */
    .kpis {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
    }

    @media (min-width: 640px) {
        .kpis {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
    }

    @media (min-width: 1200px) {
        .kpis {
            grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        .kpis.k4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
    }

    @media (min-width: 640px) and (max-width: 1199px) {
        .kpis.k4 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    .kpi {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 14px 16px;
        box-shadow: var(--shadow-xs);
        display: flex;
        flex-direction: column;
        min-height: 104px;
        min-width: 0;
    }

    .kpi .lbl {
        font-size: 12px;
        color: var(--text-2);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .kpi .val {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 6px 0 2px;
        line-height: 1.15;
        white-space: nowrap;
    }

    .kpi .val small {
        letter-spacing: 0;
        font-weight: 500;
    }

    .kpi .sub {
        margin-top: auto;
        font-size: 12px;
        color: var(--text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .kpi.hero {
        background: var(--grad);
        border-color: transparent;
        color: #FFFFFF;
    }

    .kpi.hero .lbl,
    .kpi.hero .sub {
        color: rgba(255, 255, 255, 0.88);
    }

    .kpi.hero .val {
        font-size: 32px;
    }

    /* Bagian / progress */
    .bars {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
    }

    @media (min-width: 700px) {
        .bars {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (min-width: 1200px) {
        .bars {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
    }

    .bag-card {
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 14px;
        background: var(--surface);
        min-width: 0;
    }

    .bag-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
    }

    .bag-name {
        font-weight: 600;
        font-size: 13.5px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .bag-num {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
    }

    .bag-num small {
        font-size: 13px;
        color: var(--text-3);
        font-weight: 500;
    }

    .progress {
        height: 6px;
        background: var(--surface-3);
        border-radius: 999px;
        overflow: hidden;
        margin: 10px 0;
    }

    .progress > div {
        height: 100%;
        background: var(--grad);
        border-radius: 999px;
        transition: transform .4s var(--ease-out);
    }

    .progress.low > div {
        background: linear-gradient(90deg, #F59E0B, #DC2626);
    }

    .bag-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
    }

    .names {
        font-size: 12px;
        color: var(--text-2);
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
        line-height: 1.6;
    }

    .names b {
        color: var(--text);
        font-weight: 600;
    }

    /* Tabel */
    .table-wrap {
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        /* Isi tinggi layar: dikurangi topbar + toolbar + padding halaman */
        max-height: max(360px, calc(100vh - 175px));
        max-height: max(360px, calc(100dvh - 175px));
        background: var(--surface);
    }

    table.tbl {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: 13px;
    }

    .tbl th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--surface);
        background-image: var(--th-bg);
        color: var(--th-text);
        font-size: 12px;
        font-weight: 600;
        text-align: left;
        padding: 10px 12px;
        white-space: nowrap;
        border-bottom: 1px solid var(--border);
    }

    .tbl td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
    }

    .tbl tr:last-child td {
        border-bottom: 0;
    }

    @media (hover: hover) {
        .tbl tbody tr:hover td {
            background: var(--surface-2);
        }
    }

    .tbl .num {
        text-align: right;
    }

    .tbl .act {
        text-align: right;
        white-space: nowrap;
    }

    .tbl input,
    .tbl select,
    .kode-tbl input,
    .kode-tbl select {
        min-height: 32px;
        padding: 4px 8px;
    }

    .rk-row {
        cursor: pointer;
    }

    /* List mobile */
    .list-item {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
    }

    .list-item:last-child {
        border-bottom: 0;
    }

    .list-item .grow {
        flex: 1;
        min-width: 0;
    }

    .list-item b {
        display: block;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .only-wide {
        display: none;
    }

    @media (min-width: 800px) {
        .only-wide {
            display: block;
        }

        .only-narrow {
            display: none;
        }
    }

    /* Empty state */
    .empty {
        text-align: center;
        color: var(--text-2);
        padding: 36px 16px;
    }

    .empty .big {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin: 0 auto 12px;
        border-radius: 14px;
        background: var(--surface-3);
        color: var(--text-3);
        font-size: 26px;
    }

    .empty .big .material-symbols-outlined {
        font-size: 28px !important;
        color: var(--text-3) !important;
    }

    .empty p {
        margin: 0 0 12px;
    }

    /* ---------------------------------------------------------------- 6 Absensi */
    .abs-summary-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 14px 16px;
        margin-bottom: 16px;
        box-shadow: var(--shadow-xs);
    }

    .abs-kpi-group {
        display: flex;
        align-items: stretch;
        gap: 0;
        flex-wrap: wrap;
    }

    .abs-kpi {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 0 20px;
        border-left: 1px solid var(--line);
    }

    .abs-kpi:first-child {
        padding-left: 0;
        border-left: 0;
    }

    .abs-kpi-lbl {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
        white-space: nowrap;
    }

    .abs-kpi-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.15;
    }

    .abs-kpi.ok .abs-kpi-val {
        color: var(--ok);
    }

    .abs-kpi.warn .abs-kpi-val {
        color: var(--warn);
    }

    .abs-kpi.err .abs-kpi-val {
        color: var(--err);
    }

    @media (max-width: 600px) {
        .abs-kpi {
            padding: 0 12px;
        }

        .abs-kpi-val {
            font-size: 19px;
        }
    }

    .grp {
        margin-bottom: 16px;
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        background: var(--surface);
        overflow: hidden;
        box-shadow: var(--shadow-xs);
    }

    .grp-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 14px;
        background: var(--surface);
        background-image: var(--th-bg);
        color: var(--th-text);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        font-size: 13.5px;
    }

    .grp-head .spacer {
        flex: 1;
    }

    .grp-body {
        background: var(--surface);
    }

    /* Grup divisi Absensi: buka / tutup + warna status */
    .grp[data-grp] > .grp-head {
        cursor: pointer;
        user-select: none;
        border-left: 4px solid transparent;
    }

    .grp[data-grp]:not(.open) > .grp-head {
        border-bottom: 0;
    }

    .grp[data-grp]:not(.open) > .grp-body {
        display: none;
    }

    .grp-chev {
        font-size: 20px !important;
        transition: transform .18s cubic-bezier(.23, 1, .32, 1);
        transform: rotate(-90deg);
    }

    .grp.open .grp-chev {
        transform: none;
    }

    .grp.grp-todo {
        border-color: var(--err-line);
    }

    .grp.grp-todo > .grp-head {
        background: var(--err-bg);
        background-image: none;
        color: var(--err);
        border-left-color: var(--err);
    }

    .grp.grp-todo .grp-st {
        background: var(--err);
        color: #fff;
    }

    .grp.grp-done {
        border-color: var(--ok-line);
    }

    .grp.grp-done > .grp-head {
        background: var(--ok-bg);
        background-image: none;
        color: var(--ok);
        border-left-color: var(--ok);
    }

    .grp.grp-done .grp-st {
        background: var(--ok);
        color: #fff;
    }

    .grp-head:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
    }

    .att {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        box-shadow: inset 3px 0 0 transparent;
    }

    .att:last-child {
        border-bottom: 0;
    }

    @media (hover: hover) {
        .att:hover {
            background: var(--surface-2);
        }
    }

    @media (min-width: 900px) {
        .att {
            grid-template-columns: 128px minmax(160px, 1.3fr) minmax(220px, auto) minmax(180px, 1fr);
            align-items: center;
            gap: 14px;
        }
    }

    .att.is-clocked-in {
        box-shadow: inset 3px 0 0 var(--ok);
    }

    .att-name {
        font-weight: 600;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        min-width: 0;
    }

    .att-name small {
        font-weight: 500;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
    }

    .stat-btns {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 4px;
    }

    .stat-btns button {
        min-height: 34px;
        min-width: 34px;
        border-radius: var(--r-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
        color: var(--text-2);
        transition: background-color .12s ease, border-color .12s ease, color .12s ease;
    }

    @media (hover: hover) {
        .stat-btns button:not(:disabled):not(.on):hover {
            border-color: var(--line-strong);
            color: var(--text);
            background: var(--surface-2);
        }
    }

    .stat-btns button:disabled {
        cursor: not-allowed;
        opacity: .55;
    }

    .stat-btns button.on {
        color: #FFFFFF;
    }

    .stat-btns button.on[data-s="H"] {
        background: var(--ok);
        border-color: var(--ok);
    }

    .stat-btns button.on[data-s="T"] {
        background: var(--info);
        border-color: var(--info);
    }

    .stat-btns button.on[data-s="S"],
    .stat-btns button.on[data-s="I"] {
        background: var(--warn);
        border-color: var(--warn);
    }

    .stat-btns button.on[data-s="C"] {
        background: var(--violet);
        border-color: var(--violet);
    }

    .stat-btns button.on[data-s="A"] {
        background: var(--err);
        border-color: var(--err);
    }

    [data-theme="evening"] .stat-btns button.on {
        color: #0B0D13;
    }

    .att-extra {
        display: flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
    }

    .att-extra input {
        min-height: 32px;
        padding: 4px 9px;
        font-size: 12.5px;
    }

    .att-extra .lem {
        width: 84px;
        flex: none;
    }

    .saving {
        opacity: .6;
    }

    .clockin-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
        width: fit-content;
        transition: background-color .12s ease, border-color .12s ease, color .12s ease;
    }

    .clockin-pill input {
        display: none;
    }

    .clockin-pill .material-symbols-outlined {
        font-size: 18px !important;
    }

    @media (hover: hover) {
        .clockin-pill:hover {
            border-color: var(--ok);
            color: var(--ok);
        }
    }

    .clockin-pill.on {
        background: var(--ok-bg);
        border-color: var(--ok-line);
        color: var(--ok);
    }

    .clockin-pill.on .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }

    /* Slot vacant di absensi */
    .att.vac-fill-row {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 10px 12px;
        flex-wrap: wrap;
        background: var(--warn-bg);
        box-shadow: inset 3px 0 0 var(--warn);
    }

    .vac-fill-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--surface);
        color: var(--warn);
        border: 1px solid var(--warn-line);
        font-size: 12px;
        font-weight: 600;
        flex-shrink: 0;
    }

    .vac-fill-badge .material-symbols-outlined {
        font-size: 16px !important;
    }

    .vac-fill-control {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 280px;
        min-width: 0;
    }

    .vac-fill-input {
        flex: 1;
        min-width: 160px;
        min-height: 34px;
        border-color: var(--warn-line);
    }

    .vac-fill-btn {
        flex-shrink: 0;
    }

    /* ---------------------------------------------------------------- 7 Jadwal */
    .brushbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin: 0 0 12px;
        padding: 8px 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
    }

    .brushbar:empty {
        display: none;
    }

    .brush-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        display: flex;
        align-items: center;
        gap: 4px;
        margin-right: 2px;
    }

    .brush-title .material-symbols-outlined {
        font-size: 17px;
    }

    .kb {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        min-height: 28px;
        padding: 0 9px;
        font-weight: 600;
        font-size: 11.5px;
        cursor: pointer;
        background: var(--surface);
        color: var(--text);
        user-select: none;
    }

    .kb.on {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
    }

    .brush-hint {
        margin-left: 4px;
        font-size: 11.5px;
        color: var(--text-3);
    }

    .wk-wrap {
        max-height: none;
        width: 100%;
        overflow-x: auto;
    }

    table.wk {
        border-collapse: separate;
        border-spacing: 0;
        font-size: 11.5px;
        width: 100%;
        min-width: 100%;
    }

    .wk th,
    .wk td {
        border-bottom: 1px solid var(--line);
        border-right: 1px solid var(--line);
        padding: 0;
        text-align: center;
        white-space: nowrap;
        height: 28px;
    }

    .wk thead th {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--surface);
        background-image: var(--th-bg);
        color: var(--th-text);
        padding: 5px 4px;
        font-size: 11px;
        font-weight: 600;
        border-bottom-color: var(--border);
    }

    .wk thead th.c-day span {
        display: block;
        font-weight: 500;
        font-size: 10px;
        line-height: 1.1;
        color: var(--text-3);
    }

    .wk thead th.c-day b {
        font-size: 12px;
        line-height: 1.3;
        color: var(--text);
    }

    .wk thead th.today {
        box-shadow: inset 0 -2.5px 0 var(--pink);
    }

    .wk thead th.today b,
    .wk thead th.today span {
        color: var(--primary);
    }

    .wk .c-no {
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--surface);
        width: 34px;
        min-width: 34px;
        max-width: 34px;
        color: var(--text-3);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        padding: 0 2px;
    }

    .wk thead th.c-no,
    .wk thead th.c-nama {
        z-index: 5;
        background: var(--surface);
        background-image: var(--th-bg);
    }

    .wk .c-nama {
        position: sticky;
        left: 34px;
        z-index: 2;
        background: var(--surface);
        text-align: left;
        padding: 3px 8px;
        min-width: 150px;
        max-width: 230px;
        box-shadow: 1px 0 0 var(--border);
    }

    .wk .c-nama b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
    }

    /* Control Akses: level per menu */
    select.ak-lv {
        min-height: 32px;
        padding: 0 26px 0 10px;
        font-size: 12.5px;
        font-weight: 600;
        border-radius: 8px;
        width: auto;
        min-width: 112px;
    }

    select.ak-lv.lv-N {
        color: var(--text-3);
    }

    select.ak-lv.lv-R {
        color: #B45309;
        background-color: #FFFBEB;
        border-color: #FCD34D;
    }

    select.ak-lv.lv-E {
        color: var(--ok);
        background-color: var(--ok-bg);
        border-color: var(--ok-line);
    }

    [data-theme="evening"] select.ak-lv.lv-R {
        color: #FCD34D;
        background-color: rgba(245, 158, 11, 0.14);
    }

    .ak-user-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
        gap: 8px;
    }

    .ak-user-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
    }

    .ro-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
    }

    /* Data Absensi */
    .da-kpis {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-bottom: 14px;
    }

    @media (min-width: 900px) {
        .da-kpis {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
    }

    .da-kpis .val {
        font-variant-numeric: tabular-nums;
    }

    .tbl tr.da-day td {
        background: var(--surface-2, var(--primary-soft));
        padding: 8px 12px;
        font-size: 12.5px;
    }

    .tbl td.nowrap,
    .tbl .nowrap {
        white-space: nowrap;
    }

    .da-day-n {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-2, var(--text));
        background: var(--primary-soft);
        border-bottom: 1px solid var(--line);
    }

    .da-st {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex: none;
    }

    /* Data Absensi: tab Employee IEG / RKA */
    .da-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 4px;
        margin-bottom: 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-lg, 14px);
        background: var(--surface-2);
        max-width: 440px;
    }

    .da-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 14px;
        border: 0;
        border-radius: calc(var(--r-lg, 14px) - 4px);
        background: transparent;
        color: var(--text-2);
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .da-tab .material-symbols-outlined {
        font-size: 19px;
    }

    .da-tab-n {
        min-width: 24px;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--surface-3);
        color: var(--text-2);
        font-size: 11.5px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
    }

    .da-tab.on {
        background: var(--surface);
        color: var(--primary);
        box-shadow: 0 1px 2px rgba(15, 23, 42, .08), 0 0 0 1px var(--line);
    }

    .da-tab.on .da-tab-n {
        background: var(--primary);
        color: #fff;
    }

    @media (hover: hover) {
        .da-tab:not(.on):hover {
            color: var(--text);
            background: var(--surface-3);
        }
    }

    .da-tab:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
    }

    /* Data Absensi: sel status di grid mingguan */
    .da-wk .c-day {
        min-width: 46px;
        padding: 3px;
    }

    .da-wk tbody td.c-day.today {
        background: var(--primary-soft);
    }

    .da-c {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-width: 34px;
        height: 30px;
        border-radius: 6px;
        color: var(--text-3);
        font-size: 12px;
        line-height: 1;
        cursor: default;
    }

    .da-c b {
        font-size: 12px;
        font-weight: 700;
    }

    .da-c small {
        margin-top: 2px;
        font-size: 9px;
        font-weight: 600;
        opacity: .75;
        letter-spacing: .02em;
    }

    .da-c.fut {
        opacity: .35;
    }

    .da-c.st-H { background: var(--ok-bg); color: var(--ok); }
    .da-c.st-T { background: var(--info-bg); color: var(--info); }
    .da-c.st-S,
    .da-c.st-I { background: var(--warn-bg); color: var(--warn); }
    .da-c.st-C { background: var(--primary-soft); color: var(--primary); }
    .da-c.st-A { background: var(--err-bg); color: var(--err); }
    .da-c.st-OFF { background: var(--surface-3); color: var(--text-3); }
    .da-c.da-ubah { box-shadow: inset 0 0 0 1.5px currentColor; }

    .da-ot {
        position: absolute;
        top: 3px;
        right: 3px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--pink, var(--primary));
    }

    .da-wk .c-jam.good {
        color: var(--ok);
    }

    .da-legend {
        gap: 6px 14px;
    }

    .da-lg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-2);
    }

    .da-lg .da-c {
        width: 26px;
        min-width: 26px;
        height: 22px;
    }

    /* Approval Request OS: grup "Sudah Di-Approve" */
    .ra-ap {
        padding: 0;
        overflow: hidden;
        margin-bottom: 14px;
    }

    .ra-ap > summary,
    .ra-ap-item > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .ra-ap > summary::-webkit-details-marker,
    .ra-ap-item > summary::-webkit-details-marker {
        display: none;
    }

    .ra-ap-head {
        padding: 14px 16px;
        background: linear-gradient(90deg, var(--ok-bg), transparent 70%);
    }

    .ra-ap[open] > .ra-ap-head {
        border-bottom: 1px solid var(--line);
    }

    .ra-ap-hic,
    .ra-ap-ic {
        flex: none;
        display: inline-grid;
        place-items: center;
        border-radius: 10px;
        background: var(--ok-bg);
        color: var(--ok);
    }

    .ra-ap-hic {
        width: 38px;
        height: 38px;
    }

    .ra-ap-ic {
        width: 30px;
        height: 30px;
        border-radius: 8px;
    }

    .ra-ap-ic .material-symbols-outlined {
        font-size: 18px;
    }

    .ra-ap-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .ra-ap-main small,
    .ra-ap-meta small {
        color: var(--text-3);
        font-size: 11.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .ra-ap-head .ra-ap-main b {
        font-size: 15px;
    }

    .ra-ap-chev {
        flex: none;
        color: var(--text-3);
        transition: transform .2s ease;
    }

    .ra-ap[open] > summary .ra-ap-chev,
    .ra-ap-item[open] > summary .ra-ap-chev {
        transform: rotate(180deg);
    }

    .ra-ap-day {
        padding: 12px 16px 4px;
    }

    .ra-ap-day + .ra-ap-day {
        border-top: 1px dashed var(--line);
    }

    .ra-ap-date {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-2);
    }

    .ra-ap-date .material-symbols-outlined {
        font-size: 17px;
        color: var(--primary);
    }

    .ra-ap-date .muted {
        font-weight: 500;
    }

    .ra-ap-item {
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        transition: border-color .18s ease, box-shadow .18s ease;
    }

    .ra-ap-item > summary {
        padding: 10px 12px;
    }

    .ra-ap-item[open] {
        border-color: var(--ok);
        box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }

    @media (hover: hover) {
        .ra-ap-item:not([open]):hover {
            border-color: var(--border);
            background: var(--surface-2);
        }
    }

    .ra-ap-meta {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
    }

    .ra-ap-body {
        padding: 4px 12px 12px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
    }

    .ra-ap > summary:focus-visible,
    .ra-ap-item > summary:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
    }

    @media (max-width: 767px) {
        .ra-ap-head,
        .ra-ap-day {
            padding-left: 12px;
            padding-right: 12px;
        }

        .ra-ap-meta small {
            display: none;
        }

        .ra-ap-main small {
            white-space: normal;
        }
    }

    /* Data Absensi: toolbar satu baris (minggu · divisi · cari · aksi) */
    .toolbar.da-bar {
        flex-wrap: nowrap;
        gap: 8px;
    }

    .da-week {
        flex: none;
        display: flex;
        align-items: stretch;
        height: 38px;
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        background: var(--surface);
        box-shadow: var(--shadow-xs);
        overflow: hidden;
    }

    .da-step {
        display: inline-grid;
        place-items: center;
        width: 34px;
        border: 0;
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
        transition: background-color .15s ease, color .15s ease;
    }

    .da-step .material-symbols-outlined {
        font-size: 20px;
    }

    @media (hover: hover) {
        .da-step:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }
    }

    .da-week .dp-trig {
        height: 100%;
        min-height: 0;
        border: 0;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        border-radius: 0;
        box-shadow: none;
        min-width: 190px;
    }

    .da-bar > select {
        flex: 0 1 180px;
        min-width: 130px;
        height: 38px;
        border-radius: var(--r-lg);
    }

    .da-search {
        flex: 1 1 200px;
        min-width: 140px;
        position: relative;
        display: flex;
        align-items: center;
    }

    .da-search .material-symbols-outlined {
        position: absolute;
        left: 11px;
        font-size: 19px;
        color: var(--text-3);
        pointer-events: none;

        transform: rotate(180deg);
    }

    @media (hover: hover) {
        .dp-trig:not(:disabled):hover {
            border-color: var(--primary);

    .dp-trig:focus-visible,

        box-shadow: inset 0 0 0 2px var(--primary);
    }

    .dp-trig:disabled {
        background: var(--surface-2);
        color: var(--text-3);
        cursor: not-allowed;
        box-shadow: none;
    }

    .dp-back {
        display: none;
    }

    .dp-pop {
        position: fixed;
        z-index: 200;
        width: 300px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow-lg);
        opacity: 0;
        transform: translateY(-4px) scale(.98);
        transform-origin: top left;
        transition: opacity .16s var(--ease-out), transform .16s var(--ease-out);
    }

    .dp-pop.week {
        width: 330px;
    }

    .dp-pop.show {
        opacity: 1;
        transform: none;
    }

    .dp-grab,
    .dp-x {
        display: none;
    }

    .dp-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 8px;
    }

    .dp-nav,
    .dp-title {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
        border-radius: 10px;
        transition: background-color .15s ease;
    }

    .dp-nav {
        width: 34px;
        height: 34px;
        color: var(--text-2);
    }

    .dp-title {
        gap: 4px;
        height: 34px;
        padding: 0 10px;
        font-size: 14.5px;
        font-weight: 600;
    }

    .dp-title b {
        color: var(--primary);
    }

    .dp-title .material-symbols-outlined {
        font-size: 18px;
        color: var(--text-3);
    }

    @media (hover: hover) {
        .dp-nav:hover,
        .dp-title:hover {
            background: var(--surface-2);
        }
    }

    .dp-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        row-gap: 2px;
    }

    .dp-grid.week {
        grid-template-columns: 30px repeat(7, 1fr);
    }

    .dp-row {
        display: contents;
    }

    .dp-wh {
        display: grid;
        place-items: center;
        height: 28px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    .dp-wh.we {
        color: var(--err);
        opacity: .75;
    }

    .dp-wn {
        display: grid;
        place-items: center;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
    }

    .dp-d {
        position: relative;
        height: 36px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        transition: background-color .12s ease, color .12s ease;
    }

    .dp-d.we {
        color: var(--err);
    }

    .dp-d.out {
        color: var(--text-3);
        opacity: .55;
    }

    .dp-d.today::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 5px;
        width: 4px;
        height: 4px;
        margin-left: -2px;
        border-radius: 50%;
        background: var(--primary);
    }

    .dp-d:disabled {
        opacity: .25;
        cursor: not-allowed;
    }

    @media (hover: hover) {
        .dp-grid:not(.week) .dp-d:not(:disabled):not(.sel):hover {
            background: var(--primary-soft);
            color: var(--primary);
        }
    }

    .dp-d.sel {
        background: linear-gradient(135deg, var(--primary), var(--primary-2, var(--primary)));
        color: #fff;
        font-weight: 700;
        box-shadow: 0 4px 12px -4px var(--primary);
    }

    .dp-d.sel::after {
        background: #fff;
    }

    .dp-d:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
    }

    /* Mode minggu: satu baris (Sen–Min) disorot sebagai satu pita */
    .dp-grid.week .dp-d {
        border-radius: 0;
    }

    .dp-row.hov .dp-d,
    .dp-row.now .dp-d {
        background: var(--primary-soft);
    }

    .dp-row.hov .dp-d:nth-child(2),
    .dp-row.now .dp-d:nth-child(2),
    .dp-row.sel .dp-d:nth-child(2) {
        border-radius: 10px 0 0 10px;
    }

    .dp-row.hov .dp-d:last-child,
    .dp-row.now .dp-d:last-child,
    .dp-row.sel .dp-d:last-child {
        border-radius: 0 10px 10px 0;
    }

    .dp-row.sel .dp-d {
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        opacity: 1;
    }

    .dp-row.sel .dp-d.today::after {
        background: #fff;
    }

    .dp-row.sel .dp-wn,
    .dp-row.hov .dp-wn {
        color: var(--primary);
        font-weight: 700;
    }

    .dp-months {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 4px 0;
    }

    .dp-mo {
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color .12s ease, color .12s ease;
    }

    .dp-mo.today {
        box-shadow: inset 0 0 0 1.5px var(--primary);
    }

    .dp-mo.sel {
        background: var(--primary);
        color: #fff;
        font-weight: 700;
    }

    @media (hover: hover) {
        .dp-mo:not(.sel):hover {
            background: var(--primary-soft);
            color: var(--primary);
        }
    }

    .dp-foot {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
    }

    .dp-quick {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        flex: 1;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 10px;
        background: var(--primary-soft);
        color: var(--primary);
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: filter .15s ease, background-color .15s ease;
    }

        font-size: 17px;

    }

    @media (max-width: 767px) {
        .toolbar > .dp-trig {
            flex: 1 1 140px;
            min-width: 0;

            border-radius: 10px;

    /* HP: kalender tampil sebagai bottom sheet */
    @media (max-width: 640px) {
        .dp-back {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 199;
            background: var(--overlay);
            opacity: 0;
            transition: opacity .2s ease;
        }

        .dp-back.show {
            opacity: 1;
        }

        .dp-pop.sheet {
            left: 0 !important;
            right: 0;
            top: auto !important;
            bottom: 0;
            width: auto;
            padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
            border-radius: 20px 20px 0 0;
            border-bottom: 0;
            transform: translateY(100%);
            transition: transform .28s var(--ease-out), opacity .2s ease;
        }

        .dp-pop.sheet.show {
            transform: none;
        }

        .dp-pop.sheet .dp-x {
            display: flex;
            position: absolute;
            top: 6px;
            right: 8px;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--text-2);
            cursor: pointer;
        }

        }

            display: block;
            width: 40px;
            height: 4px;
            margin: 0 auto 10px;
            border-radius: 4px;
            background: var(--line);
        }

        .dp-pop.sheet .dp-d {
            height: 44px;
            font-size: 14.5px;
        }

        .dp-pop.sheet .dp-quick {
            height: 42px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .dp-pop,
        .dp-pop.sheet,
        .dp-back,
        .dp-trig .dp-car {
            transition: none;
        }
